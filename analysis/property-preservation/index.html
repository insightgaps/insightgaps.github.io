<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPCS Property Preservation Intelligence OS — Insight Gaps Bureau</title>
  <meta name="description" content="Operational dashboard tracking work order performance, margin leakage, and ZIP coverage for property preservation.">
  
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://insightgaps.com/analysis/property-preservation/">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="os-assets/os-shell.css">
  <link rel="stylesheet" href="os-assets/os-views.css">
</head>
<body>

  <div class="os-shell">
    
    <!-- Sidebar -->
    <aside class="os-sidebar">
      
      <!-- Logo block -->
      <div class="os-sidebar__logo-block">
        <div class="os-sidebar__logo-badge">EP</div>
        <div class="os-sidebar__brand">
          <span class="os-sidebar__brand-name">Property Preservation</span>
          <span class="os-sidebar__brand-sub">INTELLIGENCE OS</span>
        </div>
      </div>

      <!-- Navigation items -->
      <nav class="os-nav">
        <a class="os-nav__item active" data-view="pulse">
          <span class="os-nav__icon">⚡</span>
          <span class="os-nav__label">Morning Pulse</span>
        </a>
        <a class="os-nav__item" data-view="financial">
          <span class="os-nav__icon">💰</span>
          <span class="os-nav__label">Financials</span>
        </a>
        <a class="os-nav__item" data-view="leakage">
          <span class="os-nav__icon">🔍</span>
          <span class="os-nav__label">Leakage Breakdown</span>
        </a>
        <a class="os-nav__item" data-view="workorders">
          <span class="os-nav__icon">📋</span>
          <span class="os-nav__label">Work Orders</span>
          <span class="os-nav__badge" id="badge-workorders">0</span>
        </a>
        <a class="os-nav__item" data-view="contractors">
          <span class="os-nav__icon">👷</span>
          <span class="os-nav__label">Contractors</span>
        </a>
        <a class="os-nav__item" data-view="communications">
          <span class="os-nav__icon">💬</span>
          <span class="os-nav__label">Communications</span>
          <span class="os-nav__badge" id="badge-comms">0</span>
        </a>
        <a class="os-nav__item" data-view="zip">
          <span class="os-nav__icon">🗺️</span>
          <span class="os-nav__label">ZIP Intelligence</span>
        </a>
        <a class="os-nav__item" data-view="workbook">
          <span class="os-nav__icon">📊</span>
          <span class="os-nav__label">Workbook</span>
        </a>
        <a class="os-nav__item" data-view="photoqc">
          <span class="os-nav__icon">📷</span>
          <span class="os-nav__label">Photo QC</span>
          <span class="os-nav__badge" id="badge-qc">0</span>
        </a>
        <a class="os-nav__item" data-view="bidgenerator">
          <span class="os-nav__icon">💡</span>
          <span class="os-nav__label">Bid Generator</span>
        </a>
      </nav>

      <!-- Sidebar footer -->
      <div class="os-sidebar__footer">
        <span class="os-sidebar__data-tag">Real data · Demo instance</span>
        <span class="os-sidebar__period">Nov 2025 – Jun 2026</span>
        <a href="https://insightgaps.com" class="os-sidebar__site-link">← insightgaps.com</a>
      </div>

    </aside>

    <!-- Main Content Area -->
    <main class="os-content">
      
      <!-- Content Header (Filter Bar) -->
      <header class="os-filter-bar">
        <div class="os-filter-bar__left">
          <h1 class="os-filter-bar__view-title" id="current-view-title">Morning Pulse</h1>
        </div>
        
        <div class="os-filter-bar__controls">
          <select class="os-filter" id="filter-month">
            <option value="all">All Period</option>
            <option value="2025-11">Nov 2025</option>
            <option value="2025-12">Dec 2025</option>
            <option value="2026-01">Jan 2026</option>
            <option value="2026-02">Feb 2026</option>
            <option value="2026-03">Mar 2026</option>
            <option value="2026-04">Apr 2026</option>
            <option value="2026-05">May 2026</option>
            <option value="2026-06">Jun 2026</option>
          </select>
          
          <select class="os-filter" id="filter-client">
            <option value="all">All Clients</option>
            <option value="MCS">MCS</option>
            <option value="ServiceLink">ServiceLink</option>
            <option value="FiveBrothers">Five Brothers</option>
            <option value="MSI">MSI</option>
            <option value="Safeguard">Safeguard</option>
            <option value="ZVN">ZVN</option>
          </select>
          
          <select class="os-filter" id="filter-contractor">
            <option value="all">All Contractors</option>
            <!-- Dynamically populated -->
          </select>
          
          <button class="os-filter-reset" id="filter-reset">Clear ×</button>
        </div>
      </header>

      <!-- Sub-view content loaded here -->
      <div class="os-view-container" id="view-container">
        <!-- Loaded via AJAX -->
      </div>

    </main>

  </div>

  <!-- Data and Shell Scripts -->
  <script src="data/epcs_data.js"></script>
  <script src="os-assets/os-nav.js"></script>
</body>
</html>
