<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Property Master spine: one record per property, keyed by address</title>
<desc id="desc">One property record, keyed by address first, never by work-order number alone. It holds portal history, live work, photo sets with QC verdicts, bids and outcomes, crew visits, invoices, payments with proofs, and profit per order and lifetime. Diagram only, fake data.</desc>
<rect width="1000" height="460" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#222222">PROPERTY MASTER — THE SPINE (FAKE)</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">One record per property. Address first, never number alone.</text>
<rect x="250" y="100" width="500" height="80" rx="12" fill="#8b1e1e"/>
<text x="500" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">ONE PROPERTY RECORD</text>
<text x="500" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#ffffff">Keyed by ADDRESS · Chains + cap ledger live here</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="210" width="300" height="90" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="170" y="250" font-size="21" font-weight="bold" fill="#222222">PORTAL HISTORY</text>
<text x="170" y="278" font-size="17" fill="#333333">Past bids + closed orders</text>
<rect x="340" y="210" width="300" height="90" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="490" y="250" font-size="21" font-weight="bold" fill="#222222">LIVE WORK</text>
<text x="490" y="278" font-size="17" fill="#333333">Orders, visits, deadlines</text>
<rect x="660" y="210" width="300" height="90" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="810" y="250" font-size="21" font-weight="bold" fill="#222222">PHOTOS + QC</text>
<text x="810" y="278" font-size="17" fill="#333333">Sets + verdicts, by area</text>
<rect x="20" y="320" width="300" height="90" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="170" y="360" font-size="21" font-weight="bold" fill="#222222">BIDS + OUTCOMES</text>
<text x="170" y="388" font-size="17" fill="#333333">Price intelligence</text>
<rect x="340" y="320" width="300" height="90" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="490" y="360" font-size="21" font-weight="bold" fill="#222222">INVOICES</text>
<text x="490" y="388" font-size="17" fill="#333333">Built from QC-passed proof</text>
<rect x="660" y="320" width="300" height="90" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="810" y="360" font-size="21" font-weight="bold" fill="#222222">PAYMENTS + PROFIT</text>
<text x="810" y="388" font-size="17" fill="#333333">Proofs matched, per order</text>
</g>
<text x="500" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">A renumbered order at the same address is the same job. — DEMO, ALL DATA FAKE</text>
</svg>
