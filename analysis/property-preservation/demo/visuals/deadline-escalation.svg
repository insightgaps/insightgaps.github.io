<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Deadline escalation: silent, digest, direct flag</title>
<desc id="desc">Three stages: silent until T-48 hours, surfaces in the digest at T-24 hours, direct flag at T-4 hours if still open. An open follow-up is a payment-risk flag from the day it appears. Diagram only, fake data.</desc>
<rect width="1000" height="380" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#222222">DEADLINE ESCALATION (FAKE)</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Every dated obligation becomes a deadline record.</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="100" width="300" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="170" y="150" font-size="26" font-weight="bold" fill="#222222">T-48 HOURS</text>
<text x="170" y="185" font-size="18" fill="#333333">Silent. No noise</text>
<text x="170" y="210" font-size="18" fill="#333333">until this point.</text>
<rect x="340" y="100" width="300" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="490" y="150" font-size="26" font-weight="bold" fill="#222222">T-24 HOURS</text>
<text x="490" y="185" font-size="18" fill="#333333">Surfaces in</text>
<text x="490" y="210" font-size="18" fill="#333333">the digest.</text>
<rect x="660" y="100" width="300" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="810" y="150" font-size="26" font-weight="bold" fill="#222222">T-4 HOURS</text>
<text x="810" y="185" font-size="18" fill="#333333">Direct flag if</text>
<text x="810" y="210" font-size="18" fill="#333333">still open.</text>
</g>
<rect x="150" y="270" width="700" height="60" rx="12" fill="#8b1e1e"/>
<text x="500" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">OPEN FOLLOW-UP = PAYMENT-RISK FLAG, DAY ONE</text>
<text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">No dismiss: an exception closes only via a recorded adjustment. — DEMO, ALL DATA FAKE</text>
</svg>
