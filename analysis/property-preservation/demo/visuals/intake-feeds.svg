<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Intake: four feeds, one Property Master record</title>
<desc id="desc">Four feeds in the real system's order: live engine photos, email instructions, payment screenshots, portal history. All four file into one Property Master record. Diagram only, fake data.</desc>
<rect width="1000" height="440" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#222222">INTAKE — FOUR FEEDS, ONE RECORD (FAKE)</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Work arrives from four places, in this order.</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="100" width="220" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="130" y="145" font-size="22" font-weight="bold" fill="#222222">1 · LIVE ENGINE</text>
<text x="130" y="180" font-size="17" fill="#333333">Crew photos arrive,</text>
<text x="130" y="203" font-size="17" fill="#333333">scanned + QC-checked</text>
<rect x="260" y="100" width="220" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="370" y="145" font-size="22" font-weight="bold" fill="#222222">2 · EMAIL</text>
<text x="370" y="180" font-size="17" fill="#333333">Job notes + client</text>
<text x="370" y="203" font-size="17" fill="#333333">instructions, filed</text>
<rect x="500" y="100" width="220" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="610" y="145" font-size="22" font-weight="bold" fill="#222222">3 · PAYMENTS</text>
<text x="610" y="180" font-size="17" fill="#333333">Screenshots matched</text>
<text x="610" y="203" font-size="17" fill="#333333">or left unmatched</text>
<rect x="740" y="100" width="220" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="850" y="145" font-size="22" font-weight="bold" fill="#222222">4 · HISTORY</text>
<text x="850" y="180" font-size="17" fill="#333333">Past bids + closed</text>
<text x="850" y="203" font-size="17" fill="#333333">orders as intelligence</text>
</g>
<rect x="150" y="280" width="700" height="70" rx="12" fill="#8b1e1e"/>
<text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">ALL FOUR FILE INTO ONE PROPERTY MASTER</text>
<text x="500" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">New work at an existing property is flagged the day it appears. — DEMO, ALL DATA FAKE</text>
<text x="500" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">Plus a 12-hour portal-native Excel report of closed orders, reconciled, never overwriting money.</text>
</svg>
