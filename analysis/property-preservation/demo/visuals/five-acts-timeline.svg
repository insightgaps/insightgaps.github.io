<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Class 1 — Five Acts Timeline — diagram only</title>
<desc id="d">Original diagram, no photograph. Five acts of the industry story: Beginning, Flood, Reckoning, Today, Future as a question. No cold-open photograph is reproduced here.</desc>
<rect width="1200" height="620" fill="#fdf8ef"/>
<text x="60" y="62" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#1a1a1a">Class 1: The Industry Story</text>
<text x="60" y="102" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#8a1f1f">DIAGRAM ONLY · NO PHOTO REPRODUCED · FOR CLASS ONLY</text>
<line x1="90" y1="240" x2="1110" y2="240" stroke="#333" stroke-width="6"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
<circle cx="150" cy="240" r="26" fill="#8a1f1f"/><text x="150" y="249" font-size="24" font-weight="bold" fill="#fff">1</text>
<circle cx="375" cy="240" r="26" fill="#8a1f1f"/><text x="375" y="249" font-size="24" font-weight="bold" fill="#fff">2</text>
<circle cx="600" cy="240" r="26" fill="#8a1f1f"/><text x="600" y="249" font-size="24" font-weight="bold" fill="#fff">3</text>
<circle cx="825" cy="240" r="26" fill="#8a1f1f"/><text x="825" y="249" font-size="24" font-weight="bold" fill="#fff">4</text>
<circle cx="1050" cy="240" r="26" fill="#8a1f1f"/><text x="1050" y="249" font-size="24" font-weight="bold" fill="#fff">5</text>
</g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<text x="150" y="310" font-size="26" font-weight="bold">ACT 1</text>
<text x="150" y="342" font-size="24" font-weight="bold">Beginning</text>
<text x="150" y="375" font-size="20">Someone must be</text>
<text x="150" y="400" font-size="20">accountable for</text>
<text x="150" y="425" font-size="20">an empty house.</text>
<text x="375" y="310" font-size="26" font-weight="bold">ACT 2</text>
<text x="375" y="342" font-size="24" font-weight="bold">Flood</text>
<text x="375" y="375" font-size="20">Scale without</text>
<text x="375" y="400" font-size="20">standards: the record</text>
<text x="375" y="425" font-size="20">becomes the proof.</text>
<text x="600" y="310" font-size="26" font-weight="bold">ACT 3</text>
<text x="600" y="342" font-size="24" font-weight="bold">Reckoning</text>
<text x="600" y="375" font-size="20">AUTHORITY FIRST</text>
<text x="600" y="400" font-size="20">No authority =</text>
<text x="600" y="425" font-size="20">liability, not service.</text>
<text x="825" y="310" font-size="26" font-weight="bold">ACT 4</text>
<text x="825" y="342" font-size="24" font-weight="bold">Today</text>
<text x="825" y="375" font-size="20">Many clients,</text>
<text x="825" y="400" font-size="20">many rulebooks.</text>
<text x="825" y="425" font-size="20">The order governs.</text>
<text x="1050" y="310" font-size="26" font-weight="bold">ACT 5</text>
<text x="1050" y="342" font-size="24" font-weight="bold">Future ?</text>
<text x="1050" y="375" font-size="20">Routine may</text>
<text x="1050" y="400" font-size="20">automate. Judgment</text>
<text x="1050" y="425" font-size="20">on exceptions stays human.</text>
</g>
<rect x="60" y="470" width="1080" height="90" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="90" y="512" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Ask at every act: Who decided? Where is the proof?</text>
<text x="90" y="545" font-family="Arial, sans-serif" font-size="22">Cold-open photo is described in words only — rights unverified, not shown here.</text>
</svg>
