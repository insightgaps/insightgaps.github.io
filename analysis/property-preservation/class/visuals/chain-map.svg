<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Chain map: who gives the work, who does it, and what comes back</title>
<desc id="desc">A simple chain diagram. From left to right: Servicer, National, Regional, Office, Crew. Below, an arrow returns from Crew through Evidence back to payment. All data is fake, for class training only.</desc>
<rect width="1000" height="360" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#222222">THE CHAIN MAP — FAKE EXAMPLE ONLY</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Work goes one way. Evidence and payment come back the other way.</text>
<!-- boxes -->
<g font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222" text-anchor="middle">
<rect x="20" y="110" width="160" height="90" rx="12" fill="#ffffff" stroke="#8b1e1e" stroke-width="3"/>
<text x="100" y="150">SERVICER</text>
<text x="100" y="178" font-size="16" font-weight="normal">gives the work</text>
<rect x="215" y="110" width="160" height="90" rx="12" fill="#ffffff" stroke="#8b1e1e" stroke-width="3"/>
<text x="295" y="150">NATIONAL</text>
<text x="295" y="178" font-size="16" font-weight="normal">passes it on</text>
<rect x="410" y="110" width="160" height="90" rx="12" fill="#ffffff" stroke="#8b1e1e" stroke-width="3"/>
<text x="490" y="150">REGIONAL</text>
<text x="490" y="178" font-size="16" font-weight="normal">assigns it</text>
<rect x="605" y="110" width="160" height="90" rx="12" fill="#ffffff" stroke="#8b1e1e" stroke-width="3"/>
<text x="685" y="150">OFFICE</text>
<text x="685" y="178" font-size="16" font-weight="normal">plans it</text>
<rect x="800" y="110" width="160" height="90" rx="12" fill="#fdecea" stroke="#8b1e1e" stroke-width="3"/>
<text x="880" y="150">CREW</text>
<text x="880" y="178" font-size="16" font-weight="normal">does the work</text>
</g>
<g font-size="30" font-weight="bold" fill="#8b1e1e" text-anchor="middle">
<text x="197" y="165">→</text>
<text x="392" y="165">→</text>
<text x="587" y="165">→</text>
<text x="782" y="165">→</text>
</g>
<!-- return -->
<path d="M 880 240 L 880 285 L 100 285 L 100 215" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222222"/></marker></defs>
<text x="500" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">EVIDENCE BACK → then PAYMENT</text>
<text x="500" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">No evidence, no payment. The record is the proof. — DEMO, ALL DATA FAKE</text>
</svg>
