<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Proof Test: four legs, any leg fails means the set fails</title>
<desc id="desc">Four boxes labelled PLACE, TIME, SCOPE, and CLARITY. Each must pass. If any one fails, the whole photo set fails and is held for a retake. Diagram only, not a real photograph. All data fake, for class training only.</desc>
<rect width="1000" height="400" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#222222">THE PROOF TEST — FAKE EXAMPLE ONLY</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Judge every photo set with these 4 legs.</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="100" width="220" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="130" y="150" font-size="26" font-weight="bold" fill="#222222">PLACE</text>
<text x="130" y="185" font-size="18" fill="#333333">Right property?</text>
<text x="130" y="210" font-size="18" fill="#333333">Right area?</text>
<rect x="260" y="100" width="220" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="370" y="150" font-size="26" font-weight="bold" fill="#222222">TIME</text>
<text x="370" y="185" font-size="18" fill="#333333">Datestamped?</text>
<text x="370" y="210" font-size="18" fill="#333333">By that system’s rule?</text>
<rect x="500" y="100" width="220" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="610" y="150" font-size="26" font-weight="bold" fill="#222222">SCOPE</text>
<text x="610" y="185" font-size="18" fill="#333333">Does it show</text>
<text x="610" y="210" font-size="18" fill="#333333">the scoped work?</text>
<rect x="740" y="100" width="220" height="140" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="850" y="150" font-size="26" font-weight="bold" fill="#222222">CLARITY</text>
<text x="850" y="185" font-size="18" fill="#333333">Can a reviewer</text>
<text x="850" y="210" font-size="18" fill="#333333">actually see it?</text>
</g>
<rect x="150" y="270" width="700" height="70" rx="12" fill="#8b1e1e"/>
<text x="500" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">ANY LEG FAILS = SET FAILS = HELD</text>
<text x="500" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Fix it in the file: retake, re-flag, re-check. Never describe a missing photo. — DEMO, ALL DATA FAKE</text>
</svg>
