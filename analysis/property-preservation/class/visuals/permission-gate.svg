<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Permission Gate: Five Questions in order</title>
<desc id="desc">Five boxes in order: SCOPE, FACTS, PROOF, PERMISSION, NEXT. SCOPE and PERMISSION come first. If authority is unresolved, HOLD and escalate. Holding is the decision. Diagram only, fake training material.</desc>
<rect width="1000" height="440" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#222222">THE PERMISSION GATE — FAKE TRAINING ONLY</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Five Questions, in order. SCOPE and PERMISSION first.</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="100" width="176" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="108" y="150" font-size="24" font-weight="bold" fill="#222222">SCOPE</text>
<text x="108" y="185" font-size="17" fill="#333333">What is</text>
<text x="108" y="208" font-size="17" fill="#333333">allowed?</text>
<rect x="212" y="100" width="176" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="300" y="150" font-size="24" font-weight="bold" fill="#222222">FACTS</text>
<text x="300" y="185" font-size="17" fill="#333333">What is</text>
<text x="300" y="208" font-size="17" fill="#333333">proven?</text>
<rect x="404" y="100" width="176" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="492" y="150" font-size="24" font-weight="bold" fill="#222222">PROOF</text>
<text x="492" y="185" font-size="17" fill="#333333">Filed and</text>
<text x="492" y="208" font-size="17" fill="#333333">labelled?</text>
<rect x="596" y="100" width="176" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="684" y="150" font-size="24" font-weight="bold" fill="#222222">PERMISSION</text>
<text x="684" y="185" font-size="17" fill="#333333">Who may</text>
<text x="684" y="208" font-size="17" fill="#333333">authorise it?</text>
<rect x="788" y="100" width="176" height="150" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="876" y="150" font-size="24" font-weight="bold" fill="#222222">NEXT</text>
<text x="876" y="185" font-size="17" fill="#333333">Next step,</text>
<text x="876" y="208" font-size="17" fill="#333333">owner, time?</text>
</g>
<g font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#222222" text-anchor="middle">
<text x="196" y="190">›</text><text x="388" y="190">›</text><text x="580" y="190">›</text><text x="772" y="190">›</text>
</g>
<rect x="150" y="280" width="700" height="70" rx="12" fill="#8b1e1e"/>
<text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">AUTHORITY UNRESOLVED = HOLD + ESCALATE</text>
<text x="500" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Holding IS the decision when authority is unresolved. — DEMO, ALL DATA FAKE</text>
<text x="500" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">Proceed only when scope, facts, proof, and permission all pass.</text>
</svg>
