<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <!-- Synthetic Mock Label Banner -->
  <g id="synthetic-mock-badge" transform="translate(20, 24)">
    <rect x="0" y="0" width="310" height="22" rx="4" fill="#0B1320" stroke="#F59E0B" stroke-width="1.2" opacity="0.95"/>
    <text x="10" y="15" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="900" fill="#F59E0B" letter-spacing="0.8">SYNTHETIC MOCK / INSTRUCTIONAL ILLUSTRATION ONLY</text>
  </g>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f4eee1"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b42318"/>
      <stop offset="100%" stop-color="#7a120c"/>
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#0f4422"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#12263f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#d6c8b2" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Header Banner -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="860" height="54" rx="8" fill="#12263f"/>
    <text x="24" y="34" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#f7f2e8" letter-spacing="0.05em">THE CURB APPEAL DILEMMA: GRASS IS THE HOUSE'S FACE</text>
    <rect x="710" y="14" width="130" height="26" rx="4" fill="#b45309"/>
    <text x="775" y="31" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">FIRST CONTACT</text>
  </g>

  <!-- Left Side: Unmaintained / Blight Signal -->
  <g transform="translate(50, 115)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="415" height="375" rx="10" fill="#ffffff" stroke="#b42318" stroke-width="2"/>
    <rect x="0" y="0" width="415" height="42" rx="10" fill="url(#alertGrad)"/>
    <rect x="0" y="32" width="415" height="10" fill="url(#alertGrad)"/>
    <text x="20" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">CONDITION A: 24" OVERGROWTH</text>
    <text x="395" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5" text-anchor="end">SIGNALS VACANCY</text>

    <!-- Fictional House Graphic Overgrown -->
    <g transform="translate(25, 60)">
      <!-- Sky / House Backdrop -->
      <rect x="0" y="0" width="365" height="130" rx="6" fill="#f1f5f9"/>
      <!-- Roof -->
      <polygon points="182,18 70,65 295,65" fill="#334155"/>
      <!-- House Body -->
      <rect x="85" y="65" width="195" height="60" fill="#94a3b8"/>
      <!-- Windows / Door -->
      <rect x="110" y="75" width="30" height="30" fill="#475569"/>
      <rect x="225" y="75" width="30" height="30" fill="#475569"/>
      <rect x="165" y="80" width="35" height="45" fill="#1e293b"/>
      <!-- Overgrown Wild Grass Lines -->
      <path d="M 0,125 Q 15,90 25,128 Q 40,85 55,128 Q 70,80 85,128 Q 100,75 120,128 Q 140,85 160,128 Q 180,70 200,128 Q 220,80 240,128 Q 260,75 285,128 Q 310,85 335,128 Q 350,90 365,128" fill="none" stroke="#65a30d" stroke-width="4"/>
      <path d="M 10,128 Q 30,80 45,128 Q 65,70 80,128 Q 105,65 130,128 Q 155,75 175,128 Q 205,60 225,128 Q 255,70 275,128 Q 300,75 320,128 Q 340,80 360,128" fill="none" stroke="#4d7c0f" stroke-width="3"/>
      <!-- Wild Weed Clumps -->
      <circle cx="95" cy="115" r="8" fill="#ca8a04" opacity="0.8"/>
      <circle cx="270" cy="110" r="10" fill="#ca8a04" opacity="0.8"/>
    </g>

    <!-- Impact Cards -->
    <g transform="translate(25, 205)">
      <rect x="0" y="0" width="365" height="48" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="14" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Municipal Hazard:</text>
      <text x="14" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7f1d1d">City Code Citation ($250–$500/day fine)</text>

      <rect x="0" y="56" width="365" height="48" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="14" y="76" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Criminal &amp; Social Risk:</text>
      <text x="14" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#7f1d1d">Invites squatters, copper theft, neighbor fury</text>

      <rect x="0" y="112" width="365" height="44" rx="6" fill="#12263f"/>
      <text x="182" y="139" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">"If the lawn screams empty, you are already late."</text>
    </g>
  </g>

  <!-- Right Side: Cleanly Preserved / Maintained -->
  <g transform="translate(495, 115)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="415" height="375" rx="10" fill="#ffffff" stroke="#166534" stroke-width="2"/>
    <rect x="0" y="0" width="415" height="42" rx="10" fill="url(#safeGrad)"/>
    <rect x="0" y="32" width="415" height="10" fill="url(#safeGrad)"/>
    <text x="20" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">CONDITION B: PRESERVED &amp; STRIPED</text>
    <text x="395" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#bbf7d0" text-anchor="end">OCCUPIED APPEARANCE</text>

    <!-- Fictional House Graphic Maintained -->
    <g transform="translate(25, 60)">
      <!-- Sky / House Backdrop -->
      <rect x="0" y="0" width="365" height="130" rx="6" fill="#f0fdf4"/>
      <!-- Roof -->
      <polygon points="182,18 70,65 295,65" fill="#1e293b"/>
      <!-- House Body -->
      <rect x="85" y="65" width="195" height="60" fill="#cbd5e1"/>
      <!-- Windows / Door -->
      <rect x="110" y="75" width="30" height="30" fill="#38bdf8"/>
      <rect x="225" y="75" width="30" height="30" fill="#38bdf8"/>
      <rect x="165" y="80" width="35" height="45" fill="#0f172a"/>
      <!-- Crisp Trimmed Lawn with Clean Striping -->
      <rect x="0" y="118" width="365" height="12" fill="#15803d"/>
      <line x1="20" y1="118" x2="20" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="60" y1="118" x2="60" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="100" y1="118" x2="100" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="140" y1="118" x2="140" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="180" y1="118" x2="180" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="220" y1="118" x2="220" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="260" y1="118" x2="260" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="300" y1="118" x2="300" y2="130" stroke="#166534" stroke-width="12"/>
      <line x1="340" y1="118" x2="340" y2="130" stroke="#166534" stroke-width="12"/>
      <!-- Sidewalk Edge -->
      <line x1="0" y1="118" x2="365" y2="118" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- Protection Metrics -->
    <g transform="translate(25, 205)">
      <rect x="0" y="0" width="365" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Controlled Protection:</text>
      <text x="14" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#14532d">Eliminates code violation exposure; deters trespass</text>

      <rect x="0" y="56" width="365" height="48" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="76" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">The Preservation Value:</text>
      <text x="14" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#14532d">$60–$100 mow protects $250k asset from decay spiral</text>

      <rect x="0" y="112" width="365" height="44" rx="6" fill="#12263f"/>
      <text x="182" y="139" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#86efac" text-anchor="middle">"Preservation is controlled physical care for money."</text>
    </g>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(50, 502)">
    <text x="0" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#667085">M5 EXTERIOR FIELD WORK • 5-LINK CHAIN STEP 4: FIELD CREW &amp; PROPERTY CONTROL</text>
    <text x="860" y="12" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">SYNTHETIC CONCEPT ILLUSTRATION</text>
  </g>
</svg>