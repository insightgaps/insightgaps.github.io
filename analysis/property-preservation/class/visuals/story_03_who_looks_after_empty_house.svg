  <g transform="translate(285, 240)" filter="url(#shadow)">
    <rect width="195" height="260" rx="10" fill="#fffdf8" stroke="#d6c8b2" stroke-width="1.5" />
    <rect width="195" height="44" rx="10" fill="#12263f" />
    <rect y="34" width="195" height="10" fill="#12263f" />
    <text x="16" y="28" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800">LINK 2</text>
    <text x="65" y="28" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Loan Servicer</text>
    <text x="16" y="75" fill="#12263f" font-family="Georgia, serif" font-size="18" font-weight="700">Daily Loan Admin</text>
    <text x="16" y="100" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">Collects payments; manages default, loss mit &amp; legal.</text>
