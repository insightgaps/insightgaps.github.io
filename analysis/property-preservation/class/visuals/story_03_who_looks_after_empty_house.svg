  <!-- Bottom Insight Strip -->
  <rect x="60" y="535" width="1080" height="95" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="95" cy="582" r="18" fill="#f59e0b" fill-opacity="0.2" />
  <text x="95" y="588" fill="#f59e0b" font-family="Georgia, serif" font-size="20" font-weight="700" text-anchor="middle">!</text>
  
  <text x="130" y="567" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">
    THE ANCHOR FORMULA FOR MODULE M1:
  </text>
  <text x="130" y="590" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="13">
    "A property can APPEAR vacant yet lack legal permission. A work order can READ complete while proof is deficient."
  </text>
  <text x="130" y="612" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">
