    <text x="16" y="75" fill="#12263f" font-family="Georgia, serif" font-size="18" font-weight="700">50-State Logistics</text>
    <text x="16" y="100" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">Coordinates vendors, sets pricing matrices &amp; portal.</text>
    <line x1="16" y1="130" x2="179" y2="130" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="152" fill="#0f766e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">ROLE &amp; FOCUS</text>
    <text x="16" y="172" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Dispatches regional work</text>
    <text x="16" y="192" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Enforces client handbook</text>
    <text x="16" y="212" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Aggregates proof files</text>
