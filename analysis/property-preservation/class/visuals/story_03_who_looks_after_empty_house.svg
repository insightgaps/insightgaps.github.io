  <rect x="20" y="20" width="1160" height="640" fill="none" stroke="#d6c8b2" stroke-opacity="0.15" stroke-width="1" rx="12" />

  <!-- Title & Kicker -->
  <text x="60" y="65" fill="#f59e0b" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">MODULE M1 — THE INDUSTRY SYSTEM MAP</text>
  <text x="60" y="105" fill="#fffdf8" font-family="Georgia, serif" font-size="30" font-weight="700">The Five-Link Preservation Chain</text>
  <text x="60" y="135" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="15">One work order travels 1,200 miles and five distinct legal hands before a lock is touched.</text>

  <!-- Status / Context Badge -->
  <g transform="translate(930, 48)">
    <rect width="210" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#f59e0b" />
    <text x="32" y="21" fill="#f8fafc" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ILLUSTRATIVE CHAIN</text>
  </g>

  <!-- The Gap Banner -->
  <rect x="60" y="165" width="1080" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="80" y="191" fill="#e2e8f0" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">
    <tspan fill="#f59e0b" font-weight="800">THE CORE REALITY: </tspan>
    The gap between financial capital (investor/servicer) and physical structure (Maple House) is bridged exclusively by verified handoffs.
  </text>

