  <g transform="translate(60, 240)" filter="url(#shadow)">
    <rect width="195" height="260" rx="10" fill="#fffdf8" stroke="#d6c8b2" stroke-width="1.5" />
    <rect width="195" height="44" rx="10" fill="#12263f" />
    <rect y="34" width="195" height="10" fill="#12263f" />
    <text x="16" y="28" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800">LINK 1</text>
    <text x="65" y="28" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Bank / Lender</text>
    <text x="16" y="75" fill="#12263f" font-family="Georgia, serif" font-size="18" font-weight="700">Financial Risk</text>
    <text x="16" y="100" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13" line-height="1.4">Owns note or insures risk (FHA/Fannie/Freddie/Bank).</text>
    <line x1="16" y1="130" x2="179" y2="130" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="152" fill="#0f766e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">ROLE &amp; FOCUS</text>
    <text x="16" y="172" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Capital preservation</text>
    <text x="16" y="192" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Regulatory compliance</text>
    <text x="16" y="212" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Conveyance recovery</text>
    <rect x="16" y="226" width="163" height="22" rx="4" fill="#f1f5f9" />
    <text x="22" y="241" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Location: Wall St / Dallas</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="262" y1="365" x2="278" y2="365" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)" />

