    <text x="16" y="152" fill="#0f766e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">ROLE &amp; FOCUS</text>
    <text x="16" y="172" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Duty runs pre-REO</text>
    <text x="16" y="192" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Must protect property</text>
    <text x="16" y="212" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Cannot staff 3,143 cos.</text>
    <rect x="16" y="226" width="163" height="22" rx="4" fill="#f1f5f9" />
    <text x="22" y="241" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Location: Charlotte / Plano</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="487" y1="365" x2="503" y2="365" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Link 3: National FSM -->
  <g transform="translate(510, 240)" filter="url(#shadow)">
    <rect width="195" height="260" rx="10" fill="#fffdf8" stroke="#d6c8b2" stroke-width="1.5" />
    <rect width="195" height="44" rx="10" fill="#12263f" />
    <rect y="34" width="195" height="10" fill="#12263f" />
