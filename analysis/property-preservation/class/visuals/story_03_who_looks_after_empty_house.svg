    <rect width="180" height="44" rx="10" fill="#12263f" />
    <rect y="34" width="180" height="10" fill="#12263f" />
    <text x="14" y="28" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800">LINK 5</text>
    <text x="60" y="28" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Field Crew</text>
    <text x="14" y="75" fill="#12263f" font-family="Georgia, serif" font-size="18" font-weight="700">Hands on House</text>
    <text x="14" y="100" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="13">Executes scope, shoots B/D/A photos, verifies safety.</text>
    <line x1="14" y1="130" x2="166" y2="130" stroke="#e2e8f0" stroke-width="1" />
    <text x="14" y="152" fill="#0f766e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">ROLE &amp; FOCUS</text>
    <text x="14" y="172" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Rekey, board, cut lawn</text>
    <text x="14" y="192" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Winterize &amp; clear trash</text>
    <text x="14" y="212" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12">• Real-time mobile upload</text>
    <rect x="14" y="226" width="152" height="22" rx="4" fill="#f1f5f9" />
    <text x="20" y="241" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">At: Maple House Porch</text>
