<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
<title id="title">Submission flow: complete, report, owner cross-check, submit only on owner word, demo stops before submit</title>
<desc id="desc">Four steps in order: Complete in the field, Report the finished state, Owner cross-check, Submit only on owner word. The final submit step is crossed out in this demo, because the demo stops before submit and has no submit action. All data fake, for class training only.</desc>
<rect width="1000" height="380" fill="#fffdf5"/>
<text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#222222">SUBMISSION FLOW — FAKE DEMO ONLY</text>
<text x="500" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">Never skip a step. Never submit on your own word.</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="20" y="110" width="210" height="120" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="125" y="155" font-size="22" font-weight="bold" fill="#222222">1. COMPLETE</text>
<text x="125" y="185" font-size="18" fill="#333333">in the field</text>
<rect x="260" y="110" width="210" height="120" rx="12" fill="#ffffff" stroke="#222222" stroke-width="3"/>
<text x="365" y="155" font-size="22" font-weight="bold" fill="#222222">2. REPORT</text>
<text x="365" y="185" font-size="18" fill="#333333">finished state</text>
<rect x="500" y="110" width="210" height="120" rx="12" fill="#fdecea" stroke="#8b1e1e" stroke-width="3"/>
<text x="605" y="155" font-size="22" font-weight="bold" fill="#222222">3. OWNER</text>
<text x="605" y="185" font-size="22" font-weight="bold" fill="#222222">CROSS-CHECK</text>
<rect x="740" y="110" width="210" height="120" rx="12" fill="#eeeeee" stroke="#888888" stroke-width="3" stroke-dasharray="8 5"/>
<text x="845" y="155" font-size="22" font-weight="bold" fill="#888888">4. SUBMIT</text>
<text x="845" y="185" font-size="18" fill="#888888">only on owner word</text>
<line x1="760" y1="125" x2="930" y2="215" stroke="#8b1e1e" stroke-width="5"/>
<line x1="930" y1="125" x2="760" y2="215" stroke="#8b1e1e" stroke-width="5"/>
</g>
<g font-size="30" font-weight="bold" fill="#222222" text-anchor="middle">
<text x="250" y="180">→</text>
<text x="490" y="180">→</text>
<text x="730" y="180">→</text>
</g>
<rect x="150" y="260" width="700" height="70" rx="12" fill="#8b1e1e"/>
<text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">DEMO STOPS HERE — NO SUBMIT ACTION</text>
<text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555555">WO-EXAMPLE-003 stops at “Awaiting Owner Cross-Check.” — DEMO, ALL DATA FAKE</text>
</svg>
