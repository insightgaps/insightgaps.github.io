<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Diagram of the chain of people who handle a vacant house, from owner to crew.">
<rect width="720" height="360" fill="#f9f8f6"/>
<rect x="60" y="40" width="600" height="280" fill="#ffffff" stroke="#8a5a1f" stroke-width="4"/>
<polygon points="120,200 360,90 600,200" fill="#8a5a1f"/>
<rect x="180" y="200" width="360" height="120" fill="#8a5a1f" opacity="0.25"/>
<text x="360" y="130" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="bold" fill="#222222">Topic 2</text>
<text x="360" y="270" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#222222">The Chain</text>
</svg>
