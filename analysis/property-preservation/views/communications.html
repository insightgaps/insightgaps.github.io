<div class="os-view-body">
  <!-- Top channel tabs -->
  <div class="channel-tabs" id="comm-channel-tabs">
    <div class="channel-tab active" data-channel="all">All Channels</div>
    <div class="channel-tab" data-channel="SMS">SMS Only</div>
    <div class="channel-tab" data-channel="Email">Email Only</div>
  </div>

  <!-- KPI Grid -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-card__label">Total Threads</div>
      <div class="kpi-card__value" id="comm-total-threads">0</div>
      <div class="kpi-card__sub">Grouped by Work Order</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__label">Total Messages</div>
      <div class="kpi-card__value kpi-card__value--blue" id="comm-total-messages">0</div>
      <div class="kpi-card__sub">SMS & Email logs</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__label">Pending Action</div>
      <div class="kpi-card__value kpi-card__value--red" id="comm-needs-action">0</div>
      <div class="kpi-card__sub">Needs reply / decision</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__label">High Priority</div>
      <div class="kpi-card__value kpi-card__value--amber" id="comm-high-priority">0</div>
      <div class="kpi-card__sub font-weight-bold">Escalated alerts</div>
    </div>
  </div>

  <!-- Main Side-by-Side Comm Layout -->
  <div class="comm-layout">
    
    <!-- Left List of Threads -->
    <div class="comm-threads">
      <div class="comm-threads__search-box">
        <input type="text" class="os-search-input" id="thread-search" placeholder="Search WO#, contractor..." style="margin-bottom:0;">
        <select class="os-filter" id="thread-priority-filter" style="width: 100px;">
          <option value="all">All Pri</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="comm-threads__list" id="thread-list-container">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Right Thread Detail View -->
    <div class="comm-detail" id="thread-detail-container">
      <div class="comm-detail__empty">
        <div style="font-size:24px;color:#CBD5E1;font-family:Space Mono,monospace;font-weight:700;">[ ]</div>
        <div>Select a conversation from the left to view AI summary and message logs</div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      var currentChannel = 'all';
      var currentPriority = 'all';
      var searchQuery = '';
      var selectedWoNumber = null;

      function renderCommsLayout() {
        if (!window.EPCS_DATA) return;
        var data = window.EPCS_DATA;
        var filters = window.EPCS_FILTERS || { month: 'all', client: 'all', contractor: 'all' };

        // Helper to match filter conditions
        function matchGlobalFilters(wo) {
          if (filters.month !== 'all') {
            if (!wo.due_date || !wo.due_date.startsWith(filters.month)) return false;
          }
          if (filters.client !== 'all' && wo.client !== filters.client) return false;
          if (filters.contractor !== 'all' && wo.contractor !== filters.contractor) return false;
          return true;
        }

        // 1. Filter message list based on global filter and current channel tab
        var filteredComms = data.communications.filter(function (c) {
          var wo = data.work_orders.find(function (w) { return w.wo_number === c.wo_number; });
          if (!wo || !matchGlobalFilters(wo)) return false;
          
          if (currentChannel !== 'all' && c.channel !== currentChannel) return false;
          return true;
        });

        // 2. Group into threads by WO Number
        var threadsMap = {};
        filteredComms.forEach(function (c) {
          if (!threadsMap[c.wo_number]) {
            threadsMap[c.wo_number] = {
              wo_number: c.wo_number,
              messages: [],
              contractor: c.contractor || 'Unknown',
              needs_reply: false,
              max_priority: 'Low',
              latest_timestamp: c.timestamp
            };
          }
          threadsMap[c.wo_number].messages.push(c);
          if (c.needs_reply) {
            threadsMap[c.wo_number].needs_reply = true;
          }
          if (c.priority === 'High') {
            threadsMap[c.wo_number].max_priority = 'High';
          } else if (c.priority === 'Medium' && threadsMap[c.wo_number].max_priority !== 'High') {
            threadsMap[c.wo_number].max_priority = 'Medium';
          }
          if (new Date(c.timestamp) > new Date(threadsMap[c.wo_number].latest_timestamp)) {
            threadsMap[c.wo_number].latest_timestamp = c.timestamp;
            threadsMap[c.wo_number].contractor = c.contractor || threadsMap[c.wo_number].contractor;
          }
        });

        var threads = Object.values(threadsMap);

        // Sort messages in each thread chronologically
        threads.forEach(function (t) {
          t.messages.sort(function (a, b) {
            return new Date(a.timestamp) - new Date(b.timestamp);
          });
        });

        // Sort threads by latest message timestamp descending
        threads.sort(function (a, b) {
          return new Date(b.latest_timestamp) - new Date(a.latest_timestamp);
        });

        // Filter threads locally by search and local priority dropdown
        var finalThreads = threads.filter(function (t) {
          if (currentPriority !== 'all' && t.max_priority !== currentPriority) return false;
          
          if (searchQuery.trim() !== '') {
            var q = searchQuery.toLowerCase();
            var woMatch = t.wo_number.toLowerCase().includes(q);
            var contractorMatch = t.contractor.toLowerCase().includes(q);
            var msgMatch = t.messages.some(function (m) {
              return (m.message_text || '').toLowerCase().includes(q) || (m.subject || '').toLowerCase().includes(q);
            });
            return woMatch || contractorMatch || msgMatch;
          }
          return true;
        });

        // Update KPIs
        var totalMessages = filteredComms.length;
        var needsActionCount = threads.filter(function (t) { return t.needs_reply; }).length;
        var highPriorityCount = threads.filter(function (t) { return t.max_priority === 'High'; }).length;

        document.getElementById('comm-total-threads').textContent = threads.length;
        document.getElementById('comm-total-messages').textContent = totalMessages;
        document.getElementById('comm-needs-action').textContent = needsActionCount;
        document.getElementById('comm-high-priority').textContent = highPriorityCount;

        // Render thread items on the left
        var listContainer = document.getElementById('thread-list-container');
        listContainer.innerHTML = '';

        if (finalThreads.length === 0) {
          listContainer.innerHTML = '<div style="text-align:center;color:#8C8985;padding:20px;font-family:Space Mono,monospace;font-size:11px;">No threads found.</div>';
        } else {
          finalThreads.forEach(function (t) {
            var latestMsg = t.messages[t.messages.length - 1];
            var previewText = latestMsg ? latestMsg.message_text : '';
            var timeString = latestMsg ? new Date(latestMsg.timestamp).toLocaleDateString() : '';
            var activeClass = (selectedWoNumber === t.wo_number) ? 'active' : '';

            var item = document.createElement('div');
            item.className = 'thread-item ' + activeClass;
            item.dataset.wo = t.wo_number;

            var badgeHtml = '';
            if (t.needs_reply) {
              badgeHtml += '<span class="pill pill--red" style="padding:1px 6px; font-size:9px; margin-right:4px;">Reply Required</span>';
            }
            if (t.max_priority === 'High') {
              badgeHtml += '<span class="pill pill--red" style="padding:1px 6px; font-size:9px;">High</span>';
            } else if (t.max_priority === 'Medium') {
              badgeHtml += '<span class="pill pill--amber" style="padding:1px 6px; font-size:9px;">Medium</span>';
            }

            item.innerHTML = `
              <div class="thread-item__header">
                <span class="thread-item__wo">WO# ${t.wo_number}</span>
                <span class="thread-item__time">${timeString}</span>
              </div>
              <div class="thread-item__body">${previewText}</div>
              <div class="thread-item__meta">
                <span class="thread-item__contractor">${t.contractor}</span>
                <div style="display:flex; gap:2px;">${badgeHtml}</div>
              </div>
            `;

            item.addEventListener('click', function () {
              selectedWoNumber = t.wo_number;
              // Re-render to update active highlight
              renderCommsLayout();
            });

            listContainer.appendChild(item);
          });
        }

        // Render Right Thread Detail View
        var detailContainer = document.getElementById('thread-detail-container');
        if (!selectedWoNumber) {
          detailContainer.innerHTML = `
            <div class="comm-detail__empty">
              <div style="font-size:24px;color:#CBD5E1;font-family:Space Mono,monospace;font-weight:700;">[ ]</div>
              <div>Select a conversation from the left to view AI summary and message logs</div>
            </div>
          `;
          return;
        }

        // Find the active thread
        var activeThread = threads.find(function (t) { return t.wo_number === selectedWoNumber; });
        if (!activeThread) {
          // If active thread is no longer available under current filter
          selectedWoNumber = null;
          detailContainer.innerHTML = `
            <div class="comm-detail__empty">
              <div style="font-size:24px;color:#CBD5E1;font-family:Space Mono,monospace;font-weight:700;">[ ]</div>
              <div>Select a conversation from the left to view AI summary and message logs</div>
            </div>
          `;
          return;
        }

        // Get WO details
        var matchingWO = data.work_orders.find(function (w) { return w.wo_number === activeThread.wo_number; }) || {};

        // Generate dynamic AI Summary & Action Items
        var aiSummary = generateAISummary(activeThread, matchingWO);

        // Header HTML
        var detailHeaderHtml = `
          <div class="comm-detail__header">
            <div>
              <div class="comm-detail__title">WO# ${activeThread.wo_number} — ${matchingWO.order_type || 'Preservation'}</div>
              <div class="comm-detail__sub">Client: <strong>${matchingWO.client || 'Unknown'}</strong> | Contractor: <strong>${activeThread.contractor}</strong> | Status: <strong>${matchingWO.status || 'Active'}</strong></div>
            </div>
            <div>
              <a href="#" class="pill pill--blue" id="btn-view-wo-detail" style="text-decoration:none;">View Work Order</a>
            </div>
          </div>
        `;

        // Render messages
        var messageFeedHtml = '';
        activeThread.messages.forEach(function (m) {
          var bubbleType = m.direction === 'Inbound' ? 'message-bubble--inbound' : 'message-bubble--outbound';
          var channelLabel = m.channel === 'Email' ? 'Email' : 'SMS';
          var sentimentIcon = m.sentiment === 'Positive' ? '<span style="color:#1A6B3C;">●</span>' : (m.sentiment === 'Concerned' ? '<span style="color:#DC2626;">●</span>' : '<span style="color:#8C8985;">●</span>');
          var replyBadge = (m.needs_reply && m.direction === 'Inbound') ? '<span class="pill pill--red" style="font-size:9px; padding:1px 5px; margin-left:6px;">Needs Reply</span>' : '';

          var headerMeta = m.channel === 'Email' 
            ? `<strong>Subject: ${m.subject || 'No Subject'}</strong><br/>From: ${m.from_address} &rarr; To: ${m.to_address}`
            : `SMS Log — ${m.direction === 'Inbound' ? 'From Contractor' : 'From Office'}`;

          messageFeedHtml += `
            <div class="message-bubble ${bubbleType}">
              <div style="font-size: 10px; color: var(--os-text-muted); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #F0EEE8;">
                <span style="font-weight:600;">${channelLabel}</span> | ${headerMeta} ${replyBadge}
              </div>
              <div style="white-space: pre-wrap;">${m.message_text}</div>
              <div class="message-bubble__time">
                ${new Date(m.timestamp).toLocaleString()} ${sentimentIcon}
              </div>
            </div>
          `;
        });

        // Combined detail container layout
        detailContainer.innerHTML = `
          ${detailHeaderHtml}
          <div class="comm-detail__content">
            <!-- AI Summary Box -->
            <div class="thread-summary-box">
              <div class="thread-summary-box__title">
                AI Copilot Summary & Conversation Audit
              </div>
              <div style="line-height: 1.4;">
                ${aiSummary.text}
              </div>
              <div class="thread-summary-box__actions">
                <strong>Required Action:</strong> ${aiSummary.action}
              </div>
            </div>

            <!-- Messages List -->
            <div style="display:flex; flex-direction:column; gap:16px; margin-top:10px;">
              <div style="font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600; color:var(--os-text-secondary); text-transform:uppercase; letter-spacing:0.04em;">Message Log</div>
              ${messageFeedHtml}
            </div>
          </div>
        `;

        // Add action to button
        var btnViewWO = document.getElementById('btn-view-wo-detail');
        if (btnViewWO) {
          btnViewWO.addEventListener('click', function (e) {
            e.preventDefault();
            // Switch to work orders view
            window.EPCS_FILTERS.month = 'all';
            window.EPCS_FILTERS.client = 'all';
            window.EPCS_FILTERS.contractor = 'all';
            
            // Trigger load via sidebar nav
            var woNavItem = document.querySelector('.os-nav__item[data-view="workorders"]');
            if (woNavItem) {
              // Pre-fill search in work orders or filter by WO number
              // For simplicity, we trigger filter click
              woNavItem.click();
              // After loading workorders, search it
              setTimeout(function() {
                var woSearchInput = document.getElementById('wo-search');
                if (woSearchInput) {
                  woSearchInput.value = activeThread.wo_number;
                  woSearchInput.dispatchEvent(new Event('input'));
                }
              }, 100);
            }
          });
        }
      }

      // Dynamic AI summary generator
      function generateAISummary(thread, wo) {
        var contractor = thread.contractor;
        var woNum = thread.wo_number;
        var serviceType = wo.order_type || 'Preservation Services';
        var client = wo.client || 'Client';

        // Check labels and text of messages
        var hasQCIssue = false;
        var hasBudgetRequest = false;
        var hasDelay = false;
        var hasCompletion = false;
        var isApproved = false;
        var issuesList = [];

        thread.messages.forEach(function (m) {
          var label = m.ai_label || '';
          var txt = (m.message_text || '').toLowerCase();
          
          if (label === 'QC_Issue' || label === 'QC_Failure' || txt.includes('photo') || txt.includes('reject') || txt.includes('failed')) {
            hasQCIssue = true;
          }
          if (label === 'Budget_Request' || txt.includes('bid') || txt.includes('markup') || txt.includes('additional') || txt.includes('$')) {
            hasBudgetRequest = true;
          }
          if (txt.includes('delay') || txt.includes('late') || txt.includes('extension') || txt.includes('tomorrow')) {
            hasDelay = true;
          }
          if (label === 'Completion' || txt.includes('completed') || txt.includes('finished') || txt.includes('done')) {
            hasCompletion = true;
          }
          if (label === 'Approval' || txt.includes('approved') || txt.includes('go ahead')) {
            isApproved = true;
          }
        });

        var summaryText = "";
        var actionText = "";

        if (hasQCIssue) {
          summaryText = "This thread concerns a <strong>Quality Control issue</strong> for the <strong>" + serviceType + "</strong>. The office has flagged missing or blurry photos. Contractor " + contractor + " was notified to retake street views and secure locks to prevent invoice deductions.";
          actionText = "Review incoming contractor photos in the Photo QC panel. Ensure lock close-up photos verify correct lockbox code before submitting to " + client + ".";
        } else if (hasBudgetRequest) {
          summaryText = "Contractor " + contractor + " is requesting a <strong>budget markup</strong> for the <strong>" + serviceType + "</strong> due to out-of-scope work encountered on-site. The contractor reports extra trash bags/yard debris and is requesting approval for additional costs.";
          actionText = "Verify bid rules against the PPW Allowable Pricing Schedule in the Bid Generator. Negotiate with " + client + " for markup approval before confirming vendor payout.";
        } else if (hasDelay) {
          summaryText = "Contractor reports a <strong>scheduling delay</strong> for <strong>" + serviceType + "</strong>. Factors cited include adverse weather conditions and delayed access codes to the property. Revised completion timeframe is pending.";
          actionText = "Update the work order SLA countdown. If necessary, request an extension in the client portal to avoid late submission penalties.";
        } else if (hasCompletion) {
          summaryText = "Contractor " + contractor + " reports <strong>successful completion</strong> of all line items for <strong>" + serviceType + "</strong> and has uploaded photos. Invoice is prepared for submission to " + client + ".";
          actionText = "Run automated Photo QC check to verify street and after-photos. If satisfactory, compile invoice and submit to " + client + " for approval.";
        } else {
          summaryText = "Standard communication history regarding the assignment and dispatch details for the <strong>" + serviceType + "</strong>. Timeline and instructions have been exchanged.";
          actionText = "None. Monitor thread for contractor updates or check-ins.";
        }

        return {
          text: summaryText,
          action: actionText
        };
      }

      // Setup Event Listeners for local filters
      var searchInput = document.getElementById('thread-search');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          searchQuery = this.value;
          renderCommsLayout();
        });
      }

      var priorityFilter = document.getElementById('thread-priority-filter');
      if (priorityFilter) {
        priorityFilter.addEventListener('change', function () {
          currentPriority = this.value;
          renderCommsLayout();
        });
      }

      var channelTabs = document.getElementById('comm-channel-tabs');
      if (channelTabs) {
        channelTabs.querySelectorAll('.channel-tab').forEach(function (tab) {
          tab.addEventListener('click', function () {
            channelTabs.querySelectorAll('.channel-tab').forEach(function (t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentChannel = this.dataset.channel;
            selectedWoNumber = null; // Reset selection on channel switch
            renderCommsLayout();
          });
        });
      }

      // Shell Event Hooks
      window.addEventListener('epcs:view-loaded', function (e) {
        if (e.detail.view === 'communications') {
          currentChannel = 'all';
          currentPriority = 'all';
          searchQuery = '';
          selectedWoNumber = null;
          
          if (searchInput) searchInput.value = '';
          if (priorityFilter) priorityFilter.value = 'all';
          if (channelTabs) {
            channelTabs.querySelectorAll('.channel-tab').forEach(function (t) { t.classList.remove('active'); });
            var allTab = channelTabs.querySelector('[data-channel="all"]');
            if (allTab) allTab.classList.add('active');
          }

          renderCommsLayout();
        }
      });

      window.addEventListener('epcs:filter-change', function () {
        var activeItem = document.querySelector('.os-nav__item.active');
        if (activeItem && activeItem.dataset.view === 'communications') {
          renderCommsLayout();
        }
      });

    })();
  </script>
</div>
