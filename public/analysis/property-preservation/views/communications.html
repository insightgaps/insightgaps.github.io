<div class="os-view-body">
  <style>
    /* Tab Styling inside thread details */
    .detail-tabs {
      display: flex;
      border-bottom: 2px solid #E2E0DC;
      margin-bottom: 16px;
      margin-top: 16px;
      gap: 16px;
    }
    .detail-tab {
      padding: 6px 4px 10px 4px;
      cursor: pointer;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #8C8985;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s ease;
    }
    .detail-tab:hover {
      color: #1A1917;
    }
    .detail-tab.active {
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
    }

    /* Metadata Card styling */
    .audit-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .audit-meta-card {
      background: #fff;
      border: 1px solid #E2E0DC;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .audit-meta-card__label {
      font-size: 9px;
      font-weight: 700;
      color: #8C8985;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    /* Section Headings */
    .audit-section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #1A1917;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 16px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #E2E0DC;
    }

    /* Ledger Styling */
    .audit-ledger-container {
      background: #fff;
      border: 1px solid #E2E0DC;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .audit-ledger-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #E2E0DC;
    }
    .audit-ledger-col {
      padding: 14px 16px;
    }
    .audit-ledger-col:first-child {
      border-right: 1px solid #E2E0DC;
    }
    .audit-ledger-col__title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: #8C8985;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .audit-ledger-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #4B4743;
      margin-bottom: 6px;
    }
    .audit-ledger-row.total {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #E2E0DC;
      font-weight: 700;
      color: #1A1917;
      font-size: 12.5px;
    }
    .audit-ledger-consolidated {
      background: #FAFAF9;
      padding: 12px 16px;
    }

    /* Timeline styling */
    .audit-timeline-container {
      position: relative;
      padding-left: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 16px;
    }
    .audit-timeline-line {
      position: absolute;
      left: 9px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: #E2E0DC;
    }
    .audit-timeline-item {
      position: relative;
    }
    .audit-timeline-dot {
      position: absolute;
      left: -24px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #CBD5E1;
      z-index: 2;
      transition: all 0.25s ease;
    }
    .audit-timeline-dot.done {
      border-color: #10B981;
      background: #10B981;
    }
    .audit-timeline-dot.active {
      border-color: #F59E0B;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
    }
    .audit-timeline-dot.pending {
      border-color: #CBD5E1;
      background: #fff;
    }
    .audit-timeline-item__content {
      background: #fff;
      border: 1px solid #E2E0DC;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .audit-timeline-item__header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #1A1917;
    }
    .audit-timeline-date {
      font-family: 'Space Mono', monospace;
      font-size: 10.5px;
      color: #8C8985;
    }
    .audit-timeline-badges {
      display: flex;
      gap: 4px;
    }
    .badge {
      font-size: 8.5px;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .badge--ppw { background: #EFF6FF; color: #2563eb; }
    .badge--slack { background: #FAF5FF; color: #8B5CF6; }
    .badge--quo { background: #FEF3C7; color: #D97706; }
    .badge--sms { background: #F3F4F6; color: #4B4743; }
    .badge--qc { background: #ECFDF5; color: #059669; }
    .badge--gmail { background: #FEF2F2; color: #DC2626; }
    .badge--bank { background: #ECFDF5; color: #047857; }

    .audit-timeline-desc {
      font-size: 11px;
      color: #4B4743;
      line-height: 1.45;
    }
    .alert {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }
    .alert--warning { background: #FEF3C7; color: #92400E; border: 1px solid #FCD34D; }
    .alert--danger { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
    .alert--success { background: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; }
  </style>

  <!-- Top channel tabs -->
  <div class="channel-tabs" id="comm-channel-tabs">
    <div class="channel-tab active" data-channel="all">All Channels</div>
    <div class="channel-tab" data-channel="SMS">SMS</div>
    <div class="channel-tab" data-channel="Email">Email</div>
    <div class="channel-tab" data-channel="Slack">Slack</div>
  </div>

  <!-- KPI Grid -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-card__label">Action Required</div>
      <div class="kpi-card__value kpi-card__value--red" id="comm-action-required">0</div>
      <div class="kpi-card__sub">Total escalations</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__label">Budget Requests</div>
      <div class="kpi-card__value kpi-card__value--amber" id="comm-budget-requests">0</div>
      <div class="kpi-card__sub">Needs your approval</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__label">QC Rejections</div>
      <div class="kpi-card__value kpi-card__value--red" id="comm-qc-issues">0</div>
      <div class="kpi-card__sub">Photos missing / failed</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-card__label">Routine / Handled</div>
      <div class="kpi-card__value kpi-card__value--green" id="comm-routine">0</div>
      <div class="kpi-card__sub">Automated / No action</div>
    </div>
  </div>

  <!-- Main Side-by-Side Comm Layout -->
  <div class="comm-layout">
    
    <!-- Left List of Threads -->
    <div class="comm-threads">
      <div class="comm-threads__search-box">
        <input type="text" class="os-search-input" id="thread-search" placeholder="Search WO#, contractor..." style="margin-bottom:0;">
        <select class="os-filter" id="thread-priority-filter" style="width: 100px;">
          <option value="all">All Pri</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="comm-threads__list" id="thread-list-container">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Right Thread Detail View -->
    <div class="comm-detail" id="thread-detail-container">
      <div class="comm-detail__empty">
        <div style="font-size:24px;color:#CBD5E1;font-family:Space Mono,monospace;font-weight:700;">[ ]</div>
        <div>Select a conversation from the left to view AI summary and message logs</div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';

      window.switchDetailTab = function (tabName) {
        var auditTab = document.getElementById('tab-audit-hub');
        var chatTab = document.getElementById('tab-live-chat');
        var auditPanel = document.getElementById('detail-panel-audit');
        var chatPanel = document.getElementById('detail-panel-chat');
        
        if (tabName === 'audit-hub') {
          if (auditTab) auditTab.classList.add('active');
          if (chatTab) chatTab.classList.remove('active');
          if (auditPanel) auditPanel.style.display = 'flex';
          if (chatPanel) chatPanel.style.display = 'none';
        } else {
          if (auditTab) auditTab.classList.remove('active');
          if (chatTab) chatTab.classList.add('active');
          if (auditPanel) auditPanel.style.display = 'none';
          if (chatPanel) chatPanel.style.display = 'flex';
        }
      };

      var currentChannel = 'all';
      var currentPriority = 'all';
      var searchQuery = '';
      var selectedWoNumber = null;

      function renderCommsLayout() {
        if (!window.EPCS_DATA) return;
        var data = window.EPCS_DATA;
        var filters = window.EPCS_FILTERS || { month: 'all', client: 'all', contractor: 'all' };

        // Helper to match filter conditions
        function matchGlobalFilters(wo) {
          if (filters.month !== 'all') {
            if (!wo.due_date || !wo.due_date.startsWith(filters.month)) return false;
          }
          if (filters.client !== 'all' && wo.client !== filters.client) return false;
          if (filters.contractor !== 'all' && wo.contractor !== filters.contractor) return false;
          return true;
        }

        // 1. Filter message list based on global filter and current channel tab
        var filteredComms = data.communications.filter(function (c) {
          var wo = data.work_orders.find(function (w) { return w.wo_number === c.wo_number; });
          if (!wo || !matchGlobalFilters(wo)) return false;
          
          if (currentChannel !== 'all' && c.channel !== currentChannel) return false;
          return true;
        });

        // 2. Group into threads by WO Number and detect AI labels
        var threadsMap = {};
        filteredComms.forEach(function (c) {
          if (!threadsMap[c.wo_number]) {
            threadsMap[c.wo_number] = {
              wo_number: c.wo_number,
              messages: [],
              contractor: c.contractor || 'Unknown',
              qc_issue: false,
              budget_request: false,
              routine: true, // Will turn false if exceptions found
              latest_timestamp: c.timestamp
            };
          }
          threadsMap[c.wo_number].messages.push(c);
          
          var lbl = c.ai_label || '';
          var txt = (c.message_text || '').toLowerCase();
          
          if (lbl === 'QC_Issue' || lbl === 'QC_Failure' || txt.includes('reject') || txt.includes('failed')) {
            threadsMap[c.wo_number].qc_issue = true;
            threadsMap[c.wo_number].routine = false;
          }
          if (lbl === 'Budget_Request' || txt.includes('markup') || txt.includes('additional') || txt.includes('$')) {
            threadsMap[c.wo_number].budget_request = true;
            threadsMap[c.wo_number].routine = false;
          }

          if (new Date(c.timestamp) > new Date(threadsMap[c.wo_number].latest_timestamp)) {
            threadsMap[c.wo_number].latest_timestamp = c.timestamp;
            threadsMap[c.wo_number].contractor = c.contractor || threadsMap[c.wo_number].contractor;
          }
        });

        var threads = Object.values(threadsMap);

        // Sort messages in each thread chronologically
        threads.forEach(function (t) {
          t.messages.sort(function (a, b) {
            return new Date(a.timestamp) - new Date(b.timestamp);
          });
        });

        // Sort threads by latest message timestamp descending
        threads.sort(function (a, b) {
          return new Date(b.latest_timestamp) - new Date(a.latest_timestamp);
        });

        // Filter threads locally by UI tab and search
        var finalThreads = threads.filter(function (t) {
          if (searchQuery.trim() !== '') {
            var q = searchQuery.toLowerCase();
            var woMatch = t.wo_number.toLowerCase().includes(q);
            var contractorMatch = t.contractor.toLowerCase().includes(q);
            var msgMatch = t.messages.some(function (m) {
              return (m.message_text || '').toLowerCase().includes(q) || (m.subject || '').toLowerCase().includes(q);
            });
            return woMatch || contractorMatch || msgMatch;
          }
          return true;
        });

        // Update KPIs based on AI Labels
        var budgetCount = threads.filter(function (t) { return t.budget_request; }).length;
        var qcCount = threads.filter(function (t) { return t.qc_issue; }).length;
        var routineCount = threads.filter(function (t) { return t.routine; }).length;
        var actionCount = budgetCount + qcCount;

        document.getElementById('comm-action-required').textContent = actionCount;
        document.getElementById('comm-budget-requests').textContent = budgetCount;
        document.getElementById('comm-qc-issues').textContent = qcCount;
        document.getElementById('comm-routine').textContent = routineCount;

        // Render thread items on the left
        var listContainer = document.getElementById('thread-list-container');
        listContainer.innerHTML = '';

        if (finalThreads.length === 0) {
          listContainer.innerHTML = '<div style="text-align:center;color:#8C8985;padding:20px;font-family:Space Mono,monospace;font-size:11px;">No threads found.</div>';
        } else {
          finalThreads.forEach(function (t) {
            var latestMsg = t.messages[t.messages.length - 1];
            var previewText = latestMsg ? latestMsg.message_text : '';
            var timeString = latestMsg ? new Date(latestMsg.timestamp).toLocaleDateString() : '';
            var activeClass = (selectedWoNumber === t.wo_number) ? 'active' : '';

            var item = document.createElement('div');
            item.className = 'thread-item ' + activeClass;
            item.dataset.wo = t.wo_number;

            var badgeHtml = '';
            if (t.qc_issue) {
              badgeHtml += '<span class="pill pill--red" style="padding:1px 6px; font-size:9px; margin-right:4px; font-weight:700;">QC ISSUE</span>';
            }
            if (t.budget_request) {
              badgeHtml += '<span class="pill pill--amber" style="padding:1px 6px; font-size:9px; font-weight:700;">BUDGET REQ</span>';
            }
            if (t.routine && badgeHtml === '') {
              badgeHtml += '<span class="pill pill--gray" style="padding:1px 6px; font-size:9px;">Routine</span>';
            }

            item.innerHTML = `
              <div class="thread-item__header">
                <span class="thread-item__wo">WO# ${t.wo_number}</span>
                <span class="thread-item__time">${timeString}</span>
              </div>
              <div class="thread-item__body">${previewText}</div>
              <div class="thread-item__meta">
                <span class="thread-item__contractor">${t.contractor}</span>
                <div style="display:flex; gap:2px;">${badgeHtml}</div>
              </div>
            `;

            item.addEventListener('click', function () {
              selectedWoNumber = t.wo_number;
              // Re-render to update active highlight
              renderCommsLayout();
            });

            listContainer.appendChild(item);
          });
        }

        // Render Right Thread Detail View
        var detailContainer = document.getElementById('thread-detail-container');
        if (!selectedWoNumber) {
          detailContainer.innerHTML = `
            <div class="comm-detail__empty">
              <div style="font-size:24px;color:#CBD5E1;font-family:Space Mono,monospace;font-weight:700;">[ ]</div>
              <div>Select a conversation from the left to view AI summary and message logs</div>
            </div>
          `;
          return;
        }

        // Find the active thread
        var activeThread = threads.find(function (t) { return t.wo_number === selectedWoNumber; });
        if (!activeThread) {
          // If active thread is no longer available under current filter
          selectedWoNumber = null;
          detailContainer.innerHTML = `
            <div class="comm-detail__empty">
              <div style="font-size:24px;color:#CBD5E1;font-family:Space Mono,monospace;font-weight:700;">[ ]</div>
              <div>Select a conversation from the left to view AI summary and message logs</div>
            </div>
          `;
          return;
        }

        // Get WO details
        var matchingWO = data.work_orders.find(function (w) { return w.wo_number === activeThread.wo_number; }) || {};

        // Find matching contractor details
        var contractorDetails = data.contractors.find(function (c) { 
          return c.name === activeThread.contractor; 
        }) || {};

        // Find matching client details
        var clientDetails = data.clients.find(function (c) { 
          return c.client_name === matchingWO.client; 
        }) || {};

        // Find matching financial record
        var fin = data.financial_records.find(function (f) { return f.wo_number === activeThread.wo_number; }) || {};
        var realMarginVal = (fin.received_amount || 0) - (fin.paid_to_contractor || 0);

        // Generate dynamic AI Summary & Action Items
        var aiSummary = generateAISummary(activeThread, matchingWO);

        // Header HTML
        var detailHeaderHtml = `
          <div class="comm-detail__header">
            <div>
              <div class="comm-detail__title">WO# ${activeThread.wo_number} — ${matchingWO.order_type || 'Preservation'}</div>
              <div class="comm-detail__sub">Client: <strong>${matchingWO.client || 'Unknown'}</strong> | Contractor: <strong>${activeThread.contractor}</strong> | Status: <strong>${matchingWO.status || 'Active'}</strong></div>
            </div>
            <div>
              <a href="#" class="pill pill--blue" id="btn-view-wo-detail" style="text-decoration:none;">View Work Order</a>
            </div>
          </div>
        `;

        // Render messages
        var messageFeedHtml = '';
        activeThread.messages.forEach(function (m) {
          var bubbleType = 'message-bubble--outbound';
          if (m.direction === 'Inbound') bubbleType = 'message-bubble--inbound';
          if (m.direction === 'Internal') bubbleType = 'message-bubble--internal';

          var channelLabel = m.channel; // 'Email', 'SMS', or 'Slack'
          var sentimentIcon = m.sentiment === 'Positive' ? '<span style="color:#1A6B3C;">●</span>' : (m.sentiment === 'Concerned' ? '<span style="color:#DC2626;">●</span>' : '<span style="color:#8C8985;">●</span>');
          var replyBadge = (m.needs_reply && m.direction === 'Inbound') ? '<span class="pill pill--red" style="font-size:9px; padding:1px 5px; margin-left:6px;">Needs Reply</span>' : '';

          var headerMeta = '';
          if (m.channel === 'Email') {
            headerMeta = `<strong>Subject: ${m.subject || 'No Subject'}</strong><br/>From: ${m.from_address} &rarr; To: ${m.to_address}`;
          } else if (m.channel === 'Slack') {
            headerMeta = `<strong># Slack Internal</strong><br/>From: ${m.from_address} &rarr; ${m.to_address}`;
          } else {
            headerMeta = `SMS Log — ${m.direction === 'Inbound' ? 'From Contractor' : 'From Office'}`;
          }

          messageFeedHtml += `
            <div class="message-bubble ${bubbleType}">
              <div style="font-size: 10px; color: var(--os-text-muted); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #F0EEE8;">
                <span style="font-weight:600;">${channelLabel}</span> | ${headerMeta} ${replyBadge}
              </div>
              <div style="white-space: pre-wrap;">${m.message_text}</div>
              <div class="message-bubble__time">
                ${new Date(m.timestamp).toLocaleString()} ${sentimentIcon}
              </div>
            </div>
          `;
        });

        // Combined detail container layout
        detailContainer.innerHTML = `
          ${detailHeaderHtml}
          <div class="comm-detail__content">
            <!-- AI Summary Box -->
            <div class="thread-summary-box">
              <div class="thread-summary-box__title">
                AI Copilot Summary & Conversation Audit
              </div>
              <div style="line-height: 1.4;">
                ${aiSummary.text}
              </div>
              <div class="thread-summary-box__actions">
                <strong>Required Action:</strong> ${aiSummary.action}
              </div>
            </div>

            <!-- Detail Tabs Toggle -->
            <div class="detail-tabs">
              <div class="detail-tab active" id="tab-audit-hub" onclick="window.switchDetailTab('audit-hub')">Audit Hub & Lifecycle</div>
              <div class="detail-tab" id="tab-live-chat" onclick="window.switchDetailTab('live-chat')">Live Chat Logs (${activeThread.messages.length})</div>
            </div>

            <!-- Panel 1: Audit Hub -->
            <div id="detail-panel-audit" style="display: flex; flex-direction: column; gap: 10px;">
              <!-- Property & Partner Metadata Grid -->
              <div class="audit-meta-grid">
                <!-- Property Address -->
                <div class="audit-meta-card">
                  <div class="audit-meta-card__label">PROPERTY SITE</div>
                  <div class="audit-meta-card__value" style="font-size:11.5px; font-weight:600; color:#1A1917; line-height:1.35;">
                    📍 ${matchingWO.address || 'N/A'}<br/>
                    ${matchingWO.city || ''}, ${matchingWO.state || ''} ${matchingWO.zip || ''}
                  </div>
                  <div class="audit-meta-card__sub" style="margin-top: 4px;">
                    <a href="https://maps.google.com/?q=${encodeURIComponent((matchingWO.address || '') + ', ' + (matchingWO.city || '') + ', ' + (matchingWO.state || '') + ' ' + (matchingWO.zip || ''))}" target="_blank" style="color: #2563eb; text-decoration: none; font-size:10px; font-weight:600;">View Map →</a>
                  </div>
                </div>
                
                <!-- Client Profile -->
                <div class="audit-meta-card">
                  <div class="audit-meta-card__label">CLIENT PARTNER</div>
                  <div class="audit-meta-card__value" style="font-size:13px; font-weight:700; color: #1a1917;">
                    ${matchingWO.client || 'Unknown'}
                  </div>
                  <div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; font-size:9.5px;">
                    <span style="background: #F3F4F6; padding: 2px 4px; border-radius: 4px;">SLA: ${clientDetails.sla_days || 5}d</span>
                    <span style="background: #F3F4F6; padding: 2px 4px; border-radius: 4px;">Terms: ${clientDetails.payment_terms || 'Net-30'}</span>
                    <span style="background: ${clientDetails.account_health === 'Green' ? '#D1FAE5; color: #065F46' : (clientDetails.account_health === 'Yellow' ? '#FEF3C7; color: #92400E' : '#FEE2E2; color: #991B1B')}; padding: 2px 4px; border-radius: 4px; font-weight:600;">Health: ${clientDetails.account_health || 'N/A'}</span>
                  </div>
                </div>

                <!-- Contractor Profile -->
                <div class="audit-meta-card">
                  <div class="audit-meta-card__label">ASSIGNED CONTRACTOR</div>
                  <div class="audit-meta-card__value" style="font-size:13px; font-weight:700; color: #1a1917;">
                    ${activeThread.contractor}
                  </div>
                  <div style="font-size:10.5px; color:#4B4743; margin-top:2px;">Phone: <strong>${contractorDetails.phone ? '+' + contractorDetails.phone : 'N/A'}</strong></div>
                  <div style="display:flex; gap:4px; margin-top:4px; font-size:9.5px;">
                    <span style="background: #EFF6FF; color: #1e40af; padding: 2px 4px; border-radius: 4px; font-weight:600;">Tier ${contractorDetails.tier || 'N/A'}</span>
                    <span style="background: #FAF5FF; color: #6b21a8; padding: 2px 4px; border-radius: 4px; font-weight:600;">Score: ${contractorDetails.score_composite || 'N/A'}%</span>
                  </div>
                </div>
              </div>

              <!-- Detailed Financial Ledger -->
              <div class="audit-section-title">Property Ledger & Financial Audit</div>
              <div class="audit-ledger-container">
                <div class="audit-ledger-grid">
                  <!-- Client Side -->
                  <div class="audit-ledger-col">
                    <div class="audit-ledger-col__title">CLIENT ACCOUNTING</div>
                    <div class="audit-ledger-row">
                      <span>Invoiced Amount</span>
                      <strong style="font-family: monospace;">$${fin.invoice_amount ? fin.invoice_amount.toFixed(2) : '0.00'}</strong>
                    </div>
                    <div class="audit-ledger-row">
                      <span>Client Deductions</span>
                      <span style="color: ${fin.client_leakage > 0 ? '#DC2626' : '#8c8985'}; font-family: monospace;">-$${fin.client_leakage ? fin.client_leakage.toFixed(2) : '0.00'}</span>
                    </div>
                    <div class="audit-ledger-row total">
                      <span>Total Collected</span>
                      <strong style="font-family: monospace; color: #166534;">$${fin.received_amount ? fin.received_amount.toFixed(2) : '0.00'}</strong>
                    </div>
                  </div>
                  
                  <!-- Contractor Side -->
                  <div class="audit-ledger-col">
                    <div class="audit-ledger-col__title">CONTRACTOR PAYMENTS</div>
                    <div class="audit-ledger-row">
                      <span>Base Expected Pay</span>
                      <strong style="font-family: monospace;">$${fin.expected_contractor ? fin.expected_contractor.toFixed(2) : '0.00'}</strong>
                    </div>
                    <div class="audit-ledger-row">
                      <span>Approved Markups</span>
                      <span style="color: ${fin.vendor_leakage > 0 ? '#1e3a8a' : '#8c8985'}; font-family: monospace;">+$${fin.vendor_leakage ? fin.vendor_leakage.toFixed(2) : '0.00'}</span>
                    </div>
                    <div class="audit-ledger-row total">
                      <span>Total Vendor Payout</span>
                      <strong style="font-family: monospace; color: #2563eb;">$${fin.paid_to_contractor ? fin.paid_to_contractor.toFixed(2) : '0.00'}</strong>
                    </div>
                  </div>
                </div>
                
                <!-- Consolidated Ledger Row -->
                <div class="audit-ledger-consolidated">
                  <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                    <div>
                      <div style="font-size:9px; color:#8C8985; font-weight:600;">REALIZED MARGIN</div>
                      <strong style="font-size:15px; color: ${realMarginVal < 0 ? '#DC2626' : '#166534'}; font-family: monospace;">
                        $${realMarginVal.toFixed(2)} (${((realMarginVal / (fin.invoice_amount || 1)) * 100).toFixed(1)}%)
                      </strong>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-size:9px; color:#8C8985; font-weight:600;">OUTSTANDING (A/R)</div>
                      <strong style="font-size:15px; color: ${(fin.invoice_amount - fin.received_amount) > 0 ? '#D97706' : '#8C8985'}; font-family: monospace;">
                        $${(fin.invoice_amount - fin.received_amount).toFixed(2)}
                      </strong>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-size:9px; color:#8C8985; font-weight:600;">TOTAL LEAKAGE</div>
                      <strong style="font-size:15px; color: ${fin.total_leakage > 0 ? '#DC2626' : '#8c8985'}; font-family: monospace;">
                        $${fin.total_leakage ? fin.total_leakage.toFixed(2) : '0.00'}
                      </strong>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Integrated Lifecycle Timeline -->
              <div class="audit-section-title">Combined Lifecycle Timeline (Assign to End)</div>
              <div class="audit-timeline-container">
                <div class="audit-timeline-line"></div>
                
                <!-- Step 1: Dispatch -->
                <div class="audit-timeline-item">
                  <div class="audit-timeline-dot done"></div>
                  <div class="audit-timeline-item__content">
                    <div class="audit-timeline-item__header">
                      <strong style="color:#1A1917;">1. Work Order Dispatched & SLA Init</strong>
                      <span class="audit-timeline-date">${matchingWO.assigned_date || 'N/A'}</span>
                    </div>
                    <div class="audit-timeline-badges">
                      <span class="badge badge--ppw">PPW</span>
                      <span class="badge badge--slack">SLACK</span>
                    </div>
                    <div class="audit-timeline-desc">
                      Work order assigned to <strong>${activeThread.contractor}</strong>.
                      Auto-notification alert broadcast to Slack channel <code>#dispatch-alerts</code>.
                    </div>
                  </div>
                </div>
                
                <!-- Step 2: Pricing -->
                <div class="audit-timeline-item">
                  <div class="audit-timeline-dot done"></div>
                  <div class="audit-timeline-item__content">
                    <div class="audit-timeline-item__header">
                      <strong style="color:#1A1917;">2. Pricing Verification & Bid Lock</strong>
                      <span class="audit-timeline-date">${matchingWO.assigned_date || 'N/A'}</span>
                    </div>
                    <div class="audit-timeline-badges">
                      <span class="badge badge--quo">QUO</span>
                      <span class="badge badge--sms">SMS</span>
                    </div>
                    <div class="audit-timeline-desc">
                      Base expected contractor pay set at <strong>$${fin.expected_contractor ? fin.expected_contractor.toFixed(2) : '0.00'}</strong>.
                      ${fin.vendor_leakage > 0 ? `
                        <div class="alert alert--warning" style="margin-top: 4px;">
                          <strong>Markup Request Approved:</strong> $${fin.vendor_leakage.toFixed(2)} requested for additional out-of-scope yard work via SMS.
                        </div>
                      ` : 'Allowable pricing validated. Bid locked.'}
                    </div>
                  </div>
                </div>

                <!-- Step 3: Execution -->
                <div class="audit-timeline-item">
                  <div class="audit-timeline-dot ${matchingWO.completion_date ? 'done' : 'active'}"></div>
                  <div class="audit-timeline-item__content">
                    <div class="audit-timeline-item__header">
                      <strong style="color:#1A1917;">3. Work Execution & Photo QC Gate</strong>
                      <span class="audit-timeline-date">${matchingWO.completion_date || 'In Progress'}</span>
                    </div>
                    <div class="audit-timeline-badges">
                      <span class="badge badge--ppw">PPW</span>
                      <span class="badge badge--qc">PHOTO QC</span>
                    </div>
                    <div class="audit-timeline-desc">
                      ${matchingWO.completion_date ? `
                        Work completed on-site. Photo evidence package uploaded and compiled in PPW.
                        <div class="alert alert--${matchingWO.risk_score > 30 ? 'danger' : 'success'}" style="margin-top: 4px;">
                          <strong>First-Pass QC Compliance:</strong> ${matchingWO.risk_score > 30 ? `FAILED (Risk Score: ${matchingWO.risk_score}) — Blurry street view and lockbox photos flagged.` : 'PASSED — Photos verify compliant work completion.'}
                        </div>
                      ` : 'Awaiting contractor completion upload. Dispatch SLA countdown active.'}
                    </div>
                  </div>
                </div>

                <!-- Step 4: Invoicing -->
                <div class="audit-timeline-item">
                  <div class="audit-timeline-dot ${fin.invoice_date ? 'done' : 'pending'}"></div>
                  <div class="audit-timeline-item__content">
                    <div class="audit-timeline-item__header">
                      <strong style="color:#1A1917;">4. Client Invoicing & Billing Loop</strong>
                      <span class="audit-timeline-date">${fin.invoice_date || 'Awaiting Invoice'}</span>
                    </div>
                    <div class="audit-timeline-badges">
                      <span class="badge badge--ppw">PPW</span>
                      <span class="badge badge--gmail">GMAIL</span>
                    </div>
                    <div class="audit-timeline-desc">
                      ${fin.invoice_date ? `
                        Invoiced client <strong>${matchingWO.client}</strong> for <strong>$${fin.invoice_amount ? fin.invoice_amount.toFixed(2) : '0.00'}</strong> under payment terms <strong>${clientDetails.payment_terms || 'Net-30'}</strong>.
                        Invoice generated and billing confirmation copy transmitted via Gmail to client desk.
                      ` : 'Pending completion approval before generating invoice.'}
                    </div>
                  </div>
                </div>

                <!-- Step 5: Settlement -->
                <div class="audit-timeline-item">
                  <div class="audit-timeline-dot ${fin.received_date ? 'done' : 'pending'}"></div>
                  <div class="audit-timeline-item__content">
                    <div class="audit-timeline-item__header">
                      <strong style="color:#1A1917;">5. Settlement & Margin Realization</strong>
                      <span class="audit-timeline-date">${fin.received_date || 'Pending Cash Receipt'}</span>
                    </div>
                    <div class="audit-timeline-badges">
                      <span class="badge badge--gmail">GMAIL</span>
                      <span class="badge badge--bank">BANK</span>
                    </div>
                    <div class="audit-timeline-desc">
                      ${fin.received_date ? `
                        Cash settlement confirmed. Total payment of <strong>$${fin.received_amount ? fin.received_amount.toFixed(2) : '0.00'}</strong> collected.
                        Collections duration: <strong>${Math.round((new Date(fin.received_date) - new Date(fin.invoice_date)) / 86400000)} days</strong> (Client average is ${clientDetails.payment_days_avg || 30} days).
                        ${fin.client_leakage > 0 ? `
                          <div class="alert alert--danger" style="margin-top: 4px;">
                            <strong>Deduction Notice:</strong> Client applied -$${fin.client_leakage.toFixed(2)} penalty details via Gmail due to photo QC gate fail.
                          </div>
                        ` : 'Margin fully realized without client deductions.'}
                      ` : `
                        Awaiting client cash settlement.
                        ${fin.invoice_date ? `
                          Outstanding balance: <strong>$${(fin.invoice_amount - fin.received_amount).toFixed(2)}</strong>.
                          Aging duration: <strong>${Math.round((new Date() - new Date(fin.invoice_date)) / 86400000)} days in accounts receivable</strong>.
                        ` : ''}
                      `}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Panel 2: Live Chat Message Feed (Hidden by default) -->
            <div id="detail-panel-chat" style="display: none; flex-direction: column; gap: 16px;">
              ${messageFeedHtml}
            </div>
          </div>
        `;

        // Add action to button
        var btnViewWO = document.getElementById('btn-view-wo-detail');
        if (btnViewWO) {
          btnViewWO.addEventListener('click', function (e) {
            e.preventDefault();
            // Switch to work orders view
            window.EPCS_FILTERS.month = 'all';
            window.EPCS_FILTERS.client = 'all';
            window.EPCS_FILTERS.contractor = 'all';
            
            // Trigger load via sidebar nav
            var woNavItem = document.querySelector('.os-nav__item[data-view="workorders"]');
            if (woNavItem) {
              // Pre-fill search in work orders or filter by WO number
              // For simplicity, we trigger filter click
              woNavItem.click();
              // After loading workorders, search it
              setTimeout(function() {
                var woSearchInput = document.getElementById('wo-search');
                if (woSearchInput) {
                  woSearchInput.value = activeThread.wo_number;
                  woSearchInput.dispatchEvent(new Event('input'));
                }
              }, 100);
            }
          });
        }
      }

      // Dynamic AI summary generator
      function generateAISummary(thread, wo) {
        var contractor = thread.contractor;
        var woNum = thread.wo_number;
        var serviceType = wo.order_type || 'Preservation Services';
        var client = wo.client || 'Client';

        // Check labels and text of messages
        var hasQCIssue = false;
        var hasBudgetRequest = false;
        var hasDelay = false;
        var hasCompletion = false;
        var isApproved = false;
        var issuesList = [];

        thread.messages.forEach(function (m) {
          var label = m.ai_label || '';
          var txt = (m.message_text || '').toLowerCase();
          
          if (label === 'QC_Issue' || label === 'QC_Failure' || txt.includes('photo') || txt.includes('reject') || txt.includes('failed')) {
            hasQCIssue = true;
          }
          if (label === 'Budget_Request' || txt.includes('bid') || txt.includes('markup') || txt.includes('additional') || txt.includes('$')) {
            hasBudgetRequest = true;
          }
          if (txt.includes('delay') || txt.includes('late') || txt.includes('extension') || txt.includes('tomorrow')) {
            hasDelay = true;
          }
          if (label === 'Completion' || txt.includes('completed') || txt.includes('finished') || txt.includes('done')) {
            hasCompletion = true;
          }
          if (label === 'Approval' || txt.includes('approved') || txt.includes('go ahead')) {
            isApproved = true;
          }
        });

        var summaryText = "";
        var actionText = "";

        if (hasQCIssue) {
          summaryText = "This thread concerns a <strong>Quality Control issue</strong> for the <strong>" + serviceType + "</strong>. The office has flagged missing or blurry photos. Contractor " + contractor + " was notified to retake street views and secure locks to prevent invoice deductions.";
          actionText = "Review incoming contractor photos in the Photo QC panel. Ensure lock close-up photos verify correct lockbox code before submitting to " + client + ".";
        } else if (hasBudgetRequest) {
          summaryText = "Contractor " + contractor + " is requesting a <strong>budget markup</strong> for the <strong>" + serviceType + "</strong> due to out-of-scope work encountered on-site. The contractor reports extra trash bags/yard debris and is requesting approval for additional costs.";
          actionText = "Verify bid rules against the PPW Allowable Pricing Schedule in the Bid Generator. Negotiate with " + client + " for markup approval before confirming vendor payout.";
        } else if (hasDelay) {
          summaryText = "Contractor reports a <strong>scheduling delay</strong> for <strong>" + serviceType + "</strong>. Factors cited include adverse weather conditions and delayed access codes to the property. Revised completion timeframe is pending.";
          actionText = "Update the work order SLA countdown. If necessary, request an extension in the client portal to avoid late submission penalties.";
        } else if (hasCompletion) {
          summaryText = "Contractor " + contractor + " reports <strong>successful completion</strong> of all line items for <strong>" + serviceType + "</strong> and has uploaded photos. Invoice is prepared for submission to " + client + ".";
          actionText = "Run automated Photo QC check to verify street and after-photos. If satisfactory, compile invoice and submit to " + client + " for approval.";
        } else {
          summaryText = "Standard communication history regarding the assignment and dispatch details for the <strong>" + serviceType + "</strong>. Timeline and instructions have been exchanged.";
          actionText = "None. Monitor thread for contractor updates or check-ins.";
        }

        return {
          text: summaryText,
          action: actionText
        };
      }

      // Setup Event Listeners for local filters
      var searchInput = document.getElementById('thread-search');
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          searchQuery = this.value;
          renderCommsLayout();
        });
      }

      var priorityFilter = document.getElementById('thread-priority-filter');
      if (priorityFilter) {
        priorityFilter.addEventListener('change', function () {
          currentPriority = this.value;
          renderCommsLayout();
        });
      }

      var channelTabs = document.getElementById('comm-channel-tabs');
      if (channelTabs) {
        channelTabs.querySelectorAll('.channel-tab').forEach(function (tab) {
          tab.addEventListener('click', function () {
            channelTabs.querySelectorAll('.channel-tab').forEach(function (t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentChannel = this.dataset.channel;
            selectedWoNumber = null; // Reset selection on channel switch
            renderCommsLayout();
          });
        });
      }

      window.addEventListener('epcs:view-loaded', function (e) {
        if (e.detail.view === 'communications') {
          currentChannel = 'all';
          currentPriority = 'all';
          
          // Check for deep link from Morning Pulse SMS alerts
          if (window.EPCS_FILTERS && window.EPCS_FILTERS.comm_search) {
             searchQuery = window.EPCS_FILTERS.comm_search;
             selectedWoNumber = window.EPCS_FILTERS.comm_search; // Auto-select the specific thread!
             if (searchInput) searchInput.value = searchQuery;
             delete window.EPCS_FILTERS.comm_search; // Consume the filter
          } else {
             searchQuery = '';
             selectedWoNumber = null;
             if (searchInput) searchInput.value = '';
          }
          
          if (priorityFilter) priorityFilter.value = 'all';
          if (channelTabs) {
            channelTabs.querySelectorAll('.channel-tab').forEach(function (t) { t.classList.remove('active'); });
            var allTab = channelTabs.querySelector('[data-channel="all"]');
            if (allTab) allTab.classList.add('active');
          }

          renderCommsLayout();
        }
      });

      window.addEventListener('epcs:filter-change', function () {
        var activeItem = document.querySelector('.os-nav__item.active');
        if (activeItem && activeItem.dataset.view === 'communications') {
          renderCommsLayout();
        }
      });

    })();
  </script>
</div>
