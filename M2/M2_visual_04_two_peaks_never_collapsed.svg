<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f7f2e8; }
      .grid-line { stroke: #e5e0d3; stroke-width: 1; }
      .axis { stroke: #12263f; stroke-width: 2.5; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 19px; font-weight: 800; fill: #12263f; }
      .peak-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.05em; }
      .peak-stat { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 900; }
      .sub-stat { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .body-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 500; fill: #334155; }
      .callout { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 800; fill: #b42318; }
      .mono { font-family: 'Consolas', monospace; }
    </style>
    <linearGradient id="grad1972" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12263f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1d3a5f" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="grad2005" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" class="bg" />

  <!-- Top Title Bar -->
  <rect x="40" y="20" width="880" height="50" rx="8" fill="#ffffff" stroke="#d6c8b2" stroke-width="1.5" />
  <text x="65" y="51" class="title">TWO PEAKS. NEVER COLLAPSE THEM. (1972 TOTAL vs. 2005 SINGLE-FAMILY)</text>
  <rect x="760" y="32" width="145" height="26" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1" />
  <text x="770" y="49" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#1e40af">ARCHIVED / HISTORICAL</text>

  <!-- Chart Canvas -->
  <g transform="translate(60, 90)">
    <!-- Y-Axis Grid Lines & Labels -->
    <g class="grid-line">
      <line x1="60" y1="50" x2="800" y2="50" />
      <line x1="60" y1="120" x2="800" y2="120" />
      <line x1="60" y1="190" x2="800" y2="190" />
      <line x1="60" y1="260" x2="800" y2="260" />
    </g>
    <text x="45" y="54" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#64748b">2.5M</text>
    <text x="45" y="124" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#64748b">2.0M</text>
    <text x="45" y="194" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#64748b">1.0M</text>
    <text x="45" y="264" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#64748b">0.5M</text>

    <!-- Baseline Axis -->
    <line x1="50" y1="300" x2="810" y2="300" class="axis" />
    <text x="815" y="304" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#12263f">TIME</text>

    <!-- LEFT MOUNTAIN: 1972 TOTAL PEAK (2,379,000) -->
    <!-- Base x: 100 to 320, Apex at (200, 58) -->
    <polygon points="100,300 200,58 310,300" fill="url(#grad1972)" stroke="#12263f" stroke-width="2.5" />
    <!-- Apex Marker Dot -->
    <circle cx="200" cy="58" r="6" fill="#f59e0b" stroke="#12263f" stroke-width="2" />
    
    <!-- 1972 Data Card Above Peak -->
    <g transform="translate(110, 8)">
      <rect width="180" height="45" rx="6" fill="#ffffff" stroke="#12263f" stroke-width="1.5" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))" />
      <text x="90" y="20" text-anchor="middle" class="peak-title" fill="#12263f">1972 TOTAL PEAK</text>
      <text x="90" y="38" text-anchor="middle" class="peak-stat" font-size="18" fill="#12263f">2,379,000</text>
    </g>

    <!-- 1972 Breakdown Flag Inside/Beside Mountain -->
    <g transform="translate(90, 140)">
      <rect width="170" height="95" rx="6" fill="#ffffff" opacity="0.95" stroke="#12263f" stroke-width="1" />
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#12263f">COMPOSITION:</text>
      <text x="12" y="34" class="sub-stat" fill="#0f766e">1,309,000 Single-Family</text>
      <text x="12" y="48" class="sub-stat" fill="#b45309">+ 1,070,000 Multifamily</text>
      <line x1="12" y1="55" x2="158" y2="55" stroke="#cbd5e1" />
      <text x="12" y="68" class="body-text">• Boomers forming households</text>
      <text x="12" y="80" class="body-text">• HUD 1968 Act (26M goal)</text>
      <text x="12" y="92" class="body-text">• Section 236 subsidized boom</text>
    </g>

    <!-- 1973 Nixon Moratorium Plummet Marker -->
    <line x1="310" y1="300" x2="350" y2="185" stroke="#b42318" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="350" cy="185" r="4" fill="#b42318" />
    <text x="358" y="180" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#b42318">1974: 1,353,000</text>
    <text x="358" y="192" font-family="'Segoe UI', sans-serif" font-size="8" fill="#64748b">(Nixon Moratorium)</text>

    <!-- RED DO-NOT-COLLAPSE DIVIDER FENCE -->
    <g transform="translate(425, 40)">
      <line x1="0" y1="0" x2="0" y2="255" stroke="#b42318" stroke-width="2.5" stroke-dasharray="5,4" />
      <rect x="-65" y="110" width="130" height="46" rx="6" fill="#fef2f2" stroke="#b42318" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(180,35,24,0.15))" />
      <text x="0" y="128" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#b42318" letter-spacing="0.06em">
        CRITICAL FENCE
      </text>
      <text x="0" y="144" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#991b1b">
        DO NOT ADD PEAKS
      </text>
    </g>

    <!-- RIGHT MOUNTAIN: 2005 SINGLE-FAMILY PEAK (1,716,000) -->
    <!-- Base x: 490 to 710, Apex at (600, 108) [height for 1.716M vs 2.379M] -->
    <polygon points="490,300 600,108 710,300" fill="url(#grad2005)" stroke="#0f766e" stroke-width="2.5" />
    <!-- Total Starts Ghost Ridge Behind: 2,068,000 (Apex at 600, 82) -->
    <polyline points="475,300 600,82 725,300" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4,3" fill="none" />
    <circle cx="600" cy="108" r="6" fill="#f59e0b" stroke="#0f766e" stroke-width="2" />
    
    <!-- 2005 Data Card Above Peak -->
    <g transform="translate(510, 48)">
      <rect width="180" height="48" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))" />
      <text x="90" y="18" text-anchor="middle" class="peak-title" fill="#0f766e">2005 SF PEAK</text>
      <text x="90" y="38" text-anchor="middle" class="peak-stat" font-size="18" fill="#0f766e">1,716,000</text>
    </g>

    <!-- 2005 Breakdown Flag Beside Mountain -->
    <g transform="translate(635, 125)">
      <rect width="165" height="95" rx="6" fill="#ffffff" opacity="0.95" stroke="#0f766e" stroke-width="1" />
      <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#0f766e">SINGLE-FAMILY ONLY:</text>
      <text x="10" y="32" class="sub-stat" fill="#12263f">Total Starts: 2,068,000</text>
      <line x1="10" y1="40" x2="155" y2="40" stroke="#cbd5e1" />
      <text x="10" y="54" class="body-text">• 5.87% avg 30yr rate</text>
      <text x="10" y="68" class="body-text">• Subprime lending surge</text>
      <text x="10" y="82" class="body-text">• Private securitisation</text>
      <text x="10" y="94" class="body-text">• Investor speculation</text>
    </g>

    <!-- 2009 Trough Marker (The Great Recession Floor) -->
    <g transform="translate(720, 240)">
      <line x1="0" y1="60" x2="35" y2="15" stroke="#b42318" stroke-width="1.5" />
      <circle cx="35" cy="15" r="4" fill="#b42318" />
      <rect x="25" y="-22" width="105" height="32" rx="4" fill="#fee2e2" stroke="#b42318" />
      <text x="77" y="-9" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#991b1b">2009 TROUGH</text>
      <text x="77" y="4" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" font-weight="900" fill="#7f1d1d">554,000</text>
    </g>

    <!-- 2024 Modern Benchmark Marker -->
    <g transform="translate(750, 185)">
      <circle cx="45" cy="0" r="3" fill="#12263f" />
      <text x="45" y="-8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#12263f">2024: 1,365,000</text>
    </g>
  </g>

  <!-- Bottom Interactive Classroom Prompt Strip -->
  <g transform="translate(40, 435)">
    <rect width="880" height="65" rx="8" fill="#12263f" stroke="#f59e0b" stroke-width="1.5" />
    <text x="25" y="27" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fef3c7" letter-spacing="0.08em">
      ORAL CLASSROOM DRILL (INSTRUCTOR BEAT):
    </text>
    <text x="25" y="48" font-family="'Georgia', serif" font-size="12.5" font-style="italic" fill="#ffffff">
      "Point to the left: Say TOTAL. Point to the right: Say SINGLE-FAMILY. Never collapse them.
      Our house was born in 1972 — the biggest TOTAL building year in American history."
    </text>
  </g>

  <!-- Footnote -->
  <text x="40" y="525" font-family="'Segoe UI', sans-serif" font-size="10" fill="#667085">
    Figure M2.4: Comparison of historical housing starts peaks. Source: U.S. Census Bureau / HUD Historical Housing Starts.
  </text>
</svg>
