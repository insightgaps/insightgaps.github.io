     components/header.html — v1.0
     Paste into every page. Appears on all pages without exception.
     To update: edit this file, then re-paste into all pages.
     ============================================================ -->

<a href="#main-content" class="skip-link">Skip to content</a>

<header class="site-header" role="banner">
  <div class="site-header__inner">

    <a href="/" class="site-header__logo" aria-label="Insight Gaps Bureau — Home">
      Insight&nbsp;Gaps
    </a>

    <button class="site-header__toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="primary-nav">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" id="primary-nav" aria-label="Primary navigation">
      <a href="/content/investigations/" class="site-nav__link">Investigations</a>
      <a href="/analysis/"               class="site-nav__link">Analysis</a>
      <a href="/archive.html"            class="site-nav__link">Archive</a>
      <a href="/about.html"              class="site-nav__link">About</a>
      <a href="/content/trust/methodology.html" class="site-nav__link">Trust</a>
    </nav>

  </div>
</header>

<script>
(function () {
  'use strict';

  var toggle = document.querySelector('.site-header__toggle');
  var nav    = document.querySelector('.site-nav');

  /* ---- Mobile toggle ---- */
  if (toggle && nav) {
    toggle.addEventListener('click', function () {
      var isOpen = nav.classList.toggle('site-nav--open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    /* Close when clicking outside */
    document.addEventListener('click', function (e) {
      if (!toggle.contains(e.target) && !nav.contains(e.target)) {
        nav.classList.remove('site-nav--open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    /* Close on Escape */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav.classList.contains('site-nav--open')) {
        nav.classList.remove('site-nav--open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
    });
  }

  /* ---- Active link — marks the current page ---- */
  var path  = window.location.pathname;
  var links = document.querySelectorAll('.site-nav__link');

  links.forEach(function (link) {
    var href = link.getAttribute('href');
    /* Exact match for root; prefix match for sections */
    if (
      href === path ||
      (href !== '/' && href.length > 1 && path.startsWith(href))
    ) {
      link.classList.add('site-nav__link--active');
      link.setAttribute('aria-current', 'page');
    }
  });

}());
</script>
