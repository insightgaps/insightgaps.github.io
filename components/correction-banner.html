<!-- ============================================================
     INSIGHT GAPS — CORRECTION BANNER
     components/correction-banner.html — v1.0

     WHEN TO USE:
     Paste this component only on investigation pages where
     has_correction is true in investigations.json.

     POSITION:
     Appears directly below the investigation hero section.
     Appears BEFORE the methodology badge.
     Never hidden. Never collapsible.

     BUILD INSTRUCTION:
     Replace every SLOT comment below with the correct values
     from investigations.json → correction_notes[].

     SLOT reference:
       correction_date        — ISO date, e.g. 2025-06-01
       correction_date_display — Human-readable, e.g. 1 June 2025
       correction_description — One-line plain description of what changed
     ============================================================ -->

<div class="correction-banner" role="note" aria-label="Correction notice">

  <span class="correction-banner__label">Correction Issued</span>

  <p class="correction-banner__text">
    <strong>
      <time datetime="<!-- SLOT: correction_date — ISO format, e.g. 2025-06-01 -->">
        <!-- SLOT: correction_date_display — e.g. 1 June 2025 -->
      </time>
    </strong>
    &mdash;
    <!-- SLOT: correction_description — one sentence describing what was corrected, e.g.:
         "An earlier version of this report stated 46 contaminated sites; the correct figure, drawn from the verified icddr,b dataset, is 44."
    -->
  </p>

  <a class="correction-banner__link"
     href="/content/trust/corrections.html">
    View full corrections log &rarr;
  </a>

</div>
