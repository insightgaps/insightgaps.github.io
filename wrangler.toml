# Cloudflare Pages configuration (git-integrated deployment).
# Docs: https://developers.cloudflare.com/pages/configuration/wrangler-configuration/
name = "insightgaps"
compatibility_date = "2026-01-01"
pages_build_output_dir = "public"

[build]
command = "pip install jinja2 && python scripts/build.py && python scripts/validate.py"

[build.environment]
PYTHON_VERSION = "3.11"
