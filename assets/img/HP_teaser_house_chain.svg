<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" style="background-color: #F9F8F6; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <linearGradient id="hpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F0EC"/>
    </linearGradient>
    <linearGradient id="hpAmberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A620C"/>
      <stop offset="100%" stop-color="#C17D11"/>
    </linearGradient>
    <filter id="hpShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1917" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="760" height="380" rx="12" fill="url(#hpBgGrad)" stroke="#E2E0DC" stroke-width="1.5" filter="url(#hpShadow)"/>

  <!-- Top Metadata Banner -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="168" height="26" rx="4" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1"/>
    <text x="12" y="17" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#7A4F0A" letter-spacing="1.2">COHORT LAB • 1972</text>

    <text x="185" y="18" font-family="'Space Mono', monospace" font-size="11" font-weight="400" fill="#6E6A63">FOUNDATION SERIES • ARCHITECTURAL NARRATIVE</text>
  </g>

  <!-- Editorial Headline -->
  <text x="50" y="112" font-size="28" font-weight="700" fill="#1A1917" letter-spacing="-0.5">Five Hours. One House. The Whole Chain.</text>
  <text x="50" y="138" font-family="'Lora', serif" font-style="italic" font-size="15" fill="#5C5954">The house did not break. The macroeconomic loop broke.</text>

  <!-- Stylized House Silhouette & Architecture -->
  <g transform="translate(70, 165)">
    <!-- Baseline Ground Line -->
    <line x1="0" y1="160" x2="340" y2="160" stroke="#1A1917" stroke-width="2"/>

    <!-- 1972 Suburb House Silhouette -->
    <!-- Foundation / Main Body -->
    <rect x="50" y="70" width="230" height="90" fill="#FFFFFF" stroke="#1A1917" stroke-width="2"/>
    
    <!-- Roof Pitch -->
    <polygon points="35,70 165,15 295,70" fill="#1A1917"/>
    <polygon points="45,68 165,22 285,68" fill="#F9F8F6"/>
    
    <!-- Chimney (Classic 1972 Brick Style) -->
    <rect x="220" y="25" width="28" height="40" fill="#1A1917"/>
    <line x1="216" y1="25" x2="252" y2="25" stroke="#9A620C" stroke-width="3"/>

    <!-- Front Door & Porch -->
    <rect x="145" y="105" width="36" height="55" fill="#9A620C" stroke="#1A1917" stroke-width="1.5"/>
    <circle cx="173" cy="133" r="2.5" fill="#FFFFFF"/>
    
    <!-- Windows (Paned Dual Sash) -->
    <rect x="75" y="92" width="46" height="38" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <line x1="98" y1="92" x2="98" y2="130" stroke="#1A1917" stroke-width="1"/>
    <line x1="75" y1="111" x2="121" y2="111" stroke="#1A1917" stroke-width="1"/>

    <rect x="205" y="92" width="56" height="38" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <line x1="233" y1="92" x2="233" y2="130" stroke="#1A1917" stroke-width="1"/>
    <line x1="205" y1="111" x2="261" y2="111" stroke="#1A1917" stroke-width="1"/>

    <!-- Year Marker Stamp -->
    <rect x="75" y="140" width="46" height="16" rx="2" fill="#F2F0EC"/>
    <text x="82" y="152" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#5C5954">EST. 1972</text>
  </g>

  <!-- The 5-Link Chain Diagram on Right -->
  <g transform="translate(450, 165)">
    <text x="0" y="15" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#9A620C" letter-spacing="1">THE FIVE-LINK CUSTODIAL CHAIN</text>
    
    <!-- Link 1: Capital -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="280" height="24" rx="4" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.2"/>
      <circle cx="16" cy="12" r="5" fill="#1A1917"/>
      <text x="32" y="16" font-size="12" font-weight="700" fill="#1A1917">1. Bank / Investor</text>
      <text x="175" y="16" font-family="'Space Mono', monospace" font-size="10" fill="#6E6A63">Financial Stake</text>
    </g>

    <!-- Connector -->
    <line x1="16" y1="56" x2="16" y2="64" stroke="#9A620C" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Link 2: Servicer -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="280" height="24" rx="4" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.2"/>
      <circle cx="16" cy="12" r="5" fill="#1A1917"/>
      <text x="32" y="16" font-size="12" font-weight="700" fill="#1A1917">2. Mortgage Servicer</text>
      <text x="180" y="16" font-family="'Space Mono', monospace" font-size="10" fill="#6E6A63">Portfolio Admin</text>
    </g>

    <!-- Connector -->
    <line x1="16" y1="88" x2="16" y2="96" stroke="#9A620C" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Link 3: National -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="280" height="24" rx="4" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.2"/>
      <circle cx="16" cy="12" r="5" fill="#1A1917"/>
      <text x="32" y="16" font-size="12" font-weight="700" fill="#1A1917">3. National Manager</text>
      <text x="195" y="16" font-family="'Space Mono', monospace" font-size="10" fill="#6E6A63">50-State Scale</text>
    </g>

    <!-- Connector -->
    <line x1="16" y1="120" x2="16" y2="128" stroke="#9A620C" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Link 4: Office -->
    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="280" height="24" rx="4" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1.5"/>
      <circle cx="16" cy="12" r="5" fill="#9A620C"/>
      <text x="32" y="16" font-size="12" font-weight="700" fill="#7A4F0A">4. Regional Office</text>
      <text x="175" y="16" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#9A620C">Audit &amp; Dispatch</text>
    </g>

    <!-- Connector -->
    <line x1="16" y1="152" x2="16" y2="160" stroke="#9A620C" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Link 5: Field Crew -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="280" height="24" rx="4" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.2"/>
      <circle cx="16" cy="12" r="5" fill="#1A6B3C"/>
      <text x="32" y="16" font-size="12" font-weight="700" fill="#1A1917">5. Field Contractor</text>
      <text x="182" y="16" font-family="'Space Mono', monospace" font-size="10" fill="#1A6B3C">Hands on House</text>
    </g>
  </g>

  <!-- Bottom Accent Rule -->
  <rect x="50" y="375" width="700" height="2" fill="url(#hpAmberGlow)"/>
</svg>
