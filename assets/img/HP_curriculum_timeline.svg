<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background-color: #F9F8F6; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="hpCardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A1917" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="15" y="15" width="930" height="450" rx="12" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.5" filter="url(#hpCardShadow)"/>

  <!-- Header -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="160" height="24" rx="4" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1"/>
    <text x="10" y="16" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#7A4F0A" letter-spacing="1">CURRICULUM SPINE</text>
    <text x="180" y="17" font-size="20" font-weight="700" fill="#1A1917">300 Minutes Elapsed • 280 Active + 20 Scheduled Breaks</text>
    <text x="0" y="44" font-family="'Lora', serif" font-style="italic" font-size="13" fill="#5C5954">Frozen M0–M10 pedagogical architecture. No renumbering, no re-timing, no re-mapping.</text>
  </g>

  <!-- Timeline Track 1: Hours 1 to 2.5 (M0 to M4 + Break 1) -->
  <g transform="translate(40, 115)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#9A620C" letter-spacing="1">PART 1: THE FOUNDATION &amp; THE LOOP (00:00 – 01:45)</text>
    
    <!-- Timeline Baseline -->
    <line x1="0" y1="42" x2="880" y2="42" stroke="#E2E0DC" stroke-width="3"/>

    <!-- M0 Block (10 min) -->
    <rect x="0" y="15" width="120" height="54" rx="6" fill="#F9F8F6" stroke="#1A1917" stroke-width="1.5"/>
    <text x="12" y="34" font-size="12" font-weight="700" fill="#1A1917">M0 (10 min)</text>
    <text x="12" y="52" font-size="10" fill="#5C5954">Promise &amp; Diagnostic</text>
    <text x="12" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">00:00–00:10</text>

    <!-- M1 Block (25 min) -->
    <rect x="135" y="15" width="135" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="147" y="34" font-size="12" font-weight="700" fill="#1A1917">M1 (25 min)</text>
    <text x="147" y="52" font-size="10" fill="#5C5954">5-Link Chain Map</text>
    <text x="147" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">00:10–00:35</text>

    <!-- M2 Block (30 min) -->
    <rect x="285" y="15" width="150" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="297" y="34" font-size="12" font-weight="700" fill="#1A1917">M2 (30 min)</text>
    <text x="297" y="52" font-size="10" fill="#5C5954">System &amp; Two Peaks</text>
    <text x="297" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">00:35–01:05</text>

    <!-- M3 Block (20 min) -->
    <rect x="450" y="15" width="130" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="462" y="34" font-size="12" font-weight="700" fill="#1A1917">M3 (20 min)</text>
    <text x="462" y="52" font-size="10" fill="#5C5954">Foreclosure Road</text>
    <text x="462" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">01:05–01:25</text>

    <!-- M4 Block (10 min) -->
    <rect x="595" y="15" width="125" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="607" y="34" font-size="12" font-weight="700" fill="#1A1917">M4 (10 min)</text>
    <text x="607" y="52" font-size="10" fill="#5C5954">Retrieval Checkpoint</text>
    <text x="607" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">01:25–01:35</text>

    <!-- Break 1 Block (10 min) -->
    <rect x="735" y="15" width="145" height="54" rx="6" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="747" y="34" font-size="11" font-weight="700" fill="#7A4F0A">BREAK 1 (10 min)</text>
    <text x="747" y="52" font-size="10" fill="#9A620C">Scheduled Rest</text>
    <text x="747" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#9A620C">01:35–01:45</text>
  </g>

  <!-- Timeline Track 2: Hours 2.5 to 5.0 (M5 to M10 + Break 2) -->
  <g transform="translate(40, 260)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#9A620C" letter-spacing="1">PART 2: OPERATIONS, FORENSICS &amp; COLD CAPSTONE (01:45 – 05:00)</text>
    
    <!-- Timeline Baseline -->
    <line x1="0" y1="42" x2="880" y2="42" stroke="#E2E0DC" stroke-width="3"/>

    <!-- M5 Block (30 min) -->
    <rect x="0" y="15" width="125" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="10" y="34" font-size="12" font-weight="700" fill="#1A1917">M5 (30 min)</text>
    <text x="10" y="52" font-size="10" fill="#5C5954">Roles &amp; Authority</text>
    <text x="10" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">01:45–02:15</text>

    <!-- M6 Block (35 min) -->
    <rect x="135" y="15" width="135" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="145" y="34" font-size="12" font-weight="700" fill="#1A1917">M6 (35 min)</text>
    <text x="145" y="52" font-size="10" fill="#5C5954">11 Stops &amp; Gate</text>
    <text x="145" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">02:15–02:50</text>

    <!-- M7 Block (25 min) -->
    <rect x="280" y="15" width="125" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="290" y="34" font-size="12" font-weight="700" fill="#1A1917">M7 (25 min)</text>
    <text x="290" y="52" font-size="10" fill="#5C5954">5 Work Types</text>
    <text x="290" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">02:50–03:15</text>

    <!-- Break 2 Block (10 min) -->
    <rect x="415" y="15" width="115" height="54" rx="6" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="425" y="34" font-size="10" font-weight="700" fill="#7A4F0A">BREAK 2 (10m)</text>
    <text x="425" y="52" font-size="10" fill="#9A620C">Rest Interval</text>
    <text x="425" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#9A620C">03:15–03:25</text>

    <!-- M8 Block (35 min) -->
    <rect x="540" y="15" width="125" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="550" y="34" font-size="12" font-weight="700" fill="#1A1917">M8 (35 min)</text>
    <text x="550" y="52" font-size="10" fill="#5C5954">Forensic Lab</text>
    <text x="550" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">03:25–04:00</text>

    <!-- M9 Block (25 min) -->
    <rect x="675" y="15" width="100" height="54" rx="6" fill="#FFFFFF" stroke="#1A1917" stroke-width="1.5"/>
    <text x="685" y="34" font-size="12" font-weight="700" fill="#1A1917">M9 (25m)</text>
    <text x="685" y="52" font-size="10" fill="#5C5954">Money Ladder</text>
    <text x="685" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">04:00–04:25</text>

    <!-- M10 Block (35 min) -->
    <rect x="785" y="15" width="95" height="54" rx="6" fill="#FDF3E3" stroke="#1A1917" stroke-width="2"/>
    <text x="793" y="34" font-size="12" font-weight="700" fill="#7A4F0A">M10 (35m)</text>
    <text x="793" y="52" font-size="10" fill="#1A1917">Capstone</text>
    <text x="793" y="84" font-family="'Space Mono', monospace" font-size="9" fill="#6E6A63">04:25–05:00</text>
  </g>

  <!-- Summary Footer Strip -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#1A1917">TOTAL: 300 MINUTES</text>
    <text x="160" y="0" font-family="'Space Mono', monospace" font-size="11" fill="#5C5954">11 ACTIVE MODULES (280 MIN) + 2 BREAKS (20 MIN) = COMPLETE IMMERSION</text>
  </g>
</svg>
