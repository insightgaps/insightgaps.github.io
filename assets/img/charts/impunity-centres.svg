<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="centres-title centres-desc">
  <title id="centres-title">Crisis Centre Coverage: 50 of 64 Districts Lack a Full One-Stop Crisis Centre</title>
  <desc id="centres-desc">Horizontal bar chart displaying national medical crisis infrastructure: 50 districts have no full One-Stop Crisis Centre, while only 14 tertiary hospitals have full multi-sector facilities.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #16130f; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #16130f; }
      .val { font-family: "Space Mono", ui-monospace, monospace; font-size: 20px; font-weight: 700; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">INFRASTRUCTURE DEFICIT AUDIT · MEDICAL CRISIS SUPPORT</text>
  <text x="32" y="58" class="title">Districts With and Without Full One-Stop Crisis Centres (OCC)</text>

  <!-- Bar 1: No full OCC -->
  <text x="32" y="104" class="label">Districts With No Full OCC (78.1%)</text>
  <rect x="380" y="84" width="410" height="30" rx="4" fill="#8c2b18"/>
  <text x="802" y="106" class="val" fill="#8c2b18">50 of 64 districts</text>

  <!-- Bar 2: Full OCC -->
  <text x="32" y="152" class="label">Districts With Full OCC (Medical Colleges)</text>
  <rect x="380" y="132" width="115" height="30" rx="4" fill="#16130f"/>
  <text x="506" y="154" class="val" fill="#16130f">14 of 64 (21.9%)</text>

  <text x="32" y="196" class="note">Source: Ministry of Women and Children Affairs, official status report May 2024. 47 regional crisis response cells operate at district level but lack full forensic, legal, and medical staff.</text>
</svg>
