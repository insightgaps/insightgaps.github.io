<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="wait-title wait-desc">
  <title id="wait-title">Trial Delay Audit: Statutory 90-Day Limit vs. 2,349-Day Average Verdict Wait</title>
  <desc id="wait-desc">Horizontal bar chart showing the statutory 90-day WCRPA tribunal trial limit against the actual average verdict wait of 2,349 days (over 6.4 years), a 26-fold delay.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #16130f; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #16130f; }
      .val { font-family: "Space Mono", ui-monospace, monospace; font-size: 20px; font-weight: 700; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="226" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">TRIBUNAL TIMELINE AUDIT · STATUTORY COMPLIANCE CHECK</text>
  <text x="32" y="58" class="title">Statutory Trial Limit vs. Actual Verdict Wait: A 26-Fold Delay</text>

  <!-- Statutory Bar -->
  <text x="32" y="104" class="label">Statutory Limit (WCRPA Section 20)</text>
  <rect x="360" y="84" width="31" height="30" rx="4" fill="#16130f"/>
  <text x="402" y="106" class="val" fill="#16130f">90 days (3 months)</text>

  <!-- Actual Wait Bar -->
  <text x="32" y="152" class="label">Actual Verdict Wait (BRAC Study)</text>
  <rect x="360" y="132" width="450" height="30" rx="4" fill="#8c2b18"/>
  <text x="822" y="154" class="val" fill="#8c2b18">2,349 days (6.4+ years)</text>

  <!-- Multiplier callout -->
  <rect x="630" y="84" width="230" height="30" rx="4" fill="#fff5f5" stroke="#8c2b18" stroke-width="1.5"/>
  <text x="745" y="105" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14.5px" font-weight="700" fill="#8c2b18">26.1× STATUTORY LIMIT</text>

  <text x="32" y="202" class="note">Source: BRAC 2022 study across 385 completed cases in 16 districts. Arithmetic: 2,349 ÷ 90 = 26.1×. Rate of 90-day compliance is zero in published sample.</text>
</svg>
