<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 155" role="img" aria-label="Punishment probability model range on a log scale">
<title>Punishment probability model range on a log scale</title>
<text x="0" y="22" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">Punishment probability model — log scale, model not a count</text><line x1="210" y1="80" x2="640" y2="80" stroke="#16130f" stroke-width="2"/><circle cx="227.7" cy="80" r="7" fill="#8c2b18"/><text x="227.7" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Floor 0.00034%</text><circle cx="469.7" cy="80" r="7" fill="#8c2b18"/><text x="469.7" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Mid 0.0215%</text><circle cx="618.5" cy="80" r="7" fill="#8c2b18"/><text x="618.5" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Ceiling 0.2756%</text><text x="0" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">Model A 0.0146 × 0.59 × 0.025 = 0.0215% (1 in about 4,650). Direction stable; no single point estimate without its range.</text>
