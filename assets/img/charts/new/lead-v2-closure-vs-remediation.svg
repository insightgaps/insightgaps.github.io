<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Before and after comparison: closure or demolition is an enforcement event, remediation is soil cleaned and verified clean; only the second changes the zero">
<title>Before / after: closure is not cleanup</title>
<text x="0" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">Before / after: closure is not cleanup</text>
<rect x="0" y="40" width="350" height="110" fill="#ffffff" stroke="#16130f"/>
<text x="12" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16130f">BEFORE — enforcement event</text>
<text x="12" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">• Facility shut down (28 in Jatrabari, 2025)</text>
<text x="12" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">• Smelter demolished</text>
<text x="12" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">• Soil lead: UNCHANGED, unmeasured after</text>
<rect x="370" y="40" width="350" height="110" fill="#f2ede3" stroke="#8c2b18"/>
<text x="382" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8c2b18">AFTER — remediation (none on record)</text>
<text x="382" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">• Contaminated soil removed or treated</text>
<text x="382" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">• Clean soil verified by testing</text>
<text x="382" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">• Public record published</text>
<text x="0" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16130f">Public-record count of the AFTER column at analysed coordinates: 0.</text>
<text x="0" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Absence of a record is not proof nothing ever happened anywhere — it is a record finding.</text>
<text x="0" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">Claim R-04, Confirmed, scoped to the public record at analysed coordinates.</text>
</svg>
