<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Timeline 2003 to 2026: documentation without permanent remediation">
<title>Lead Belt timeline: 22 years, zero permanent cleanups</title>
<text x="0" y="22" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">22 years of documentation, zero permanent cleanups</text>
<line x1="20" y1="70" x2="700" y2="70" stroke="#16130f" stroke-width="2"/>
<circle cx="40" cy="70" r="6" fill="#8c2b18"/>
<text x="15" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">2003</text>
<circle cx="160" cy="70" r="6" fill="#8c2b18"/>
<text x="135" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">2019</text>
<circle cx="290" cy="70" r="6" fill="#8c2b18"/>
<text x="265" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">2021</text>
<circle cx="410" cy="70" r="6" fill="#8c2b18"/>
<text x="385" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Feb 2025</text>
<circle cx="530" cy="70" r="6" fill="#8c2b18"/>
<text x="505" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Apr 2025</text>
<circle cx="650" cy="70" r="6" fill="#8c2b18"/>
<text x="625" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Mar 2026</text>
<text x="0" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">2003 — BBS documents 12,207 battery recycling operations.</text>
<text x="0" y="147" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">2019 — Pure Earth / University of Dhaka assess 270+ sites; no permanent closures follow.</text>
<text x="0" y="169" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">2021 — Kathgora blood-lead evidence at an abandoned site.</text>
<text x="0" y="191" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Feb 2025 — first formal MoU in 22 years.</text>
<text x="0" y="213" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Apr 2025 — 28 sites closed in Jatrabari and Savar; BD-4591 untouched.</text>
<text x="0" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Nov 2025 — MICS 2025 confirms the divisional gap.</text>
<text x="0" y="257" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Mar 2026 — this analysis publishes. Closures and demolitions are NOT remediation.</text>
<text x="0" y="285" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">Public-record finding at the analysed coordinates only — not proof none occurred anywhere.</text>
</svg>
