<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="defs-title defs-desc">
  <title id="defs-title">Two Counting Definitions: Police-FIR Ledger vs. 30-Day Modelled Standard</title>
  <desc id="defs-desc">Comparison diagram showing what the BRTA police-FIR official count includes and excludes versus the WHO 30-day modelled mortality definition.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #16130f; }
      .card-tag { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; }
      .card-title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #16130f; }
      .card-item { font-family: system-ui, -apple-system, sans-serif; font-size: 14.5px; fill: #2b2823; }
      .card-item-omit { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #8c2b18; }
      .footer-note { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="266" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">METHODOLOGY AUDIT · COUNTING DEFINITIONS</text>
  <text x="32" y="58" class="title">Two Counts, Two Ledgers: What Each Metric Includes and Excludes</text>

  <!-- Left Card: BRTA -->
  <g transform="translate(32, 76)">
    <rect width="436" height="142" rx="6" fill="#ffffff" stroke="#16130f" stroke-width="2"/>
    <text x="18" y="26" class="card-tag" fill="#16130f">OFFICIAL METRIC · 5,480 DEATHS/YR</text>
    <text x="18" y="52" class="card-title">BRTA Official Count (Police FIRs)</text>
    <text x="18" y="78" class="card-item">✓ Includes: Crashes formally logged in police station FIRs.</text>
    <text x="18" y="102" class="card-item-omit">✗ Omits: Victims dying in transit to hospital clinics.</text>
    <text x="18" y="124" class="card-item-omit">✗ Omits: Informal out-of-court financial settlements.</text>
  </g>

  <!-- Right Card: WHO -->
  <g transform="translate(492, 76)">
    <rect width="436" height="142" rx="6" fill="#fffdfa" stroke="#8c2b18" stroke-width="2"/>
    <text x="18" y="26" class="card-tag" fill="#8c2b18">GLOBAL STANDARD · 31,578 DEATHS/YR</text>
    <text x="18" y="52" class="card-title">WHO Modelled Toll (30-Day Window)</text>
    <text x="18" y="78" class="card-item">✓ Includes: All fatalities occurring within 30 days of crash.</text>
    <text x="18" y="102" class="card-item">✓ Modelled across health facilities, surveys, and trauma logs.</text>
    <text x="18" y="124" class="card-item" font-weight="600" fill="#8c2b18">Ratio: 5.76× (5.8×) difference between definitions.</text>
  </g>

  <text x="32" y="246" class="footer-note"><tspan font-weight="700">Finding:</tspan> The difference between 5,480 and 31,578 is a structural definition gap first and an arithmetic gap second. Hospital mortality remains unlinked to police crash files.</text>
</svg>
