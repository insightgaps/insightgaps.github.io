<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-label="Bar chart: statutory 90-day tribunal limit versus 2,349-day average verdict wait">
<title>90-day limit versus 2,349-day average wait</title>
<text x="0" y="22" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">The limit vs the wait — 26 times longer</text>
<text x="0" y="57" font-family="system-ui, sans-serif" font-size="13" fill="#16130f">Statutory limit</text>
<rect x="210" y="42" width="18" height="20" fill="#16130f"/>
<text x="233" y="57" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16130f">90 days</text>
<text x="0" y="91" font-family="system-ui, sans-serif" font-size="13" fill="#16130f">Average verdict wait</text>
<rect x="210" y="76" width="470" height="20" fill="#8c2b18"/>
<text x="0" y="125" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16130f">2,349 days — over six years (BRAC 2022, 16 districts, 385 cases).</text>
<text x="0" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">2,349 ÷ 90 = 26.1× the limit. 90-day compliance rate is unpublished.</text>
</svg>
