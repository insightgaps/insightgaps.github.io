<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="sat-title sat-desc">
  <title id="sat-title">Satellite Imagery: Corroboration, Never Proof — What It Can and Cannot Show</title>
  <desc id="sat-desc">Analytical schematic detailing satellite imagery limitations for environmental investigations: can show proximity and visible surface changes; cannot measure soil lead ppm, blood lead, or toxic emissions.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #16130f; }
      .box-tag { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; }
      .bullet { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; fill: #16130f; }
      .warn-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #8c2b18; }
      .note-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="296" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">REMOTE SENSING AUDIT · VERIFICATION LIMITS</text>
  <text x="32" y="58" class="title">Satellite Imagery: Corroboration, Never Proof of Contamination</text>

  <!-- Box 1: CAN SHOW -->
  <g transform="translate(32, 78)">
    <rect width="436" height="135" rx="6" fill="#f4f1ea" stroke="#16130f" stroke-width="2"/>
    <text x="18" y="28" class="box-tag" fill="#16130f">CAN SHOW (VISUAL INDICATORS)</text>
    <text x="18" y="58" class="bullet">• Proximity: factory structures adjacent to school grounds</text>
    <text x="18" y="86" class="bullet">• Surface physical change over time, against a baseline</text>
    <text x="18" y="114" class="bullet">• Visual indicators of continued site presence</text>
  </g>

  <!-- Box 2: CANNOT SHOW -->
  <g transform="translate(492, 78)">
    <rect width="436" height="135" rx="6" fill="#ffffff" stroke="#8c2b18" stroke-width="2"/>
    <text x="18" y="28" class="box-tag" fill="#8c2b18">CANNOT SHOW (UNMEASURED)</text>
    <text x="18" y="58" class="bullet">• Soil lead in ppm — requires laboratory XRF assay</text>
    <text x="18" y="86" class="bullet">• Child blood lead — requires clinical blood draws</text>
    <text x="18" y="114" class="bullet">• Active emissions or operational proof</text>
  </g>

  <!-- Footers -->
  <text x="32" y="244" class="warn-bold">UNSTATED for BD-4591 / BD-4802 pairs: sensor · date · resolution · cloud cover · baseline</text>
  <text x="32" y="268" class="note-sub">“351 days” is unverifiable from a month-only crackdown date. No satellite pair is reproduced without verifiable parameters.</text>
</svg>
