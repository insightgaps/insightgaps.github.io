<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165" role="img" aria-label="The Phoenix pattern: banned fleet, same chassis and route, new names">
<title>The Phoenix pattern: banned fleet, same chassis and route, new names</title>

<text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">The Phoenix pattern — what is probable, what is only alleged</text>
<rect x="10" y="50" width="200" height="70" fill="#f5f1e8" stroke="#16130f"/><text x="110" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Banned fleet, 2019</text><text x="110" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Suprobhat Paribahan</text>
<text x="225" y="92" font-family="system-ui, sans-serif" font-size="18" fill="#8c2b18">→</text>
<rect x="260" y="50" width="200" height="70" fill="#f5f1e8" stroke="#16130f"/><text x="360" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">Same chassis, same route</text><text x="360" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">Sadarghat–Gazipur</text>
<text x="475" y="92" font-family="system-ui, sans-serif" font-size="18" fill="#8c2b18">→</text>
<rect x="510" y="50" width="200" height="70" fill="#f5f1e8" stroke="#16130f"/><text x="610" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">New operator names</text><text x="610" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">incl. Victor Classic, Akash</text>
<text x="360" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">Route continuity: probable. Ownership continuity: alleged, not a registry finding. No guilt without a conviction.</text>
</svg>