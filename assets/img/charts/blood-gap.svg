<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="gap-title gap-desc">
  <title id="gap-title">Road Deaths Per Year: WHO Modelled Estimate vs. BRTA Official Count</title>
  <desc id="gap-desc">Horizontal bar chart comparing WHO 2023 modelled road fatalities of 31,578 against the BRTA official police-FIR count of 5,480, demonstrating a 5.8-fold gap.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #16130f; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #16130f; }
      .val { font-family: "Space Mono", ui-monospace, monospace; font-size: 20px; font-weight: 700; }
      .multiplier { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #8c2b18; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">FATALITY UNDERCOUNT AUDIT · CALCULATION CHECK</text>
  <text x="32" y="58" class="title">Road Deaths Per Year: WHO Modelled Estimate vs. BRTA Official Count</text>

  <!-- Bar 1: WHO Modelled -->
  <text x="32" y="104" class="label">WHO Modelled Estimate (30-day definition)</text>
  <rect x="380" y="84" width="430" height="30" rx="4" fill="#8c2b18"/>
  <text x="822" y="106" class="val" fill="#8c2b18">31,578</text>

  <!-- Bar 2: BRTA Official -->
  <text x="32" y="152" class="label">BRTA Official Count (Police FIR-only)</text>
  <rect x="380" y="132" width="74.6" height="30" rx="4" fill="#16130f"/>
  <text x="466" y="154" class="val" fill="#16130f">5,480</text>

  <!-- 5.8x Bracket / Callout -->
  <rect x="560" y="132" width="250" height="30" rx="4" fill="#fff5f5" stroke="#8c2b18" stroke-width="1.5"/>
  <text x="685" y="153" text-anchor="middle" class="multiplier">← 5.76× (5.8×) UNDERCOUNT</text>

  <text x="32" y="196" class="note">Source: WHO Global Status Report on Road Safety 2023 (modelled) vs. BRTA 2023 Annual Report (police FIR registry). Arithmetic: 31,578 ÷ 5,480 = 5.76×.</text>
</svg>
