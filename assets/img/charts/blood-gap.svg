<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 144" role="img" aria-label="Road deaths per year: modelled estimate vs official count">
<title>Road deaths per year: modelled estimate vs official count</title>
<text x="0" y="22" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">Road deaths per year: modelled estimate vs official count</text>
<text x="0" y="57" font-family="system-ui, sans-serif" font-size="13" fill="#16130f">WHO modelled estimate</text>
<rect x="210" y="42" width="430.0" height="20" fill="#8c2b18"/>
<text x="645" y="57" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16130f">31,578</text>
