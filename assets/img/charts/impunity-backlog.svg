<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="backlog-title backlog-desc">
  <title id="backlog-title">Tribunal Case Deficit: 2024 WCRPA Filings vs. Disposals</title>
  <desc id="backlog-desc">Horizontal bar chart showing 17,544 new WCRPA cases filed in 2024 compared to only 5,648 cases disposed, adding 11,896 cases to the cumulative judicial backlog.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #16130f; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #16130f; }
      .val { font-family: "Space Mono", ui-monospace, monospace; font-size: 20px; font-weight: 700; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">JUDICIAL BACKLOG AUDIT · ANNUAL TRIBUNAL DEFICIT</text>
  <text x="32" y="58" class="title">WCRPA Special Tribunals: 2024 New Filings vs. Case Disposals</text>

  <!-- Filings Bar -->
  <text x="32" y="104" class="label">New WCRPA Filings (2024)</text>
  <rect x="360" y="84" width="440" height="30" rx="4" fill="#8c2b18"/>
  <text x="812" y="106" class="val" fill="#8c2b18">17,544 cases</text>

  <!-- Disposals Bar -->
  <text x="32" y="152" class="label">Disposals Completed (2024)</text>
  <rect x="360" y="132" width="142" height="30" rx="4" fill="#16130f"/>
  <text x="512" y="154" class="val" fill="#16130f">5,648 cases</text>

  <!-- Deficit Callout -->
  <rect x="680" y="132" width="240" height="30" rx="4" fill="#fff5f5" stroke="#8c2b18" stroke-width="1.5"/>
  <text x="800" y="152" text-anchor="middle" font-family="Space Mono, monospace" font-size="14px" font-weight="700" fill="#8c2b18">+11,896 NET BACKLOG</text>

  <text x="32" y="196" class="note">Source: Supreme Court of Bangladesh Annual Judicial Statistics 2024. New filings outpace disposals by 3.1×, expanding cumulative unresolved tribunal caseload beyond 178,000 cases.</text>
</svg>
