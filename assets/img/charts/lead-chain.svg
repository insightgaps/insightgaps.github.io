<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="chain-title chain-desc">
  <title id="chain-title">Battery Scrap Market Structure: 6 Formal Recyclers vs. 6,000+ Informal Smelters</title>
  <desc id="chain-desc">Horizontal comparison chart showing market share breakdown: 6 formal licensed recyclers processing ~30% of battery waste with pollution controls, versus 6,000+ unlicensed backyard smelters processing ~70% without scrubbers.</desc>
  <defs>
    <style>
      .kicker { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; fill: #8c2b18; letter-spacing: 0.12em; text-transform: uppercase; }
      .title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 21px; font-weight: 700; fill: #16130f; }
      .card-tag { font-family: "Space Mono", ui-monospace, monospace; font-size: 14px; font-weight: 700; }
      .card-title { font-family: "Space Grotesk", system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #16130f; }
      .card-body { font-family: system-ui, -apple-system, sans-serif; font-size: 14.5px; fill: #2b2823; }
      .note { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #5c5954; }
    </style>
  </defs>

  <rect x="2" y="2" width="956" height="216" rx="8" fill="#fcfbf9" stroke="#e2e0dc" stroke-width="2"/>

  <text x="32" y="34" class="kicker">SUPPLY CHAIN AUDIT · RECYCLING MARKET FAILURE</text>
  <text x="32" y="58" class="title">Lead Battery Waste: 6 Formal Recyclers vs. 6,000+ Informal Smelters</text>

  <!-- Left: Formal -->
  <g transform="translate(32, 76)">
    <rect width="436" height="100" rx="6" fill="#ffffff" stroke="#16130f" stroke-width="2"/>
    <text x="18" y="26" class="card-tag" fill="#16130f">FORMAL SECTOR (LICENSED)</text>
    <text x="18" y="52" class="card-title">6 Licensed Industrial Plants</text>
    <text x="18" y="78" class="card-body">Processes ~30% of national used battery scrap with scrubbers.</text>
  </g>

  <!-- Right: Informal -->
  <g transform="translate(492, 76)">
    <rect width="436" height="100" rx="6" fill="#fff5f5" stroke="#8c2b18" stroke-width="2"/>
    <text x="18" y="26" class="card-tag" fill="#8c2b18">INFORMAL SECTOR (UNLICENSED)</text>
    <text x="18" y="52" class="card-title" fill="#8c2b18">6,000+ Backyard Workshops</text>
    <text x="18" y="78" class="card-body" font-weight="600">Processes ~70% of lead scrap with zero emissions controls.</text>
  </g>

  <text x="32" y="200" class="note">Source: Pure Earth Bangladesh market assessments. Informal furnace operations beside schools drive the residential soil contamination tracked in this investigation.</text>
</svg>
