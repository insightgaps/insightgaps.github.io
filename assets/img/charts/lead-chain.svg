<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 165" role="img" aria-label="Formal recyclers vs informal workshops">
<title>Formal recyclers vs informal workshops</title>

<text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">Battery waste: formal 6 against informal 6,000+</text>
<rect x="10" y="50" width="330" height="70" fill="#f5f1e8" stroke="#16130f"/><text x="175" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">6 formal licensed recyclers</text><text x="175" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">about 30% of waste</text>
<rect x="380" y="50" width="330" height="70" fill="#8c2b18"/><text x="545" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">6,000+ informal workshops</text><text x="545" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fff">about 70%, no scrubbers</text>
<text x="360" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">Informal smelting near schools is the chain this report traces — not a single factory.</text>
</svg>