<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 225" role="img" aria-label="The justice funnel: disclosure, police, charge sheet, trial, conviction">
<title>The justice funnel: disclosure, police, charge sheet, trial, conviction</title>

<text x="360" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#16130f">The funnel: each stage loses most of what enters it (stages only, not rates)</text>
<rect x="110" y="45" width="500" height="26" fill="#8c2b18"/><text x="360" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">1 · Disclosure</text>
<rect x="150" y="75" width="420" height="26" fill="#16130f"/><text x="360" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">2 · Police contact</text>
<rect x="190" y="105" width="340" height="26" fill="#6d675c"/><text x="360" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">3 · Charge sheet</text>
<rect x="230" y="135" width="260" height="26" fill="#8a8478"/><text x="360" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">4 · Trial</text>
<rect x="270" y="165" width="180" height="26" fill="#e3ddd0" stroke="#16130f"/><text x="360" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16130f">5 · Conviction</text>
<text x="360" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d675c">Widths are illustrative only. The measured range is 0.12% to 3.66% on different denominators — never averaged.</text>
</svg>