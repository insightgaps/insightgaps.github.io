<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Schematic, not to scale: a school gate 59 metres from a battery recycling factory, inside a 500 metre buffer">
<title>Schematic, not to scale: school gate 59 metres from a factory, inside a 500 metre buffer</title>
<circle cx="360" cy="130" r="110" fill="none" stroke="#e3ddd0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="360" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6d675c">500 metre screening buffer (schematic, not to scale — not a map)</text>
<rect x="330" y="105" width="60" height="50" fill="#8c2b18"/><text x="360" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">FACTORY</text>
<rect x="470" y="115" width="50" height="40" fill="#16130f"/><text x="495" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#16130f">SCHOOL GATE</text>
<line x1="390" y1="130" x2="470" y2="130" stroke="#8c2b18" stroke-width="2"/><text x="430" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8c2b18">59 m</text>
<text x="360" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#16130f">BD-4591, Kamrangir Char: 18 schools within 500 m of this single furnace, as published.</text></svg>