<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="lens-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <filter id="l-shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#12263F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#lens-bg)"/>
  <rect x="20" y="20" width="960" height="540" rx="12" fill="none" stroke="#D6C8B2" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="36" y="34" width="928" height="56" rx="8" fill="#12263F"/>
  <text x="54" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F59E0B" letter-spacing="1.5">TAKE-HOME JOB AID 04: THE FIVE FORENSIC EVIDENCE GATES</text>
  <text x="590" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">[FORENSIC QUALITY FRAMEWORK]</text>
  <rect x="836" y="48" width="112" height="28" rx="4" fill="#0F766E"/>
  <text x="892" y="66" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">5-GATE LENS</text>

  <!-- Subtitle -->
  <text x="38" y="116" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12263F">Photo quality never cures a missing right of entry.</text>
  <text x="38" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#4B5563">Every photograph submitted must pass five independent forensic gates before the Processor tags a single line item.</text>

  <!-- GATE 1: AUTHORITY (THE MASTER OVERARCHING GATE) -->
  <g transform="translate(38, 160)">
    <rect width="176" height="270" rx="8" fill="#FEF2F2" stroke="#B42318" stroke-width="2" filter="url(#l-shadow)"/>
    <rect width="176" height="38" rx="8" fill="#B42318"/>
    <text x="88" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">GATE 1: AUTHORITY</text>
    
    <text x="88" y="62" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#B42318" text-anchor="middle">Right to Enter?</text>
    <line x1="16" y1="74" x2="160" y2="74" stroke="#FECACA" stroke-width="1"/>

    <text x="16" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#12263F">Verification Checks:</text>
    <text x="16" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#334155">• Confirmed vacant?</text>
    <text x="16" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#334155">• Zero signs of life?</text>
    <text x="16" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#334155">• Jordan WA fence cleared?</text>
    <text x="16" y="160" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#334155">• Scope ordered in writing?</text>

    <rect x="12" y="180" width="152" height="74" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="18" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B42318">FAILURE MODE:</text>
    <text x="18" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#7F1D1D">Perfect photo + occupancy</text>
    <text x="18" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#7F1D1D">signal = TRESPASS RISK.</text>
    <text x="18" y="242" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#B42318">HOLD &amp; ESCALATE.</text>
  </g>

  <!-- GATE 2: PLACE -->
  <g transform="translate(226, 160)">
    <rect width="170" height="270" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#l-shadow)"/>
    <rect width="170" height="38" rx="8" fill="#1D3A5F"/>
    <text x="85" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">GATE 2: PLACE</text>
    
    <text x="85" y="62" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Is It This House?</text>
    <line x1="16" y1="74" x2="154" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <text x="16" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#12263F">Verification Checks:</text>
    <text x="16" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• House numbers visible</text>
    <text x="16" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Street scene context</text>
    <text x="16" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Consistent landmarks</text>
    <text x="16" y="160" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Address chain verified</text>

    <rect x="12" y="180" width="146" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="18" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B45309">FAILURE MODE:</text>
    <text x="18" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">Before shows yellow ranch;</text>
    <text x="18" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">After shows white colonial.</text>
    <text x="18" y="242" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#B42318">FAIL — RE-TRIP CREW.</text>
  </g>

  <!-- GATE 3: TIME -->
  <g transform="translate(408, 160)">
    <rect width="170" height="270" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#l-shadow)"/>
    <rect width="170" height="38" rx="8" fill="#1D3A5F"/>
    <text x="85" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">GATE 3: TIME</text>
    
    <text x="85" y="62" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Was It on Time?</text>
    <line x1="16" y1="74" x2="154" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <text x="16" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#12263F">Verification Checks:</text>
    <text x="16" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Date-stamp per rulebook</text>
    <text x="16" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Work within window</text>
    <text x="16" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• ML 2016-02 FHA compliance</text>
    <text x="16" y="160" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Zero altered metadata</text>

    <rect x="12" y="180" width="146" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="18" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B45309">FAILURE MODE:</text>
    <text x="18" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">Order due Oct 15;</text>
    <text x="18" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">Date-stamps show Oct 22.</text>
    <text x="18" y="242" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#B42318">ESCALATE LATE COMPLETION.</text>
  </g>

  <!-- GATE 4: SCOPE -->
  <g transform="translate(590, 160)">
    <rect width="170" height="270" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#l-shadow)"/>
    <rect width="170" height="38" rx="8" fill="#1D3A5F"/>
    <text x="85" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">GATE 4: SCOPE</text>
    
    <text x="85" y="62" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Was Entire Job Done?</text>
    <line x1="16" y1="74" x2="154" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <text x="16" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#12263F">Verification Checks:</text>
    <text x="16" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Full lot wide perimeter</text>
    <text x="16" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Edges trimmed &amp; cleared</text>
    <text x="16" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Every lock &amp; board shown</text>
    <text x="16" y="160" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Empty + swept room pairs</text>

    <rect x="12" y="180" width="146" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="18" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B45309">FAILURE MODE:</text>
    <text x="18" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">Mowed front yard only;</text>
    <text x="18" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">No rear yard or edge shots.</text>
    <text x="18" y="242" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#B42318">SCOPE INCOMPLETE — HOLD.</text>
  </g>

  <!-- GATE 5: CLARITY -->
  <g transform="translate(772, 160)">
    <rect width="190" height="270" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#l-shadow)"/>
    <rect width="190" height="38" rx="8" fill="#1D3A5F"/>
    <text x="95" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">GATE 5: CLARITY</text>
    
    <text x="95" y="62" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle">Can a Stranger Read It?</text>
    <line x1="16" y1="74" x2="174" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <text x="16" y="94" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#12263F">Verification Checks:</text>
    <text x="16" y="112" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Needle PSI gauge in focus</text>
    <text x="16" y="128" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Antifreeze hue unmistakable</text>
    <text x="16" y="144" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• No motion blur or dark glare</text>
    <text x="16" y="160" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" fill="#334155">• Lockbox tumblers spun off</text>

    <rect x="12" y="180" width="166" height="74" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="18" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B45309">FAILURE MODE:</text>
    <text x="18" y="214" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">Dark basement toilet bowl;</text>
    <text x="18" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#334155">Cannot tell antifreeze from water.</text>
    <text x="18" y="242" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#B42318">REJECT EVIDENCE FOR BLUR.</text>
  </g>

  <!-- Bottom Strip: The Stranger Test -->
  <g transform="translate(38, 448)">
    <rect width="924" height="96" rx="8" fill="#12263F"/>
    <text x="24" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#F59E0B" letter-spacing="1">THE STRANGER TEST &amp; INTEGRITY LAW:</text>
    <text x="24" y="48" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#FFFDF8">
      "If an auditor 1,000 miles away cannot independently prove the exact work occurred without asking you, the file is unproven."
    </text>
    <text x="24" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">
      Never fabricate, alter, backdate, or crop evidence to conceal an uncompleted requirement. Gaps go back — never papered over.
    </text>
    <text x="790" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#F59E0B">FIG 04: EVIDENCE 5 GATES</text>
  </g>
</svg>
