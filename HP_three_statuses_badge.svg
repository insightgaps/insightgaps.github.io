<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%" style="background-color: #F9F8F6; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="hpStatusShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A1917" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Box -->
  <rect x="15" y="15" width="730" height="270" rx="10" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.5" filter="url(#hpStatusShadow)"/>

  <!-- Title & Subtitle -->
  <g transform="translate(35, 42)">
    <rect x="0" y="0" width="140" height="22" rx="3" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1"/>
    <text x="8" y="15" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#7A4F0A" letter-spacing="1">HONEST BOUNDARY</text>
    <text x="160" y="16" font-size="18" font-weight="700" fill="#1A1917">Three Institutional Statuses — Never Blended</text>
  </g>

  <!-- 3 Status Columns -->
  <g transform="translate(35, 85)">
    <!-- Column 1: Attended -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="215" height="170" rx="6" fill="#F9F8F6" stroke="#E2E0DC" stroke-width="1.2"/>
      <rect x="0" y="0" width="215" height="6" rx="3" fill="#5C5954"/>
      <text x="14" y="28" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#5C5954">STATUS 1</text>
      <text x="14" y="52" font-size="16" font-weight="700" fill="#1A1917">Attended</text>
      <text x="14" y="78" font-size="12" font-weight="600" fill="#1A6B3C">Granted Upon Completion</text>
      <text x="14" y="105" font-family="'Lora', serif" font-size="12" fill="#5C5954">Participated in all 300 minutes, completed opening and closing diagnostics, and experienced the full 11-stop lifecycle.</text>
    </g>

    <!-- Column 2: Demonstrated in Class -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="220" height="170" rx="6" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="6" rx="3" fill="#9A620C"/>
      <text x="14" y="28" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#7A4F0A">STATUS 2</text>
      <text x="14" y="52" font-size="16" font-weight="700" fill="#7A4F0A">Demonstrated</text>
      <text x="14" y="78" font-size="12" font-weight="600" fill="#9A620C">Provisional Rubric Pass</text>
      <text x="14" y="105" font-family="'Lora', serif" font-size="12" fill="#5C5954">Identified all 4 traps in the cold capstone, satisfied the 4-check Update Line rubric, and defended independent decisions.</text>
    </g>

    <!-- Column 3: Operationally Authorised -->
    <g transform="translate(475, 0)">
      <rect x="0" y="0" width="215" height="170" rx="6" fill="#F9F8F6" stroke="#1A1917" stroke-width="1.2" stroke-dasharray="3,3"/>
      <rect x="0" y="0" width="215" height="6" rx="3" fill="#1A1917"/>
      <text x="14" y="28" font-family="'Space Mono', monospace" font-size="11" font-weight="700" fill="#1A1917">STATUS 3</text>
      <text x="14" y="52" font-size="16" font-weight="700" fill="#1A1917">Authorised</text>
      <text x="14" y="78" font-size="12" font-weight="600" fill="#6B1A1A">Employer Discretion Only</text>
      <text x="14" y="105" font-family="'Lora', serif" font-size="12" fill="#5C5954">NOT granted by class attendance. Requires formal company onboarding, client portal credentials, and live field supervision.</text>
    </g>
  </g>
</svg>
