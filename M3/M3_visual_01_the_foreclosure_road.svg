<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#141f32"/>
    </linearGradient>
    <filter id="roadShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#23354d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Header Bar -->
  <rect x="40" y="35" width="880" height="48" rx="8" fill="#12263f"/>
  <text x="60" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">THE FORECLOSURE ROAD: STRICT SEQUENTIAL ORDER</text>
  <rect x="740" y="47" width="165" height="24" rx="12" fill="#ef4444"/>
  <text x="822" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">LEGAL SEQUENCE</text>

  <!-- Five Sequential Stops Along the Road -->
  <!-- Stop 1: Default -->
  <g transform="translate(45, 115)" filter="url(#roadShadow)">
    <rect width="160" height="260" rx="10" fill="#162235" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#991b1b"/>
    <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STOP 1</text>
    
    <circle cx="80" cy="65" r="20" fill="#450a0a"/>
    <text x="80" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fca5a5" text-anchor="middle">30-90d</text>

    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">DEFAULT</text>
    <text x="80" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Missed Payments</text>

    <line x1="15" y1="140" x2="145" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• 30, 60, 90d late</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Notice of intent</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Borrower contact</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Not an eviction</text>

    <rect x="10" y="235" width="140" height="18" rx="4" fill="#0f172a"/>
    <text x="80" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">Delinquency Begins</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="212,240 222,245 212,250" fill="#f59e0b"/>

  <!-- Stop 2: Loss Mitigation FIRST -->
  <g transform="translate(225, 115)" filter="url(#roadShadow)">
    <rect width="160" height="260" rx="10" fill="#162235" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#065f46"/>
    <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STOP 2 • FIRST</text>
    
    <circle cx="80" cy="65" r="20" fill="#064e3b"/>
    <text x="80" y="72" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#34d399" text-anchor="middle">120d</text>

    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">LOSS MITIGATION</text>
    <text x="80" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Federal Floor (Reg X)</text>

    <line x1="15" y1="140" x2="145" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Forbearance plan</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Loan modification</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Approved short sale</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Deed-in-lieu</text>

    <rect x="10" y="235" width="140" height="18" rx="4" fill="#0f172a"/>
    <text x="80" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">Help Before Punishment</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="392,240 402,245 392,250" fill="#f59e0b"/>

  <!-- Stop 3: State Foreclosure -->
  <g transform="translate(405, 115)" filter="url(#roadShadow)">
    <rect width="160" height="260" rx="10" fill="#162235" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#b45309"/>
    <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STOP 3</text>
    
    <circle cx="80" cy="65" r="20" fill="#451a03"/>
    <text x="80" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">STATE</text>

    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">FORECLOSURE</text>
    <text x="80" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">Governed by State Law</text>

    <line x1="15" y1="140" x2="145" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Judicial (court suit)</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Non-judicial (trustee)</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Statutory notices</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Borrower redemption</text>

    <rect x="10" y="235" width="140" height="18" rx="4" fill="#0f172a"/>
    <text x="80" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Legal Title Action</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="572,240 582,245 572,250" fill="#f59e0b"/>

  <!-- Stop 4: Public Auction -->
  <g transform="translate(585, 115)" filter="url(#roadShadow)">
    <rect width="160" height="260" rx="10" fill="#162235" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="34" rx="10" fill="#1e3a8a"/>
    <text x="80" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STOP 4</text>
    
    <circle cx="80" cy="65" r="20" fill="#172554"/>
    <text x="80" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#60a5fa" text-anchor="middle">AUCTION</text>

    <text x="80" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">PUBLIC AUCTION</text>
    <text x="80" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#93c5fd" text-anchor="middle">Sheriff / Trustee Sale</text>

    <line x1="15" y1="140" x2="145" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Courthouse steps</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Lender credit bid</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• 3rd-party investor</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• If no bid: title reverts</text>

    <rect x="10" y="235" width="140" height="18" rx="4" fill="#0f172a"/>
    <text x="80" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">Title Transfer Point</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <polygon points="752,240 762,245 752,250" fill="#f59e0b"/>

  <!-- Stop 5: REO / Agency Home -->
  <g transform="translate(765, 115)" filter="url(#roadShadow)">
    <rect width="150" height="260" rx="10" fill="#162235" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="34" rx="10" fill="#5b21b6"/>
    <text x="75" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STOP 5</text>
    
    <circle cx="75" cy="65" r="20" fill="#2e1065"/>
    <text x="75" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#c4b5fd" text-anchor="middle">REO</text>

    <text x="75" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">REO / HUD</text>
    <text x="75" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Bank/Agency Owned</text>

    <line x1="15" y1="140" x2="135" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="12" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Bank REO inventory</text>
    <text x="12" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• HUD conveyance</text>
    <text x="12" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Routine preservation</text>
    <text x="12" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Property disposition</text>

    <rect x="8" y="235" width="134" height="18" rx="4" fill="#0f172a"/>
    <text x="75" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#c4b5fd" text-anchor="middle">Asset Liquidated</text>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(45, 400)">
    <rect width="870" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#ef4444">THE INVIOLABLE ORDER OF THE ROAD:</text>
    <text x="25" y="56" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0">
      "Say it aloud in order: <tspan font-weight="700" fill="#ffffff">Default ➔ Loss Mitigation FIRST ➔ Foreclosure ➔ Auction ➔ REO.</tspan> 
      Help comes before punishment. A servicer cannot jump directly from missed payment to foreclosure."
    </text>
  </g>
</svg>
