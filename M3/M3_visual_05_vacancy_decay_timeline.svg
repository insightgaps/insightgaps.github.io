<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#141f32"/>
    </linearGradient>
    <filter id="decayShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad5)"/>
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#23354d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Header Bar -->
  <rect x="40" y="35" width="880" height="48" rx="8" fill="#12263f"/>
  <text x="60" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">VACANCY DECAY TIMELINE: VACANCY ITSELF IS DAMAGE</text>
  <rect x="740" y="47" width="165" height="24" rx="12" fill="#ef4444"/>
  <text x="822" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">TEACHING SKETCH</text>

  <!-- Four Sequential Decay Stages -->
  <!-- Stage 1: Week 1 -->
  <g transform="translate(50, 115)" filter="url(#decayShadow)">
    <rect width="195" height="260" rx="10" fill="#162235" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="34" rx="10" fill="#b45309"/>
    <text x="97" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 1 • WEEK 1</text>
    
    <circle cx="97" cy="65" r="20" fill="#451a03"/>
    <text x="97" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">SIGNAL</text>

    <text x="97" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Visible Neglect</text>
    <text x="97" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">Signals Abandonment</text>

    <line x1="15" y1="140" x2="180" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Lawn exceeds 10–12"</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Mail &amp; flyers pile up</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Curtains drawn shut</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Driveway empty</text>

    <rect x="12" y="235" width="171" height="18" rx="4" fill="#0f172a"/>
    <text x="97" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Signals "Nobody Home"</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="252,240 262,245 252,250" fill="#ef4444"/>

  <!-- Stage 2: Weeks 2-4 -->
  <g transform="translate(270, 115)" filter="url(#decayShadow)">
    <rect width="195" height="260" rx="10" fill="#162235" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="34" rx="10" fill="#b45309"/>
    <text x="97" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 2 • WEEKS 2–4</text>
    
    <circle cx="97" cy="65" r="20" fill="#451a03"/>
    <text x="97" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fbbf24" text-anchor="middle">WATER</text>

    <text x="97" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Water Penetration</text>
    <text x="97" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">Small Leaks Spread</text>

    <line x1="15" y1="140" x2="180" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Clogged gutters pool</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Water breaches eaves</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Plumbing seals dry out</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Trap water evaporates</text>

    <rect x="12" y="235" width="171" height="18" rx="4" fill="#0f172a"/>
    <text x="97" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Moisture Barrier Fails</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="472,240 482,245 472,250" fill="#ef4444"/>

  <!-- Stage 3: Month 2 -->
  <g transform="translate(490, 115)" filter="url(#decayShadow)">
    <rect width="195" height="260" rx="10" fill="#162235" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="34" rx="10" fill="#991b1b"/>
    <text x="97" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 3 • MONTH 2</text>
    
    <circle cx="97" cy="65" r="20" fill="#450a0a"/>
    <text x="97" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#fca5a5" text-anchor="middle">MOLD</text>

    <text x="97" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Microbial Bloom</text>
    <text x="97" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Structural Dampness</text>

    <line x1="15" y1="140" x2="180" y2="140" stroke="#253752" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Damp becomes mold</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Drywall softens/sags</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Hardwood floors cup</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Odor penetrates rugs</text>

    <rect x="12" y="235" width="171" height="18" rx="4" fill="#0f172a"/>
    <text x="97" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#fca5a5" text-anchor="middle">Remediation Costs Spike</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="692,240 702,245 692,250" fill="#ef4444"/>

  <!-- Stage 4: Month 3+ -->
  <g transform="translate(710, 115)" filter="url(#decayShadow)">
    <rect width="195" height="260" rx="10" fill="#162235" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="34" rx="10" fill="#7f1d1d"/>
    <text x="97" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">STAGE 4 • MONTH 3+</text>
    
    <circle cx="97" cy="65" r="20" fill="#300707"/>
    <text x="97" y="72" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#f87171" text-anchor="middle">BLIGHT</text>

    <text x="97" y="110" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Vandalism &amp; Blight</text>
    <text x="97" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Catastrophic Loss</text>

    <line x1="15" y1="140" x2="180" y2="140" stroke="#450a0a" stroke-width="1"/>

    <text x="15" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Copper lines stripped</text>
    <text x="15" y="185" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• AC condenser stolen</text>
    <text x="15" y="205" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Windows broken out</text>
    <text x="15" y="225" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• House slides to blighted</text>

    <rect x="12" y="235" width="171" height="18" rx="4" fill="#0f172a"/>
    <text x="97" y="248" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#f87171" text-anchor="middle">Total Asset Impairment</text>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(50, 400)">
    <rect width="860" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#ef4444">THE VACANCY DECAY AXIOM:</text>
    <text x="25" y="56" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0">
      "Vacancy itself is damage. <tspan font-weight="700" fill="#ffffff">Nobody has to hit the house for the house to break.</tspan> 
      Empty is enough. The median US home is 42 years old; aging roofs and unheated pipes do not wait for the bank to finish paperwork."
    </text>
  </g>
</svg>
