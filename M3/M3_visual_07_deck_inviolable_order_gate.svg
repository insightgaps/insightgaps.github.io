<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gateBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="50%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="gateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>

    <!-- Drop Shadow for Cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Linear Gradient for Barrier Gate -->
    <linearGradient id="barrierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="url(#gateBgGrad)"/>
  <rect x="15" y="15" width="930" height="510" rx="12" fill="none" stroke="#1e3250" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Top Banner / Header -->
  <g transform="translate(40, 30)">
    <rect width="880" height="50" rx="8" fill="#112239" stroke="#253e63" stroke-width="1.5"/>
    <text x="25" y="32" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.02em">
      THE INVIOLABLE ORDER GATE: HELP BEFORE PUNISHMENT
    </text>
    <rect x="685" y="12" width="175" height="26" rx="13" fill="#ef4444"/>
    <text x="772" y="29" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.06em">
      12 CFR § 1024.41 RULE
    </text>
  </g>

  <!-- Left Zone: The Distressed House (Days 1–120) -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="250" height="320" rx="10" fill="#121d30" stroke="#334d73" stroke-width="1.5"/>
    
    <!-- Zone Header -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 240 0 C 245.5 0 250 4.5 250 10 L 250 36 L 0 36 Z" fill="#1b2a45"/>
    <text x="125" y="23" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="0.06em">
      ZONE 1 • PRE-FORECLOSURE
    </text>

    <!-- House Silhouette Graphic -->
    <g transform="translate(35, 52)">
      <!-- Ground line -->
      <line x1="0" y1="95" x2="180" y2="95" stroke="#475569" stroke-width="2"/>
      <!-- Tall Grass Blades -->
      <path d="M 10 95 L 14 78 L 18 95 M 25 95 L 30 72 L 35 95 M 145 95 L 150 75 L 155 95 M 165 95 L 170 80 L 175 95" stroke="#10b981" stroke-width="1.5"/>
      <!-- House Body -->
      <polygon points="90,15 155,55 25,55" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <rect x="40" y="55" width="100" height="40" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <!-- Windows & Door -->
      <rect x="52" y="65" width="20" height="18" fill="#090e17" stroke="#475569" stroke-width="1"/>
      <rect x="108" y="65" width="20" height="18" fill="#090e17" stroke="#475569" stroke-width="1"/>
      <rect x="80" y="70" width="18" height="25" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <!-- Door Notice Tag -->
      <rect x="84" y="76" width="10" height="8" fill="#ef4444"/>
    </g>

    <!-- Delinquency Stage Details -->
    <g transform="translate(18, 165)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fbbf24">742 Evergreen Road</text>
      <text x="0" y="16" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">Miller Family • Born 1972</text>

      <line x1="0" y1="28" x2="214" y2="28" stroke="#253e63" stroke-width="1"/>

      <text x="0" y="46" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#ef4444">• Day 1: Contract Payment Missed</text>
      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Day 15: Statutory Late Fee</text>
      <text x="0" y="82" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#cbd5e1">• Day 30–90: Notice of Intent</text>
      <text x="0" y="100" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8">• Title &amp; Possession: BORROWER</text>

      <rect x="0" y="112" width="214" height="26" rx="4" fill="#0c1829" stroke="#1d4ed8" stroke-width="1"/>
      <text x="107" y="129" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#60a5fa" text-anchor="middle">
        NO REKEY • BORROWER OWNS HOME
      </text>
    </g>
  </g>

  <!-- Center Zone: The 120-Day Inviolable Security Gate -->
  <g transform="translate(310, 95)" filter="url(#cardShadow)">
    <rect width="320" height="320" rx="10" fill="#13233c" stroke="#f59e0b" stroke-width="2.5" filter="url(#gateGlow)"/>

    <!-- Gate Header -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 310 0 C 315.5 0 320 4.5 320 10 L 320 40 L 0 40 Z" fill="url(#barrierGrad)"/>
    <text x="160" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="#090e17" text-anchor="middle" letter-spacing="0.08em">
      THE 120-DAY FEDERAL SHIELD
    </text>

    <!-- Big Shield Icon & Statute -->
    <g transform="translate(160, 80)">
      <!-- Shield Shape -->
      <path d="M -32 -25 L 32 -25 L 32 10 C 32 30 0 48 0 48 C 0 48 -32 30 -32 10 Z" fill="#065f46" stroke="#10b981" stroke-width="2.5" filter="url(#emeraldGlow)"/>
      <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">120</text>
      <text x="0" y="19" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" fill="#6ee7b7" text-anchor="middle">DAYS</text>
    </g>

    <!-- The Barrier Rule Banner -->
    <g transform="translate(20, 140)">
      <rect width="280" height="34" rx="6" fill="#091424" stroke="#ef4444" stroke-width="1.5"/>
      <text x="140" y="22" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="900" fill="#f87171" text-anchor="middle" letter-spacing="0.04em">
        ⛔ FORECLOSURE FILING FORBIDDEN
      </text>
    </g>

    <!-- The 4 Loss Mitigation Remedies -->
    <g transform="translate(20, 186)">
      <text x="140" y="14" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">
        MANDATORY LOSS MITIGATION FIRST:
      </text>

      <!-- 4 Remedies Grid -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="134" height="38" rx="5" fill="#0c251f" stroke="#10b981" stroke-width="1"/>
        <text x="67" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#86efac" text-anchor="middle">1. FORBEARANCE</text>
        <text x="67" y="30" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Temporary pause</text>

        <rect x="146" y="0" width="134" height="38" rx="5" fill="#0c251f" stroke="#10b981" stroke-width="1"/>
        <text x="213" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#86efac" text-anchor="middle">2. MODIFICATION</text>
        <text x="213" y="30" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Recapitalize loan</text>

        <rect x="0" y="44" width="134" height="38" rx="5" fill="#0c251f" stroke="#10b981" stroke-width="1"/>
        <text x="67" y="60" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#86efac" text-anchor="middle">3. SHORT SALE</text>
        <text x="67" y="74" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Sell below balance</text>

        <rect x="146" y="44" width="134" height="38" rx="5" fill="#0c251f" stroke="#10b981" stroke-width="1"/>
        <text x="213" y="60" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#86efac" text-anchor="middle">4. DEED-IN-LIEU</text>
        <text x="213" y="74" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">Sign title back</text>
      </g>
    </g>

    <!-- Bottom Shield Warning -->
    <text x="160" y="310" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#fca5a5" text-anchor="middle">
      CFPB RESPA: DUAL-TRACKING IS STRICTLY ILLEGAL
    </text>
  </g>

  <!-- Right Zone: Downstream Transfer (>Day 120 Only) -->
  <g transform="translate(650, 95)" filter="url(#cardShadow)">
    <rect width="270" height="320" rx="10" fill="#121d30" stroke="#334d73" stroke-width="1.5"/>

    <!-- Zone Header -->
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 260 0 C 265.5 0 270 4.5 270 10 L 270 36 L 0 36 Z" fill="#1b2a45"/>
    <text x="135" y="23" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="0.06em">
      ZONE 3 • LEGAL REFERRAL (>120d)
    </text>

    <!-- Step 3: State Foreclosure -->
    <g transform="translate(15, 48)">
      <rect width="240" height="66" rx="6" fill="#18263e" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#93c5fd">STOP 3: STATE FORECLOSURE</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#cbd5e1">• Judicial (Courts): 500–1,000+ days (NY, FL, OH)</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#cbd5e1">• Non-Judicial (Power of Sale): 60–150 days (TX, GA)</text>
    </g>

    <!-- Connector Arrow -->
    <polygon points="135,120 141,126 129,126" fill="#f59e0b"/>

    <!-- Step 4: Public Auction -->
    <g transform="translate(15, 132)">
      <rect width="240" height="66" rx="6" fill="#18263e" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fcd34d">STOP 4: PUBLIC AUCTION</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#cbd5e1">• Third-party bid beats credit bid ➔ Private Sale</text>
      <text x="12" y="54" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#cbd5e1">• No third-party bid ➔ Reverts to Lender / Agency</text>
    </g>

    <!-- Connector Arrow -->
    <polygon points="135,204 141,210 129,210" fill="#f59e0b"/>

    <!-- Step 5: REO / HUD Asset -->
    <g transform="translate(15, 216)">
      <rect width="240" height="74" rx="6" fill="#0c231a" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#6ee7b7">STOP 5: REO / HUD INVENTORY</text>
      <text x="12" y="38" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#e2e8f0">• Bank owns title (REO) or conveys to HUD</text>
      <text x="12" y="52" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#a7f3d0">• PRESERVATION DISPATCH AUTHORIZED</text>
      <text x="12" y="66" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#94a3b8">Initial secure, lockbox, rekey, winterization, cut</text>
    </g>
  </g>

  <!-- Bottom Classroom Chanting Ribbon -->
  <g transform="translate(40, 430)">
    <rect width="880" height="75" rx="8" fill="#091322" stroke="#253e63" stroke-width="1.5"/>
    
    <!-- Rhythm Chant Leader Tag -->
    <rect x="20" y="14" width="130" height="22" rx="4" fill="#f59e0b"/>
    <text x="85" y="29" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#090e17" text-anchor="middle" letter-spacing="0.08em">
      CLASSROOM CHANT
    </text>

    <!-- The 5 Chanted Steps -->
    <text x="165" y="31" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.04em">
      DEFAULT  ➔  <tspan fill="#34d399">LOSS MITIGATION FIRST</tspan>  ➔  FORECLOSURE  ➔  AUCTION  ➔  REO
    </text>

    <!-- Field Warning Subtitle -->
    <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#ef4444">
      CRITICAL FIELD RULE:
      <tspan fill="#e2e8f0" font-weight="400">
        Rekeying a home before title conveys (or prior to verified vacancy determination) is an unlawful lockout and criminal trespass.
      </tspan>
    </text>
  </g>
</svg>
