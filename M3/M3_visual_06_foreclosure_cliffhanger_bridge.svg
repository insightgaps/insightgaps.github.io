<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="duskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowGold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#duskGrad)"/>
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#253752" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Header Bar -->
  <rect x="40" y="35" width="880" height="48" rx="8" fill="#12263f"/>
  <text x="60" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">THE CLIFFHANGER: NOBODY IS PAID TO CARE ABOUT HER — YET</text>
  <rect x="740" y="47" width="165" height="24" rx="12" fill="#f59e0b"/>
  <text x="822" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#090e17" text-anchor="middle">THE MISSING LINK</text>

  <!-- Left: Twilight House Illustration -->
  <g transform="translate(60, 110)">
    <rect width="400" height="275" rx="10" fill="#0c1322" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Moon / Dusk Sky -->
    <circle cx="340" cy="50" r="22" fill="#fef08a" opacity="0.8"/>
    
    <!-- House Silhouette -->
    <!-- Ground Line -->
    <line x1="20" y1="230" x2="380" y2="230" stroke="#334155" stroke-width="2"/>
    
    <!-- Overgrown Grass Blades -->
    <path d="M 30 230 L 35 190 L 40 230 M 50 230 L 56 185 L 62 230 M 75 230 L 80 195 L 85 230 M 110 230 L 118 180 L 125 230 M 270 230 L 275 190 L 282 230 M 310 230 L 316 185 L 324 230 M 345 230 L 352 195 L 360 230" stroke="#475569" stroke-width="2"/>

    <!-- Main House Structure -->
    <polygon points="120,130 200,60 280,130" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="135" y="130" width="130" height="100" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    
    <!-- Dark Windows -->
    <rect x="150" y="145" width="28" height="34" fill="#090e17" stroke="#334155" stroke-width="1.5"/>
    <rect x="222" y="145" width="28" height="34" fill="#090e17" stroke="#334155" stroke-width="1.5"/>

    <!-- Door with Red Notice -->
    <rect x="185" y="170" width="30" height="60" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="193" y="188" width="14" height="18" fill="#ef4444"/>

    <!-- Fallen Gutter -->
    <line x1="120" y1="130" x2="160" y2="165" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Caption Banner -->
    <rect x="20" y="240" width="360" height="25" rx="4" fill="#1e293b"/>
    <text x="200" y="256" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">
      742 Evergreen Road [HOUSE NAME] • Month 4 of Distress
    </text>
  </g>

  <!-- Right: The Disconnected Institutional Chain -->
  <g transform="translate(485, 110)">
    <rect width="425" height="275" rx="10" fill="#152136" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="425" height="34" rx="10" fill="#1e2c42"/>
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fcd34d">THE DISCONNECTED SYSTEM</text>

    <g transform="translate(20, 50)">
      <!-- Entity 1: Investor -->
      <rect x="0" y="0" width="385" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#93c5fd">THE INVESTOR (WALL STREET):</text>
      <text x="12" y="32" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Holds mortgage-backed bond. Sees a delinquent line on a spreadsheet.</text>

      <!-- Entity 2: Servicer -->
      <rect x="0" y="50" width="385" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#93c5fd">THE SERVICER (DALLAS):</text>
      <text x="12" y="32" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Manages loan accounting. Sent letters. Has no boots on the ground.</text>

      <!-- Entity 3: Trustee -->
      <rect x="0" y="100" width="385" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#93c5fd">THE FORECLOSURE TRUSTEE:</text>
      <text x="12" y="32" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Scheduled courthouse auction for next month. Does not mow lawns.</text>

      <!-- The Solution Callout -->
      <rect x="0" y="152" width="385" height="60" rx="6" fill="#0c2e21" stroke="#10b981" stroke-width="1.5" filter="url(#glowGold)"/>
      <text x="12" y="174" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="900" fill="#86efac">WHO PROTECTS THE ASSET?</text>
      <text x="12" y="194" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">
        The Property Preservation Office.
      </text>
    </g>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(60, 400)">
    <rect width="850" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="28" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#f59e0b">THE BRIDGE TO MODULE M4:</text>
    <text x="25" y="48" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#e2e8f0">Nobody is paid to care about her — yet. Before moving forward into field operations, Module M4 tests the foundation:</text>
    <text x="25" y="68" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Rebuild the Chain Before Moving Forward (Mid-Flight Silent Retrieval Checkpoint)</text>
  </g>
</svg>
