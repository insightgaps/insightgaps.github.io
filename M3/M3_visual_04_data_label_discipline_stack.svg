<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#141f32"/>
    </linearGradient>
    <filter id="stackShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad4)"/>
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#23354d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Header Bar -->
  <rect x="40" y="35" width="880" height="48" rx="8" fill="#12263f"/>
  <text x="60" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">DATA-LABEL DISCIPLINE: A FILING IS NOT A REPOSSESSED HOUSE</text>
  <rect x="740" y="47" width="165" height="24" rx="12" fill="#ef4444"/>
  <text x="822" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">LABEL FIRST</text>

  <!-- Left: The 6-Tier Label Stack -->
  <g transform="translate(50, 105)" filter="url(#stackShadow)">
    <rect width="430" height="290" rx="10" fill="#152136" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="430" height="34" rx="10" fill="#1e3a8a"/>
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff">THE SIX DISTINCT DATA TIERS</text>
    <text x="410" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="end">DO NOT CONFLATE</text>

    <!-- Tier 1: Filings -->
    <g transform="translate(16, 45)">
      <rect width="398" height="36" rx="6" fill="#2d1215" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fca5a5">1. DEFAULT FILING:</text>
      <text x="130" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ffffff">Notice of default / Lis pendens (Peak ~2.9M in 2010)</text>
      <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Legal paper filed; not a physical eviction or repossession</text>
    </g>

    <!-- Tier 2: Starts -->
    <g transform="translate(16, 85)">
      <rect width="398" height="36" rx="6" fill="#2b1a06" stroke="#f59e0b" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fcd34d">2. FORECLOSURE START:</text>
      <text x="155" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ffffff">Formal case initiation (Peak 2,139,005 in 2009)</text>
      <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">"A start is not a finish" — many cure via loss mitigation</text>
    </g>

    <!-- Tier 3: Scheduled Auctions -->
    <g transform="translate(16, 125)">
      <rect width="398" height="36" rx="6" fill="#1b2a47" stroke="#3b82f6" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#93c5fd">3. SCHEDULED AUCTION:</text>
      <text x="155" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ffffff">Notice of trustee / sheriff sale date</text>
      <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Date set on courthouse steps; subject to cancellation or bankruptcy</text>
    </g>

    <!-- Tier 4: Repossessions -->
    <g transform="translate(16, 165)">
      <rect width="398" height="36" rx="6" fill="#1e1838" stroke="#8b5cf6" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#c4b5fd">4. COMPLETED REPOSSESSION:</text>
      <text x="185" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ffffff">Title reverts to lender (Peak 102,134/mo 2010)</text>
      <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Actual foreclosure completion; borrower title extinguished</text>
    </g>

    <!-- Tier 5: REO Inventory -->
    <g transform="translate(16, 205)">
      <rect width="398" height="36" rx="6" fill="#0f1f38" stroke="#38bdf8" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#7dd3fc">5. REO INVENTORY:</text>
      <text x="130" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ffffff">Bank-owned stock (Combined ~2.2M Dec 2010)</text>
      <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Fannie peak 166k; Freddie peak 74k (NEVER add together)</text>
    </g>

    <!-- Tier 6: Work Orders -->
    <g transform="translate(16, 245)">
      <rect width="398" height="36" rx="6" fill="#0c2e21" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#6ee7b7">6. PRESERVATION WORK ORDER:</text>
      <text x="185" y="18" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#ffffff">Operational job dispatched to crew</text>
      <text x="12" y="30" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Physical field service tickets; a single home may generate 20+ work orders</text>
    </g>
  </g>

  <!-- Right: ATTOM 2025 vs Historical Benchmark -->
  <g transform="translate(505, 105)" filter="url(#stackShadow)">
    <rect width="405" height="290" rx="10" fill="#152136" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="405" height="34" rx="10" fill="#1e2c42"/>
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fcd34d">THE DATA-LABEL DRILL</text>

    <g transform="translate(20, 50)">
      <!-- Box 1: Historical Peak -->
      <rect x="0" y="0" width="365" height="95" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#fca5a5">HISTORICAL PEAK (2010):</text>
      <text x="15" y="44" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#ffffff">~2.9 MILLION FILINGS</text>
      <text x="15" y="65" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        • Not 2.9M repossessions. Not 2.9M families evicted.<br>
        • Total filings across default notices, starts, and auctions.
      </text>

      <!-- Box 2: ATTOM 2025 -->
      <rect x="0" y="110" width="365" height="115" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#6ee7b7">CURRENT ATTOM DATA (2025):</text>
      <text x="15" y="44" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#ffffff">367,460 FILINGS</text>
      <text x="15" y="64" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">
        +14% vs 2024 &nbsp;|&nbsp; −87% vs 2010 Peak
      </text>
      <text x="15" y="85" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">
        • Headline says "Foreclosures surge 14%".<br>
        • Professional says: "Filings remain 87% below 2010 levels."
      </text>
    </g>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(50, 410)">
    <rect width="860" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#f59e0b">THE DATA-LABEL LAW:</text>
    <text x="25" y="52" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0">
      "Read the label before you trust the number. 
      <tspan font-weight="700" fill="#ffffff">A filing is not a finish. A start is not a sale. A repossession is not a work order.</tspan>"
    </text>
  </g>
</svg>
