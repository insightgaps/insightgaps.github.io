<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17"/>
      <stop offset="100%" stop-color="#141f32"/>
    </linearGradient>
    <filter id="stateShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad3)"/>
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#23354d" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Top Header Bar -->
  <rect x="40" y="35" width="880" height="48" rx="8" fill="#12263f"/>
  <text x="60" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">FORECLOSURE IS STATE LAW: JUDICIAL VS. NON-JUDICIAL TRACKS</text>
  <rect x="740" y="47" width="165" height="24" rx="12" fill="#f59e0b"/>
  <text x="822" y="63" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#090e17" text-anchor="middle">50 JURISDICTIONS</text>

  <!-- Two Tracks Side-by-Side -->
  <!-- Left Track: Judicial Foreclosure -->
  <g transform="translate(50, 110)" filter="url(#stateShadow)">
    <rect width="410" height="280" rx="10" fill="#152136" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="34" rx="10" fill="#1e3a8a"/>
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff">JUDICIAL FORECLOSURE (COURT TRACK)</text>
    <text x="390" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="end">500–1000+ DAYS</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#93c5fd">COMMON STATES:</text>
      <text x="120" y="0" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">NY, FL, NJ, IL, PA, OH (~20 States)</text>

      <line x1="0" y1="16" x2="370" y2="16" stroke="#253752" stroke-width="1"/>

      <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">1. Lawsuit Filed:</text>
      <text x="120" y="38" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Lis Pendens recorded against property</text>

      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">2. Court Hearing:</text>
      <text x="120" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Judge reviews pleadings, borrower answers</text>

      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">3. Judgment Entry:</text>
      <text x="120" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Court issues formal order and decree of sale</text>

      <text x="0" y="116" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">4. Sheriff's Sale:</text>
      <text x="120" y="116" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">County sheriff conducts public courthouse auction</text>

      <!-- Bottom Tag -->
      <rect x="0" y="150" width="370" height="58" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
      <text x="15" y="172" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#93c5fd">PRESERVATION IMPACT:</text>
      <text x="15" y="192" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">
        Properties sit in legal limbo for 2–3 years. Unoccupied homes suffer extensive long-term vacancy decay.
      </text>
    </g>
  </g>

  <!-- Right Track: Non-Judicial Foreclosure -->
  <g transform="translate(490, 110)" filter="url(#stateShadow)">
    <rect width="420" height="280" rx="10" fill="#152136" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="34" rx="10" fill="#b45309"/>
    <text x="20" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ffffff">NON-JUDICIAL FORECLOSURE (POWER OF SALE)</text>
    <text x="400" y="22" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="end">60–150 DAYS</text>

    <g transform="translate(20, 50)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">COMMON STATES:</text>
      <text x="120" y="0" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">TX, GA, CA, WA, AZ, NV (~30 States)</text>

      <line x1="0" y1="16" x2="380" y2="16" stroke="#253752" stroke-width="1"/>

      <text x="0" y="38" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">1. Deed of Trust:</text>
      <text x="120" y="38" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Contract grants trustee power to sell on default</text>

      <text x="0" y="64" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">2. Notice of Default:</text>
      <text x="120" y="64" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Recorded in county land records; 90d cure period</text>

      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">3. Notice of Sale:</text>
      <text x="120" y="90" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Published in local newspaper; auction date set</text>

      <text x="0" y="116" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">4. Trustee's Sale:</text>
      <text x="120" y="116" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Private trustee auctions deed; rapid title transfer</text>

      <!-- Bottom Tag -->
      <rect x="0" y="150" width="380" height="58" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
      <text x="15" y="172" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#fcd34d">PRESERVATION IMPACT:</text>
      <text x="15" y="192" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">
        Rapid timeline requires agile vendor response. Fast transition from pre-sale inspection to REO conveyance.
      </text>
    </g>
  </g>

  <!-- Bottom Core Principle Banner -->
  <g transform="translate(50, 410)">
    <rect width="860" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="800" fill="#f59e0b">THE JURISDICTIONAL DOCTRINE:</text>
    <text x="25" y="52" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#e2e8f0">
      "There is no single 'American foreclosure system'. There are 50 state jurisdictions. 
      <tspan font-weight="700" fill="#ffffff">Know the state line before you schedule the lock change.</tspan>"
    </text>
  </g>
</svg>
