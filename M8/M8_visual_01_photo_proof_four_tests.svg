<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="m8title m8desc">
  <title id="m8title">Four photo tests and the missing shot that fails the file</title>
  <desc id="m8desc">Four labelled lenses: place, time, scope and clarity. A fifth empty frame marked missing shot carries a red fail verdict. The missing shot is the verdict.</desc>
  <defs>
    <linearGradient id="m8bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#12263F"/>
    </linearGradient>
    <filter id="m8shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="m8hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7F1D1D" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#m8bg)"/>
  <rect x="20" y="20" width="920" height="500" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="36" y="34" width="888" height="50" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="54" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="900" fill="#F59E0B" letter-spacing="1.1">FOUR PHOTO TESTS — AND THE FIFTH FRAME THAT FAILS THE FILE</text>

  <!-- Four lenses -->
  <!-- PLACE -->
  <g transform="translate(36, 104)">
    <rect x="0" y="0" width="204" height="288" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="2" filter="url(#m8shadow)"/>
    <rect x="0" y="0" width="204" height="42" rx="8" fill="#0369A1"/>
    <text x="102" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">PLACE</text>
    <circle cx="102" cy="85" r="26" fill="#082F49" stroke="#38BDF8" stroke-width="2"/>
    <path d="M102 67 L114 89 H90 Z" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="102" cy="85" r="5" fill="#38BDF8"/>
    <text x="18" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#38BDF8">WHERE IS THIS HOUSE?</text>
    <text x="18" y="164" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• House number in frame</text>
    <text x="18" y="184" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Street or landmark context</text>
    <text x="18" y="204" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Same house as the order</text>
    <text x="18" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#F87171">Fails: front door of another house</text>
  </g>

  <!-- TIME -->
  <g transform="translate(256, 104)">
    <rect x="0" y="0" width="204" height="288" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2" filter="url(#m8shadow)"/>
    <rect x="0" y="0" width="204" height="42" rx="8" fill="#B45309"/>
    <text x="102" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">TIME</text>
    <circle cx="102" cy="85" r="26" fill="#451A03" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="102" cy="85" r="13" fill="none" stroke="#FBBF24" stroke-width="2.5"/>
    <path d="M102 78 V86 H109" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <text x="18" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FBBF24">WHEN WAS THIS TAKEN?</text>
    <text x="18" y="164" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Date stamp, if ordered</text>
    <text x="18" y="184" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Inside the order window</text>
    <text x="18" y="204" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Before, during, after in order</text>
    <text x="18" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#F87171">Fails: after shot stamped first</text>
  </g>

  <!-- SCOPE -->
  <g transform="translate(476, 104)">
    <rect x="0" y="0" width="204" height="288" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2" filter="url(#m8shadow)"/>
    <rect x="0" y="0" width="204" height="42" rx="8" fill="#047857"/>
    <text x="102" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">SCOPE</text>
    <circle cx="102" cy="85" r="26" fill="#022C22" stroke="#34D399" stroke-width="2"/>
    <path d="M88 85 L98 95 L117 74" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#34D399">IS ANYTHING MISSING?</text>
    <text x="18" y="164" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Every lock and opening</text>
    <text x="18" y="184" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Every room and fixture</text>
    <text x="18" y="204" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Full perimeter, no cropping</text>
    <text x="18" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#F87171">Fails: front cut, rear missed</text>
  </g>

  <!-- CLARITY -->
  <g transform="translate(696, 104)">
    <rect x="0" y="0" width="204" height="288" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" filter="url(#m8shadow)"/>
    <rect x="0" y="0" width="204" height="42" rx="8" fill="#6D28D9"/>
    <text x="102" y="27" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">CLARITY</text>
    <circle cx="102" cy="85" r="26" fill="#2E1065" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="102" cy="85" r="11" fill="none" stroke="#A78BFA" stroke-width="2.5"/>
    <path d="M110 93 L121 104" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
    <text x="18" y="140" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#A78BFA">CAN I SEE THE PROOF?</text>
    <text x="18" y="164" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Sharp, not blurred</text>
    <text x="18" y="184" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Gauge dials legible</text>
    <text x="18" y="204" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">• Light enough to judge</text>
    <text x="18" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#F87171">Fails: dark blur where the gauge is</text>
  </g>

  <!-- Missing frame -->
  <g transform="translate(36, 408)">
    <rect x="0" y="0" width="672" height="66" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="2"/>
    <rect x="8" y="8" width="96" height="50" rx="3" fill="url(#m8hatch)" stroke="#EF4444" stroke-width="1.5"/>
    <path d="M40 22 L72 54 M72 22 L40 54" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
    <text x="122" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="900" fill="#FCA5A5">THE MISSING SHOT</text>
    <text x="122" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#E2E8F0">A required frame missing cannot be argued back in.</text>
    <rect x="548" y="14" width="112" height="38" rx="4" fill="#B42318"/>
    <text x="604" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFDF8" text-anchor="middle" letter-spacing="0.8">VERDICT: FAIL</text>
  </g>

  <!-- Bottom rule -->
  <g transform="translate(720, 408)">
    <rect x="0" y="0" width="204" height="66" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="102" y="28" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#F8FAFC" text-anchor="middle">Done is a claim.</text>
    <text x="102" y="51" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#F59E0B" text-anchor="middle">Proof is the test.</text>
  </g>
</svg>
