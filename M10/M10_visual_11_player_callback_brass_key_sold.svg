<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="doorWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="porchLanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#12263F" stop-opacity="0"/>
    </radialGradient>
    <filter id="keyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: Cozy Evening Porch & Entry Hallway -->
  <rect width="960" height="540" fill="#0B1320"/>

  <!-- Left: The Painted Front Door of Maple House -->
  <g transform="translate(60, 40)">
    <!-- Door Frame Moulding -->
    <rect width="520" height="460" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <!-- Door Slab (Rich Navy Blue) -->
    <rect x="20" y="20" width="480" height="440" rx="2" fill="url(#doorWood)"/>

    <!-- Decorative Door Panels -->
    <!-- Top Left Panel -->
    <rect x="50" y="50" width="180" height="150" rx="3" fill="#12263F" stroke="#334155" stroke-width="2"/>
    <rect x="65" y="65" width="150" height="120" rx="2" fill="#0F172A"/>

    <!-- Top Right Panel (Sidelight / Warm Glow Window) -->
    <rect x="270" y="50" width="180" height="150" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <!-- Warm Porch Lantern Glow Behind Glass -->
    <circle cx="360" cy="125" r="70" fill="url(#porchLanternGlow)"/>
    <line x1="360" y1="50" x2="360" y2="200" stroke="#D97706" stroke-width="2"/>
    <line x1="270" y1="125" x2="450" y2="125" stroke="#D97706" stroke-width="2"/>

    <!-- Bottom Left Panel -->
    <rect x="50" y="240" width="180" height="190" rx="3" fill="#12263F" stroke="#334155" stroke-width="2"/>
    <rect x="65" y="255" width="150" height="160" rx="2" fill="#0F172A"/>

    <!-- Bottom Right Panel -->
    <rect x="270" y="240" width="180" height="190" rx="3" fill="#12263F" stroke="#334155" stroke-width="2"/>
    <rect x="285" y="255" width="150" height="160" rx="2" fill="#0F172A"/>

    <!-- Solid Polished Brass Deadbolt Lockset & Key Turning -->
    <g transform="translate(420, 215)" filter="url(#keyGlow)">
      <!-- Deadbolt Rosette Escutcheon -->
      <circle cx="45" cy="45" r="32" fill="url(#brassGrad)" stroke="#78350F" stroke-width="2"/>
      <circle cx="45" cy="45" r="22" fill="#D97706"/>
      <!-- Keyhole Cylinder -->
      <circle cx="45" cy="45" r="14" fill="#1E293B"/>

      <!-- The Brass Key Inserted & Rotated 45 Degrees -->
      <g transform="translate(45, 45) rotate(45)">
        <!-- Key Blade inside cylinder -->
        <rect x="-3" y="-3" width="6" height="24" fill="url(#brassGrad)"/>
        <!-- Key Bow (Head) Held in Hand -->
        <circle cx="0" cy="38" r="18" fill="url(#brassGrad)" stroke="#92400E" stroke-width="2"/>
        <circle cx="0" cy="38" r="7" fill="#1E293B"/>
        <!-- Key Stem Ridges -->
        <rect x="-4" y="10" width="8" height="12" fill="url(#brassGrad)"/>
      </g>

      <!-- Glow Ring from Key Turn -->
      <circle cx="45" cy="45" r="36" fill="none" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="45" y="100" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FDE68A" text-anchor="middle">NEW HOMEOWNER BRASS KEY</text>
    </g>

    <!-- Welcome Sign Ribbon -->
    <g transform="translate(100, 215)">
      <rect width="180" height="34" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="90" y="22" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFDF8" text-anchor="middle">WELCOME HOME</text>
    </g>
  </g>

  <!-- Right: The Conveyance Deed & Story Closure Plaque -->
  <g transform="translate(620, 50)">
    <!-- HUD Conveyance Document -->
    <rect width="300" height="200" rx="6" fill="#FFFDF8" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Document Header Banner -->
    <rect width="300" height="34" rx="6" fill="#0F766E"/>
    <text x="15" y="22" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8" letter-spacing="1">HUD HOMESTORE &bull; CONVEYANCE SUCCESS</text>

    <text x="15" y="55" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#12263F">Property:</text>
    <text x="75" y="55" font-family="'Segoe UI', sans-serif" font-size="10" fill="#334155">Maple House (Built 1972)</text>

    <text x="15" y="75" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#12263F">Conveyance:</text>
    <text x="95" y="75" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#166534">CLEAN (ZERO PENALTIES)</text>

    <text x="15" y="95" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#12263F">Disposition:</text>
    <text x="95" y="95" font-family="'Segoe UI', sans-serif" font-size="10" fill="#334155">Sold to First-Time Homebuyer</text>

    <line x1="15" y1="108" x2="285" y2="108" stroke="#E2E8F0"/>

    <text x="15" y="128" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#B45309">Why She Conveyed Clean:</text>
    <text x="15" y="144" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">&bull; Authority verified: No unlawful lockout</text>
    <text x="15" y="160" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">&bull; Plumbing repaired: No frozen floods</text>
    <text x="15" y="176" font-family="'Segoe UI', sans-serif" font-size="9" fill="#475569">&bull; Honest geometry: Reimbursed in full</text>

    <!-- Golden Eagle Seal -->
    <circle cx="255" cy="155" r="24" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
    <text x="255" y="159" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="900" fill="#92400E" text-anchor="middle">TITLE</text>
    <text x="255" y="168" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="800" fill="#92400E" text-anchor="middle">CLEAN</text>

    <!-- Narrative Plaque -->
    <g transform="translate(0, 220)">
      <rect width="300" height="195" rx="6" fill="#12263F" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">THE HOUSING LOOP RESTARTS</text>
      <text x="20" y="58" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#FFFDF8">"The house did not break.</text>
      <text x="20" y="74" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#FFFDF8">The economy loop restarted."</text>

      <text x="20" y="105" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#E2E8F0">Maple House was preserved by trainees</text>
      <text x="20" y="120" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#E2E8F0">who understood that good effort never</text>
      <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#E2E8F0">excuses missing proof. Tonight, the porch</text>
      <text x="20" y="150" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#E2E8F0">light turns on for a new generation.</text>

      <text x="20" y="180" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#38BDF8">You have the whole chain.</text>
    </g>
  </g>

  <!-- Advance Caption -->
  <text x="60" y="525" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">The Callback: The brass key turns in the deadbolt. Because you audited Kevin's file with discipline, Maple House survived foreclosure and became a home again.</text>
</svg>
