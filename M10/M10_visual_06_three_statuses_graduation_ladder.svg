<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="m10-bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="m10-shadow6" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#12263F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#m10-bg6)"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="none" stroke="#D6C8B2" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="880" height="48" rx="6" fill="#12263F"/>
  <text x="56" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" letter-spacing="1.5">THE THREE STATUSES &amp; THE COMPLETED CYCLE</text>
  <text x="550" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">[HONEST BOUNDARY &amp; GRADUATION ARCHITECTURE]</text>
  <rect x="800" y="52" width="106" height="24" rx="4" fill="#166534"/>
  <text x="853" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">COMPLETE</text>

  <!-- Subtitle -->
  <text x="40" y="114" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#12263F">Attendance is completed today. Demonstration is proven in the lab. Operational independence belongs to your employer.</text>

  <!-- Left: The Three Statuses Ladder -->
  <g transform="translate(40, 130)" filter="url(#m10-shadow6)">
    <rect width="460" height="345" rx="8" fill="#FFFDF8" stroke="#D6C8B2" stroke-width="1"/>
    <rect width="460" height="32" rx="8" fill="#1D3A5F"/>
    <text x="16" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">THE THREE DISTINCT STATUSES (NEVER BLENDED)</text>

    <!-- Rung 3: Operationally Authorised (Top - NOT granted by class alone) -->
    <g transform="translate(20, 48)">
      <rect width="420" height="78" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <rect x="12" y="12" width="28" height="28" rx="4" fill="#64748B"/>
      <text x="26" y="31" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFDF8" text-anchor="middle">3</text>
      <text x="50" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#1E293B">OPERATIONALLY AUTHORISED</text>
      <rect x="290" y="14" width="118" height="20" rx="3" fill="#E2E8F0"/>
      <text x="349" y="28" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#475569" text-anchor="middle">EMPLOYER DECISION</text>
      <text x="50" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#475569">NOT granted by attendance alone. Depends on employer onboarding,</text>
      <text x="50" y="60" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#475569">client-specific software portals, and supervised live field training.</text>
    </g>

    <!-- Upward arrow -->
    <path d="M 230 134 L 230 142" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Rung 2: Demonstrated in Class -->
    <g transform="translate(20, 145)">
      <rect width="420" height="78" rx="5" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
      <rect x="12" y="12" width="28" height="28" rx="4" fill="#2563EB"/>
      <text x="26" y="31" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFDF8" text-anchor="middle">2</text>
      <text x="50" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#1D4ED8">DEMONSTRATED IN CLASS</text>
      <rect x="290" y="14" width="118" height="20" rx="3" fill="#DBEAFE"/>
      <text x="349" y="28" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#1E40AF" text-anchor="middle">CAPSTONE RUBRIC</text>
      <text x="50" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#1E3A8A">Earned by detecting all 4 failure traps on the cold capstone case,</text>
      <text x="50" y="60" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#1E3A8A">passing the 4-point Update Line, and verifying physical geometry.</text>
    </g>

    <!-- Upward arrow -->
    <path d="M 230 231 L 230 239" stroke="#93C5FD" stroke-width="2"/>

    <!-- Rung 1: Attended -->
    <g transform="translate(20, 242)">
      <rect width="420" height="78" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <rect x="12" y="12" width="28" height="28" rx="4" fill="#166534"/>
      <text x="26" y="31" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#FFFDF8" text-anchor="middle">1</text>
      <text x="50" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#15803D">ATTENDED</text>
      <rect x="290" y="14" width="118" height="20" rx="3" fill="#DCFCE7"/>
      <text x="349" y="28" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#14532D" text-anchor="middle">COMPLETED CLASS</text>
      <text x="50" y="46" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#14532D">Earned today: Completed all 300 elapsed minutes (280 active + 20 breaks),</text>
      <text x="50" y="60" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#14532D">engaged all 10 interactive drills, and mapped the full 11-stop lifecycle.</text>
    </g>
  </g>

  <!-- Right: The Story Callback - Maple House Restored -->
  <g transform="translate(520, 130)" filter="url(#m10-shadow6)">
    <rect width="400" height="345" rx="8" fill="#FFFDF8" stroke="#D6C8B2" stroke-width="1"/>
    <rect width="400" height="32" rx="8" fill="#12263F"/>
    <text x="16" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">THE STORY CLOSES: MAPLE HOUSE SOLD</text>

    <!-- House Silhouette Art with glowing light -->
    <g transform="translate(50, 45)">
      <!-- Sky / Lawn background -->
      <rect x="0" y="0" width="300" height="150" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <rect x="0" y="115" width="300" height="35" rx="0" fill="#E2E8F0"/>

      <!-- House Outline -->
      <!-- Main body -->
      <polygon points="40,115 40,65 150,15 260,65 260,115" fill="#1D3A5F" stroke="#12263F" stroke-width="2"/>
      <!-- Chimney -->
      <rect x="70" y="25" width="22" height="30" fill="#12263F"/>

      <!-- Roof Gable Trim -->
      <polyline points="32,68 150,12 268,68" fill="none" stroke="#F59E0B" stroke-width="3"/>

      <!-- Front Door -->
      <rect x="135" y="75" width="30" height="40" fill="#FFFDF8" stroke="#12263F" stroke-width="1.5"/>
      <circle cx="140" cy="95" r="2" fill="#F59E0B"/>

      <!-- Windows (Warm glowing light inside!) -->
      <rect x="65" y="70" width="35" height="28" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
      <line x1="82.5" y1="70" x2="82.5" y2="98" stroke="#D97706" stroke-width="1"/>
      <line x1="65" y1="84" x2="100" y2="84" stroke="#D97706" stroke-width="1"/>

      <rect x="200" y="70" width="35" height="28" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
      <line x1="217.5" y1="70" x2="217.5" y2="98" stroke="#D97706" stroke-width="1"/>
      <line x1="200" y1="84" x2="235" y2="84" stroke="#D97706" stroke-width="1"/>

      <!-- Mowed Striped Lawn Lines -->
      <line x1="20" y1="125" x2="280" y2="125" stroke="#166534" stroke-width="2" stroke-dasharray="12 6"/>
      <line x1="10" y1="135" x2="290" y2="135" stroke="#166534" stroke-width="2" stroke-dasharray="14 8"/>

      <!-- Porch Light Glow -->
      <circle cx="150" cy="65" r="8" fill="#FBBF24" opacity="0.8"/>
      <circle cx="150" cy="65" r="16" fill="#FDE68A" opacity="0.3"/>
    </g>

    <!-- Narrative Callback Text -->
    <g transform="translate(20, 208)">
      <text x="0" y="16" font-family="Georgia, serif" font-size="12.5" font-weight="700" fill="#12263F">"The house did not break. The loop restarted."</text>
      <text x="0" y="34" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#344054">Maple House was preserved with honest pressure tests,</text>
      <text x="0" y="48" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#344054">verified cubic yard math, and clean lawful authority.</text>
      <text x="0" y="62" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#344054">Conveyed to the servicer without penalty, she was sold</text>
      <text x="0" y="76" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#344054">to a new family who turned on the porch light tonight.</text>

      <!-- Final Teacher Stated Line -->
      <rect x="0" y="90" width="360" height="34" rx="4" fill="#12263F"/>
      <text x="180" y="111" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#FFFDF8" text-anchor="middle">"No single role sees what you now see. You have the whole chain."</text>
    </g>
  </g>

  <!-- Footer Advance Caption -->
  <text x="40" y="512" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#667085">The journey ends where it began: fifty-four years of American housing history, one composite suburban home, and the professionals who protect the chain.</text>
</svg>
