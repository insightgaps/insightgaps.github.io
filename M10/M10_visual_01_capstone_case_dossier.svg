<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="m10-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="m10-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#12263F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#m10-bg)"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="none" stroke="#D6C8B2" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="880" height="48" rx="6" fill="#12263F"/>
  <text x="56" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#F59E0B" letter-spacing="1.2">THE COLD CAPSTONE: UNSEEN HOUSE DOSSIER</text>
  <text x="460" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">[TEACHING ILLUSTRATION — SYNTHETIC CASE]</text>
  <rect x="800" y="52" width="106" height="24" rx="4" fill="#B45309"/>
  <text x="853" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">MODULE 10</text>

  <!-- Subtitle -->
  <text x="40" y="114" font-family="Georgia, serif" font-size="16.5" font-weight="700" fill="#12263F">An unseen house, no warm-up: forty-two photos, three service lines. Find all four traps and defend the file line by line.</text>

  <!-- Manila Dossier Folder -->
  <g transform="translate(40, 130)" filter="url(#m10-shadow)">
    <!-- Folder Tab Backing -->
    <path d="M 0 30 L 140 30 L 165 0 L 320 0 L 345 30 L 880 30 L 880 355 L 0 355 Z" fill="#E8D7B8" stroke="#CBB48B" stroke-width="1.5"/>

    <!-- Tab Labels -->
    <text x="242" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#12263F" text-anchor="middle">WO-SYN-2026-8841: MAPLE HOUSE</text>

    <!-- Inner Document Sheet -->
    <rect x="20" y="45" width="840" height="295" rx="4" fill="#FFFDF8" stroke="#D6C8B2" stroke-width="1"/>

    <!-- Work Order Header Block -->
    <rect x="36" y="60" width="808" height="60" rx="4" fill="#1D3A5F"/>
    <text x="52" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">PROPERTY FILE:</text>
    <text x="160" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">Maple House (1972 Single-Family Frame, 1,240 SF)</text>
    <text x="560" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">LOAN PROGRAMME:</text>
    <text x="695" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFDF8">FHA / HUD Conveyance</text>

    <text x="52" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">ORDERED SCOPE:</text>
    <text x="160" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Initial Secure + Winterization (Dry) + Exterior Debris Cleanout</text>
    <text x="560" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">FILE STATUS:</text>
    <text x="645" y="105" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FCD34D">PENDING PROCESSOR QC</text>

    <!-- 3 Evidence Columns inside File -->
    <!-- Col 1: Scope & Field Claim -->
    <rect x="36" y="132" width="258" height="192" rx="4" fill="#F8F9FA" stroke="#E2E8F0"/>
    <rect x="36" y="132" width="258" height="26" rx="4" fill="#E2E8F0"/>
    <text x="46" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#12263F">1. FIELD CREW SUBMISSION</text>
    <text x="46" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1D3A5F">Technician:</text>
    <text x="115" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#344054">Kevin R. (Subcontract Crew)</text>
    <text x="46" y="190" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1D3A5F">Field Notes:</text>
    <text x="46" y="206" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#4B5563">"Arrived 4:15 PM in rain. Changed front deadbolt, winterized plumbing lines,</text>
    <text x="46" y="220" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#4B5563">loaded full truck of debris. Left site locked</text>
    <text x="46" y="234" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#4B5563">and secure at 6:40 PM."</text>
    <rect x="46" y="250" width="238" height="60" rx="3" fill="#FFFDF8" stroke="#CBD5E1"/>
    <text x="54" y="266" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#12263F">Photo Log Count:</text>
    <text x="150" y="266" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#0F766E">42 Photos Uploaded</text>
    <text x="54" y="284" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#12263F">Time Elapsed:</text>
    <text x="135" y="284" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" fill="#344054">2h 25m on site</text>
    <text x="54" y="302" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#12263F">Billed Total:</text>
    <text x="125" y="302" font-family="Georgia, serif" font-size="11" font-weight="800" fill="#B42318">$485.00 Total Bid</text>

    <!-- Col 2: The Audit Checklist -->
    <rect x="311" y="132" width="258" height="192" rx="4" fill="#F8F9FA" stroke="#E2E8F0"/>
    <rect x="311" y="132" width="258" height="26" rx="4" fill="#E2E8F0"/>
    <text x="321" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#12263F">2. PROCESSOR AUDIT CHECK</text>

    <text x="321" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">Authority / Occupancy Gate:</text>
    <rect x="321" y="180" width="238" height="24" rx="3" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="330" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B42318">? Check signals inside photo #08</text>

    <text x="321" y="220" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">Proof Coverage (P/T/S/C):</text>
    <rect x="321" y="228" width="238" height="24" rx="3" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="330" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B45309">? Missing entry point in photo set</text>

    <text x="321" y="268" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">Integrity &amp; Quantity Check:</text>
    <rect x="321" y="276" width="238" height="36" rx="3" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="330" y="291" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B42318">? Pressure gauge log vs task note</text>
    <text x="330" y="304" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#B42318">? 9 CY billed vs physical cubic tape</text>

    <!-- Col 3: Trainee Deliverable -->
    <rect x="586" y="132" width="258" height="192" rx="4" fill="#F8F9FA" stroke="#E2E8F0"/>
    <rect x="586" y="132" width="258" height="26" rx="4" fill="#E2E8F0"/>
    <text x="596" y="149" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#12263F">3. MANDATORY SUBMISSION</text>

    <circle cx="604" cy="174" r="9" fill="#12263F"/>
    <text x="604" y="178" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">1</text>
    <text x="620" y="177" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">File Verdict: HOLD / FIX / REJECT</text>

    <circle cx="604" cy="202" r="9" fill="#12263F"/>
    <text x="604" y="206" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">2</text>
    <text x="620" y="205" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">Catch All 4 Deliberate Traps</text>

    <circle cx="604" cy="230" r="9" fill="#12263F"/>
    <text x="604" y="234" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">3</text>
    <text x="620" y="233" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">Correct the Invoice Amounts</text>

    <circle cx="604" cy="258" r="9" fill="#12263F"/>
    <text x="604" y="262" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">4</text>
    <text x="620" y="261" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#12263F">Assign Owners to Every Action</text>

    <circle cx="604" cy="286" r="9" fill="#B45309"/>
    <text x="604" y="290" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">5</text>
    <text x="620" y="289" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#B45309">Author Update Line (≤ 25 wds)</text>

    <rect x="596" y="304" width="238" height="15" rx="2" fill="#E2E8F0"/>
    <text x="715" y="315" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">PASS STANDARD: 4/4 TRAPS + COMPLIANT LINE</text>
  </g>

  <!-- Footer Advance Caption -->
  <text x="40" y="512" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#667085">The synthetic capstone dossier brings Maple House to your desk: audit the proof, challenge the math, and protect the company from avoidable loss.</text>
</svg>
