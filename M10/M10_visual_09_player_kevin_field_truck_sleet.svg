<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="sleetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2430"/>
      <stop offset="100%" stop-color="#090D14"/>
    </linearGradient>
    <filter id="dashShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outside View: Sleet, Rain, and Maple House Silhouette at Dusk -->
  <rect width="960" height="540" fill="url(#sleetSky)"/>

  <!-- Rain / Sleet Streaks -->
  <g stroke="#94A3B8" stroke-width="1" opacity="0.35">
    <line x1="50" y1="20" x2="20" y2="120"/>
    <line x1="120" y1="40" x2="90" y2="140"/>
    <line x1="220" y1="10" x2="190" y2="110"/>
    <line x1="310" y1="50" x2="280" y2="150"/>
    <line x1="450" y1="15" x2="420" y2="115"/>
    <line x1="560" y1="35" x2="530" y2="135"/>
    <line x1="680" y1="10" x2="650" y2="110"/>
    <line x1="790" y1="45" x2="760" y2="145"/>
    <line x1="880" y1="20" x2="850" y2="120"/>
    <line x1="160" y1="120" x2="130" y2="220"/>
    <line x1="380" y1="110" x2="350" y2="210"/>
    <line x1="620" y1="130" x2="590" y2="230"/>
    <line x1="820" y1="115" x2="790" y2="215"/>
  </g>

  <!-- Darkened Exterior Silhouette of Maple House Through Rain -->
  <g transform="translate(180, 80)" opacity="0.65">
    <polygon points="120,60 220,15 320,60 320,160 120,160" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <rect x="150" y="25" width="25" height="35" fill="#0F172A"/>
    <!-- Unlit Windows -->
    <rect x="145" y="80" width="30" height="30" rx="2" fill="#1E293B"/>
    <rect x="265" y="80" width="30" height="30" rx="2" fill="#1E293B"/>
    <rect x="205" y="105" width="30" height="55" fill="#1E293B"/>
    <!-- Overgrown lawn silhouettes -->
    <path d="M 40 160 Q 60 145 80 160 Q 100 140 120 160 L 380 160 Q 400 145 420 160 Z" fill="#09101A"/>
  </g>

  <!-- Truck Windshield Frame & Wipers -->
  <path d="M 0 0 L 960 0 L 960 260 L 0 260 Z" fill="none" stroke="#1E293B" stroke-width="8"/>
  <!-- Wiper blade smeared arc -->
  <path d="M 150 240 Q 400 80 650 240" stroke="#334155" stroke-width="4" fill="none" opacity="0.4"/>

  <!-- Truck Dashboard (Foreground Interior) -->
  <g transform="translate(0, 240)" filter="url(#dashShadow)">
    <rect width="960" height="300" fill="url(#dashGrad)"/>
    <rect width="960" height="15" fill="#2A3444"/>

    <!-- Dashboard Instrument Gauges (Left) -->
    <g transform="translate(60, 45)">
      <circle cx="50" cy="50" r="42" fill="#0B1320" stroke="#38BDF8" stroke-width="2"/>
      <text x="50" y="45" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" fill="#F8FAFC" text-anchor="middle">38°F</text>
      <text x="50" y="62" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">FREEZING SLEET</text>

      <circle cx="160" cy="50" r="42" fill="#0B1320" stroke="#F59E0B" stroke-width="2"/>
      <text x="160" y="45" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#F8FAFC" text-anchor="middle">6:40 PM</text>
      <text x="160" y="62" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle">DUSK CHECKOUT</text>
    </g>

    <!-- Mounted Smartphone on Dash (Center-Left) -->
    <g transform="translate(320, 20)">
      <rect width="130" height="210" rx="14" fill="#0F172A" stroke="#475569" stroke-width="3"/>
      <!-- Screen content -->
      <rect x="8" y="16" width="114" height="178" rx="8" fill="#1E293B"/>
      <!-- App Header -->
      <rect x="8" y="16" width="114" height="28" fill="#0F766E"/>
      <text x="65" y="34" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#FFFDF8" text-anchor="middle">CREW PORTAL MOCK</text>

      <!-- Upload Circle -->
      <circle cx="65" cy="85" r="28" fill="#134E4A" stroke="#2DD4BF" stroke-width="2"/>
      <text x="65" y="88" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#2DD4BF" text-anchor="middle">42/42</text>
      <text x="65" y="100" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#CCFBF1" text-anchor="middle">PHOTOS</text>

      <!-- Status banner -->
      <rect x="16" y="125" width="98" height="22" rx="3" fill="#166534"/>
      <text x="65" y="140" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="900" fill="#DCFCE7" text-anchor="middle">✓ UPLOAD COMPLETE</text>

      <!-- Invoiced text -->
      <text x="65" y="165" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">Billed: $485.00</text>
      <text x="65" y="178" font-family="'Segoe UI', sans-serif" font-size="8" fill="#F59E0B" text-anchor="middle">Time: 2h 25m</text>
    </g>

    <!-- Muddy Work Order Clipboard on Dashboard (Right) -->
    <g transform="translate(500, 30) rotate(-4)">
      <rect width="380" height="190" rx="6" fill="#D6C8B2" stroke="#8C7A5B" stroke-width="2"/>
      <rect x="15" y="20" width="350" height="155" fill="#FFFDF8" stroke="#CBD5E1"/>

      <text x="30" y="44" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#12263F">SUBCONTRACT DISPATCH SHEET</text>
      <text x="30" y="62" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#475569">Tech: Kevin R. &bull; Order: WO-SYN-2026-8841</text>

      <line x1="30" y1="72" x2="350" y2="72" stroke="#E2E8F0"/>

      <text x="30" y="92" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#334155">"Freezing sleet the entire job. Changed locks,</text>
      <text x="30" y="108" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#334155">blew lines, hauled wet tree branches.</text>
      <text x="30" y="124" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#334155">Cleaned gutters too. Left locked. Need fast pay."</text>

      <rect x="30" y="136" width="320" height="26" rx="3" fill="#FEF2F2" stroke="#FCA5A5"/>
      <text x="40" y="153" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#B42318">FATAL GAP: Hard effort does not prove legal authority or honest CY math.</text>
    </g>
  </g>

  <!-- Footer Advance Caption -->
  <text x="40" y="525" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">The Field Reality: Kevin worked two and a half hours in freezing rain. But loan servicers do not reimburse shivering—they reimburse verified authority and proof.</text>
</svg>
