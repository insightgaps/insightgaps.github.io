<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="card-field-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="card-wire-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow-07" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="url(#bg-grad-07)"/>
  <rect x="20" y="20" width="920" height="500" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Banner -->
  <rect x="36" y="36" width="888" height="46" rx="6" fill="#12263F" stroke="#F59E0B" stroke-width="1"/>
  <text x="52" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="900" fill="#F59E0B" letter-spacing="1.5">FIELD SWEAT VS. OFFICE WIRE</text>
  <text x="310" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">[M9 TITLE ANCHOR — THE REALITY GAP]</text>
  <rect x="800" y="47" width="112" height="24" rx="4" fill="#B45309"/>
  <text x="856" y="63" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">THE $450 GAP</text>

  <!-- Left Card: Field Contractor Reality ($1,000 Billed) -->
  <g transform="translate(46, 102)" filter="url(#shadow-07)">
    <rect x="0" y="0" width="260" height="340" rx="8" fill="url(#card-field-grad)" stroke="#D97706" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="38" rx="8" fill="#B45309"/>
    <text x="16" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFDF8" letter-spacing="0.5">1. WHAT THE FIELD EARNED</text>
    
    <text x="16" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#78350F">Contractor Claim:</text>
    <text x="16" y="106" font-family="Georgia, serif" font-size="36" font-weight="900" fill="#B45309">$1,000</text>
    
    <line x1="16" y1="124" x2="244" y2="124" stroke="#FCD34D" stroke-width="1.5"/>

    <text x="16" y="146" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1E293B">Marcus's Sweat (Maple House):</text>
    <text x="16" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#451A03">• 9 hours in 90° summer heat</text>
    <text x="16" y="188" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#451A03">• Cleared jungle of overgrowth</text>
    <text x="16" y="208" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#451A03">• Replaced 2 exterior locksets</text>
    <text x="16" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#451A03">• Hauled heavy porch debris</text>

    <rect x="14" y="260" width="232" height="64" rx="5" fill="#FEF3C7" stroke="#F59E0B"/>
    <text x="22" y="280" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#92400E">FIELD ASSUMPTION:</text>
    <text x="22" y="296" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#78350F">"We broke our backs out there.</text>
    <text x="22" y="310" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#78350F">Submit the ticket and pay me."</text>
  </g>

  <!-- Center Bridge: The 4 Office Choke Points -->
  <g transform="translate(330, 102)">
    <!-- Central Gap Banner -->
    <rect x="0" y="0" width="300" height="68" rx="8" fill="#12263F" stroke="#EF4444" stroke-width="2" filter="url(#shadow-07)"/>
    <text x="150" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F87171" text-anchor="middle" letter-spacing="1">THE RECONCILIATION GAP</text>
    <text x="150" y="54" font-family="Georgia, serif" font-size="24" font-weight="900" fill="#FCA5A5" text-anchor="middle">-$450.00 BLEED</text>

    <!-- Four Pipeline Filters -->
    <g transform="translate(0, 84)">
      <!-- Filter 1 -->
      <rect x="0" y="0" width="300" height="52" rx="6" fill="#1E293B" stroke="#475569"/>
      <circle cx="20" cy="26" r="10" fill="#B42318"/>
      <text x="20" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">1</text>
      <text x="38" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC">Processor Allowability Gate</text>
      <text x="38" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">-$200 (Unallowable debris + unproven locks)</text>

      <!-- Filter 2 -->
      <rect x="0" y="60" width="300" height="52" rx="6" fill="#1E293B" stroke="#475569"/>
      <circle cx="20" cy="86" r="10" fill="#D97706"/>
      <text x="20" y="90" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">2</text>
      <text x="38" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC">Vendor Manager Bid Approval</text>
      <text x="38" y="98" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">-$100 (Unapproved over-allowable work)</text>

      <!-- Filter 3 -->
      <rect x="0" y="120" width="300" height="52" rx="6" fill="#1E293B" stroke="#475569"/>
      <circle cx="20" cy="146" r="10" fill="#166534"/>
      <text x="20" y="150" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">3</text>
      <text x="38" y="142" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC">Invoice Exactness Gate</text>
      <text x="38" y="158" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#86EFAC">$0 Variance (Matches approval to the cent)</text>

      <!-- Filter 4 -->
      <rect x="0" y="180" width="300" height="52" rx="6" fill="#1E293B" stroke="#475569"/>
      <circle cx="20" cy="206" r="10" fill="#B42318"/>
      <text x="20" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">4</text>
      <text x="38" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC">Client Manager Deductions</text>
      <text x="38" y="218" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">-$150 (Short-pay, expired appeal, adjustment)</text>
    </g>

    <!-- Flow Arrow linking left to right -->
    <path d="M -15 170 L -4 170" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 304 170 L 315 170" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- Right Card: Office Bank Wire Reality ($550 Cleared) -->
  <g transform="translate(654, 102)" filter="url(#shadow-07)">
    <rect x="0" y="0" width="260" height="340" rx="8" fill="url(#card-wire-grad)" stroke="#166534" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="38" rx="8" fill="#166534"/>
    <text x="16" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFDF8" letter-spacing="0.5">2. WHAT THE BANK WIRED</text>
    
    <text x="16" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532D">Cleared Remittance:</text>
    <text x="16" y="106" font-family="Georgia, serif" font-size="36" font-weight="900" fill="#166534">$550</text>
    
    <line x1="16" y1="124" x2="244" y2="124" stroke="#86EFAC" stroke-width="1.5"/>

    <text x="16" y="146" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1E293B">Elena's Office Evidence:</text>
    <text x="16" y="168" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#14532D">• Before/after lawn wide shots ✓</text>
    <text x="16" y="188" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#14532D">• 6 CY debris math tape photo ✓</text>
    <text x="16" y="208" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#14532D">• Written portal allowables ✓</text>
    <text x="16" y="228" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="#14532D">• Address chain verified ✓</text>

    <rect x="14" y="260" width="232" height="64" rx="5" fill="#DCFCE7" stroke="#22C55E"/>
    <text x="22" y="280" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#14532D">OFFICE REALITY:</text>
    <text x="22" y="296" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#166534">"The bank pays for what survives</text>
    <text x="22" y="310" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#166534">the proof test, not for the sweat."</text>
  </g>

  <!-- Bottom Caption -->
  <rect x="36" y="468" width="888" height="32" rx="4" fill="#12263F" stroke="#334155"/>
  <text x="480" y="489" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">THE CORE TRUTH: The field earns the bid. The office earns the payment. The gap has a name and an owner.</text>
</svg>