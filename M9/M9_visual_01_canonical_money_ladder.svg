<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="m9-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <filter id="m9-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#12263F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#m9-bg)"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="none" stroke="#D6C8B2" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="880" height="48" rx="6" fill="#12263F"/>
  <text x="56" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" letter-spacing="1.5">CANONICAL MONEY LADDER</text>
  <text x="320" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">[TEACHING ILLUSTRATION — SYNTHETIC STANDARD]</text>
  <rect x="800" y="52" width="106" height="24" rx="4" fill="#B45309"/>
  <text x="853" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">FROM BID ONLY</text>

  <!-- Subtitle -->
  <text x="40" y="112" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12263F">Marcus billed $1,000 in sweat. The bank wired $550. Every drop has an owner.</text>

  <!-- Ladder Rungs & Steps Container -->
  <!-- Rung 1: BID $1,000 -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="150" height="58" rx="6" fill="#12263F" filter="url(#m9-shadow)"/>
    <text x="16" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">1. BID</text>
    <text x="16" y="46" font-family="Georgia, serif" font-size="20" font-weight="800" fill="#FFFDF8">$1,000</text>
    <text x="82" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Gross Proposal</text>
  </g>

  <!-- Leak 1: BID -> ALLOWABLE -->
  <g transform="translate(210, 150)">
    <path d="M 10 10 L 45 10 L 45 60 L 55 60" fill="none" stroke="#B42318" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="55,56 63,60 55,64" fill="#B42318"/>
    <!-- Leak Badge -->
    <rect x="68" y="38" width="140" height="46" rx="5" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2"/>
    <text x="76" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#B42318">-$200 BLEED</text>
    <text x="76" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#7F1D1D">$120 unallowable + $80 unproven</text>
    <text x="76" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#12263F">OWNER: PROCESSOR</text>
  </g>

  <!-- Rung 2: ALLOWABLE $800 -->
  <g transform="translate(230, 220)">
    <rect x="0" y="0" width="150" height="58" rx="6" fill="#1D3A5F" filter="url(#m9-shadow)"/>
    <text x="16" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">2. ALLOWABLE</text>
    <text x="16" y="46" font-family="Georgia, serif" font-size="20" font-weight="800" fill="#FFFDF8">$800</text>
    <text x="76" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Schedule Cap</text>
  </g>

  <!-- Leak 2: ALLOWABLE -> APPROVED -->
  <g transform="translate(380, 240)">
    <path d="M 10 10 L 45 10 L 45 60 L 55 60" fill="none" stroke="#B42318" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="55,56 63,60 55,64" fill="#B42318"/>
    <!-- Leak Badge -->
    <rect x="68" y="38" width="140" height="46" rx="5" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2"/>
    <text x="76" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#B42318">-$100 BLEED</text>
    <text x="76" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#7F1D1D">Over-allowable started w/o written approval</text>
    <text x="76" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#12263F">OWNER: VENDOR MANAGER</text>
  </g>

  <!-- Rung 3: APPROVED $700 -->
  <g transform="translate(400, 310)">
    <rect x="0" y="0" width="150" height="58" rx="6" fill="#0F766E" filter="url(#m9-shadow)"/>
    <text x="16" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" letter-spacing="1">3. APPROVED</text>
    <text x="16" y="46" font-family="Georgia, serif" font-size="20" font-weight="800" fill="#FFFDF8">$700</text>
    <text x="76" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CCFBF1">Written Consent</text>
  </g>

  <!-- Leak 3: APPROVED -> INVOICED ($0 Variance) -->
  <g transform="translate(550, 330)">
    <path d="M 10 10 L 45 10 L 45 35 L 55 35" fill="none" stroke="#166534" stroke-width="2.5"/>
    <polygon points="55,31 63,35 55,39" fill="#166534"/>
    <!-- Leak Badge: Exact match -->
    <rect x="68" y="15" width="140" height="44" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="76" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#166534">$0 VARIANCE</text>
    <text x="76" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#14532D">Built exactly to approval</text>
    <text x="76" y="55" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="800" fill="#12263F">OWNER: PROCESSOR</text>
  </g>

  <!-- Rung 4: INVOICED $700 -->
  <g transform="translate(570, 385)">
    <rect x="0" y="0" width="150" height="58" rx="6" fill="#12263F" filter="url(#m9-shadow)"/>
    <text x="16" y="24" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1">4. INVOICED</text>
    <text x="16" y="46" font-family="Georgia, serif" font-size="20" font-weight="800" fill="#FFFDF8">$700</text>
    <text x="76" y="45" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Billed to Client</text>
  </g>

  <!-- Leak 4: INVOICED -> PAID -->
  <g transform="translate(720, 400)">
    <path d="M 10 10 L 35 10 L 35 55 L 45 55" fill="none" stroke="#B42318" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="45,51 53,55 45,59" fill="#B42318"/>
    <!-- Leak Badge -->
    <rect x="58" y="32" width="146" height="50" rx="5" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2"/>
    <text x="66" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#B42318">-$150 DEDUCTION</text>
    <text x="66" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#7F1D1D">$60 rej past appeal + $50 short-pay + $40 adj</text>
    <text x="66" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#12263F">OWNER: CLIENT MGR + PROC</text>
  </g>

  <!-- Rung 5: PAID $550 -->
  <g transform="translate(740, 455)">
    <rect x="0" y="0" width="165" height="54" rx="6" fill="#166534" filter="url(#m9-shadow)"/>
    <text x="14" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#86EFAC" letter-spacing="1">5. PAID IN BANK</text>
    <text x="14" y="44" font-family="Georgia, serif" font-size="22" font-weight="800" fill="#FFFDF8">$550</text>
    <text x="80" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#DCFCE7">55% Realized</text>
  </g>

  <!-- Bottom Caption / Story Anchor -->
  <rect x="40" y="485" width="670" height="24" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="50" y="501" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">CORE RULE: Never start from CLAIMED. Ladder begins with BID. The field earns the bid; the office earns the cash.</text>
</svg>