<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="chain-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F3EFE7"/>
    </linearGradient>
    <filter id="chain-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#12263F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#chain-bg)"/>
  <rect x="24" y="24" width="912" height="492" rx="12" fill="none" stroke="#D6C8B2" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="40" y="40" width="880" height="48" rx="6" fill="#12263F"/>
  <text x="56" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#F59E0B" letter-spacing="1.5">CHAIN DETECTIVE: ADDRESS MATCHING PROTOCOL</text>
  <text x="500" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">[DECISION LAB 6 — SYNTHETIC CASE]</text>
  <rect x="800" y="52" width="106" height="24" rx="4" fill="#0F766E"/>
  <text x="853" y="68" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">CHAIN-PAID</text>

  <!-- Top Banner: The Rule -->
  <rect x="40" y="102" width="880" height="46" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="60" y="131" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#166534">GOLDEN AUDIT RULE: Never call an order unpaid until you have searched the physical street address history.</text>

  <!-- Comparison: OFFICE-WO-CH10-A (Left) vs OFFICE-WO-CH10-B (Right) linked by Address Anchor -->
  <!-- Middle Address Anchor Pin -->
  <g transform="translate(480, 165)">
    <circle cx="0" cy="40" r="34" fill="#12263F" filter="url(#chain-shadow)"/>
    <text x="0" y="34" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="0.5">PROPERTY KEY</text>
    <text x="0" y="50" font-family="Georgia, serif" font-size="13" font-weight="800" fill="#FFFDF8" text-anchor="middle">742 Evergreen</text>

    <!-- Connecting link arrows -->
    <path d="M -34 40 L -90 40" stroke="#0F766E" stroke-width="3" stroke-dasharray="4 2"/>
    <path d="M 34 40 L 90 40" stroke="#0F766E" stroke-width="3" stroke-dasharray="4 2"/>
  </g>

  <!-- Left: Work Order OFFICE-WO-CH10-A -->
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="340" height="295" rx="8" fill="#FFFDF8" stroke="#DC2626" stroke-width="1.8" filter="url(#chain-shadow)"/>
    <rect x="0" y="0" width="340" height="34" rx="8" fill="#991B1B"/>
    <text x="14" y="23" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFDF8">TICKET: OFFICE-WO-CH10-ORIG (INITIAL SECURE)</text>
    
    <text x="16" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">Target Address:</text>
    <text x="110" y="60" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#12263F">742 Evergreen Street</text>
    
    <text x="16" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">Billed Amount:</text>
    <text x="110" y="85" font-family="Georgia, serif" font-size="13" font-weight="800" fill="#12263F">$420.00</text>

    <text x="16" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">Client Remittance:</text>
    <text x="130" y="110" font-family="Georgia, serif" font-size="16" font-weight="800" fill="#DC2626">$0.00 PAID</text>

    <line x1="16" y1="130" x2="324" y2="130" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="16" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#B91C1C">THE ROOKIE MISTAKE:</text>
    <text x="16" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">"Client stiffed us! Mark $420 as Bad Debt write-off or flag account as delinquent."</text>
    
    <rect x="16" y="215" width="308" height="60" rx="5" fill="#FEF2F2" stroke="#F87171"/>
    <text x="26" y="235" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#991B1B">FATAL CONSEQUENCE:</text>
    <text x="26" y="252" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#7F1D1D">Company writes off real revenue. Double-billing risk if re-invoiced blind.</text>
  </g>

  <!-- Right: Work Order OFFICE-WO-CH10-B (The Discovery) -->
  <g transform="translate(580, 165)">
    <rect x="0" y="0" width="340" height="295" rx="8" fill="#FFFDF8" stroke="#166534" stroke-width="1.8" filter="url(#chain-shadow)"/>
    <rect x="0" y="0" width="340" height="34" rx="8" fill="#166534"/>
    <text x="14" y="23" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFDF8">TICKET: OFFICE-WO-CH10-SUPP (SUPPLEMENTAL)</text>
    
    <text x="16" y="60" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">Target Address:</text>
    <text x="110" y="60" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#12263F">742 Evergreen Street</text>
    
    <text x="16" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">Client Line Item:</text>
    <text x="115" y="85" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#12263F">"Pre-Approved Re-Securing"</text>

    <text x="16" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">Client Remittance:</text>
    <text x="130" y="110" font-family="Georgia, serif" font-size="16" font-weight="800" fill="#166534">$420.00 PAID</text>

    <line x1="16" y1="130" x2="324" y2="130" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="16" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#15803D">THE FORENSIC SOLUTION:</text>
    <text x="16" y="172" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">Elena matched by street address, discovered client re-cut the work order under OFFICE-WO-CH10-B, and linked the payment.</text>
    
    <rect x="16" y="215" width="308" height="60" rx="5" fill="#F0FDF4" stroke="#86EFAC"/>
    <text x="26" y="235" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#166534">CORRECT ACTION:</text>
    <text x="26" y="252" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#14532D">Mark OFFICE-WO-CH10-A as CHAIN-PAID with link to OFFICE-WO-CH10-B. Zero bad debt write-off. Ledger balances clean.</text>
  </g>

  <!-- Footer Caption -->
  <rect x="40" y="482" width="880" height="26" rx="4" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="56" y="499" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">STORY LESSON: The client did not steal $420; their automated software re-coded the order. Address matching saved the day.</text>
</svg>