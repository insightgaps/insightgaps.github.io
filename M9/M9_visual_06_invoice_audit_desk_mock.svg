<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="mock-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="desk-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Screen Simulation -->
  <rect width="960" height="540" fill="url(#mock-bg)"/>
  <rect x="20" y="20" width="920" height="500" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2" filter="url(#desk-shadow)"/>

  <!-- OS Window Title Bar -->
  <rect x="20" y="20" width="920" height="38" rx="10" fill="#12263F"/>
  <circle cx="42" cy="39" r="6" fill="#EF4444"/>
  <circle cx="60" cy="39" r="6" fill="#F59E0B"/>
  <circle cx="78" cy="39" r="6" fill="#10B981"/>
  <text x="105" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">MOCK PRESERVATION WORKBENCH — INVOICE QC AUDIT #WO-88219</text>
  <rect x="800" y="28" width="125" height="22" rx="4" fill="#B45309"/>
  <text x="862" y="43" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">MOCK SCREEN</text>

  <!-- Context Header Strip -->
  <rect x="36" y="68" width="888" height="42" rx="6" fill="#EEF2F6" stroke="#CBD5E1"/>
  <text x="50" y="93" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#12263F">PROPERTY: 742 EVERGREEN ST</text>
  <text x="280" y="93" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">CLIENT CODE: NAT-MORTGAGE-04</text>
  <text x="550" y="93" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">AUDITOR: ELENA (PROCESSOR DESK)</text>
  <rect x="795" y="76" width="115" height="26" rx="4" fill="#FEF2F2" stroke="#F87171"/>
  <text x="852" y="93" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#B91C1C" text-anchor="middle">HOLD AT RUNG 2</text>

  <!-- The Invoice Line Items Table -->
  <g transform="translate(36, 120)">
    <!-- Table Header -->
    <rect x="0" y="0" width="888" height="30" fill="#1D3A5F"/>
    <text x="15" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8">LINE ITEM</text>
    <text x="210" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8">CREW CLAIM</text>
    <text x="340" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8">QC EVIDENCE AUDIT</text>
    <text x="610" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8">OPERATIONAL VERDICT</text>
    <text x="810" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8">FINAL ADJ</text>

    <!-- Row 1: Grass Cut -->
    <rect x="0" y="32" width="888" height="60" fill="#F0FDF4" stroke="#DCFCE7"/>
    <text x="15" y="56" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#14532D">1. Grass Cut (Initial)</text>
    <text x="15" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">Full perimeter mowing</text>
    <text x="210" y="60" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#14532D">$60.00</text>
    <text x="340" y="56" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D">✓ Before, During, After Wide &amp; Edges PASS</text>
    <text x="340" y="74" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#475569">Date stamps match order window perfectly.</text>
    <rect x="610" y="46" width="130" height="28" rx="4" fill="#166534"/>
    <text x="675" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">PASS &amp; BILL</text>
    <text x="820" y="65" font-family="Georgia, serif" font-size="15" font-weight="800" fill="#15803D">$60.00</text>

    <!-- Row 2: Initial Secure -->
    <rect x="0" y="94" width="888" height="64" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="15" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400E">2. Initial Secure</text>
    <text x="15" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#78350F">Knob &amp; deadbolt change</text>
    <text x="210" y="122" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#92400E">$150.00</text>
    <text x="340" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#B45309">⚠️ DEFECT: Missing Back Door Lock Photo</text>
    <text x="340" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#78350F">Front door verified; rear lock photo completely absent.</text>
    <rect x="610" y="110" width="165" height="28" rx="4" fill="#B45309"/>
    <text x="692" y="129" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFDF8" text-anchor="middle">HOLD / RE-TRIP FIELD</text>
    <text x="815" y="129" font-family="Georgia, serif" font-size="13" font-weight="800" fill="#B45309">HOLD ($0)</text>

    <!-- Row 3: Debris Removal -->
    <rect x="0" y="160" width="888" height="64" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="15" y="184" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#991B1B">3. Debris Haul (Yard)</text>
    <text x="15" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#7F1D1D">Claimed 10 CY @ $15</text>
    <text x="210" y="188" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#DC2626" text-decoration="line-through">$150.00</text>
    <text x="340" y="184" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#DC2626">❌ MATH DISCREPANCY: 9×6×3 = 6 CY</text>
    <text x="340" y="202" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#7F1D1D">162 cu ft ÷ 27 = 6 CY verified. 10 CY rejected.</text>
    <rect x="610" y="176" width="165" height="28" rx="4" fill="#0F766E"/>
    <text x="692" y="195" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFDF8" text-anchor="middle">CORRECT TO 6 CY</text>
    <text x="820" y="195" font-family="Georgia, serif" font-size="15" font-weight="800" fill="#0F766E">$90.00</text>

    <!-- Row 4: Personal Property (TV) -->
    <rect x="0" y="226" width="888" height="60" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="15" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#334155">4. TV Removal (Porch)</text>
    <text x="15" y="268" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Electronics removal</text>
    <text x="210" y="254" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#64748B" text-decoration="line-through">$40.00</text>
    <text x="340" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569">❌ UNALLOWABLE SCOPE: No TV on Order</text>
    <text x="340" y="268" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748B">Order authorized raw yard debris only. Personal property excluded.</text>
    <rect x="610" y="242" width="130" height="28" rx="4" fill="#475569"/>
    <text x="675" y="261" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFDF8" text-anchor="middle">STRIKE LINE</text>
    <text x="825" y="261" font-family="Georgia, serif" font-size="15" font-weight="800" fill="#64748B">$0.00</text>
  </g>

  <!-- Summary Footer Strip -->
  <g transform="translate(36, 420)">
    <rect x="0" y="0" width="888" height="52" rx="6" fill="#12263F"/>
    <text x="20" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">ORIGINAL CLAIM: <tspan font-family="Georgia, serif" font-size="16" font-weight="800" fill="#F87171">$400.00</tspan></text>
    <text x="240" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">CLEAN APPROVED BILL: <tspan font-family="Georgia, serif" font-size="18" font-weight="800" fill="#4ADE80">$150.00</tspan> ($60 Grass + $90 Debris)</text>
    <text x="610" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">HELD / STRUCK: <tspan font-family="Georgia, serif" font-size="16" font-weight="800" fill="#FBBF24">$250.00</tspan> ($150 Held + $100 Struck)</text>
  </g>

  <!-- Bottom Caption -->
  <rect x="36" y="482" width="888" height="26" rx="4" fill="#EEF2F6" stroke="#CBD5E1"/>
  <text x="48" y="499" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">MOCK DISCIPLINE: Elena fixes this at the Allowable rung. If this reached the client portal uncorrected, the vendor would suffer fines.</text>
</svg>