<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="deckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="40%" stop-color="#12263f" />
      <stop offset="100%" stop-color="#09101d" />
    </linearGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="hubGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14b8a6" />
    </marker>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1200" height="680" fill="url(#deckBg)" rx="16" />
  <rect x="18" y="18" width="1164" height="644" fill="none" stroke="#d6c8b2" stroke-opacity="0.18" stroke-width="1.5" rx="12" />

  <!-- Slide Title / Projection Kicker -->
  <g transform="translate(60, 48)">
    <text x="0" y="0" fill="#f59e0b" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2.5">PROJECTION SPEC D-04 &bull; CLASSROOM ANCHOR</text>
    <text x="0" y="34" fill="#ffffff" font-family="Georgia, serif" font-size="28" font-weight="700">The 1,200-Mile Custodial Handoff</text>
    <text x="0" y="60" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="14">
      Solid line shows the physical chain; dotted lines show alternate investor/client routes.
    </text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(930, 40)">
    <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#f59e0b" />
    <text x="36" y="22" fill="#fffdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1">D-04 PROJECTION</text>
  </g>

  <!-- ==================== THE NETWORK SCENERY ==================== -->

  <!-- PATHWAY 1: Dotted Alternate Route (FHA / HUD Title II) -->
  <path d="M 230 220 C 350 140, 500 130, 680 180" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,6" marker-end="url(#goldArrow)" />
  <rect x="370" y="125" width="220" height="24" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="480" y="141" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">FHA / HUD Route (ML 2016-02)</text>

  <!-- PATHWAY 2: Solid Primary Chain (Bank -> Servicer -> National) -->
  <path d="M 230 280 L 360 280" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)" />
  <path d="M 540 280 L 680 280" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#goldArrow)" />

  <!-- PATHWAY 3: Dotted Alternate Route (GSE Fannie / Freddie / Private) -->
  <path d="M 230 340 C 350 410, 500 415, 680 370" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,6" marker-end="url(#goldArrow)" />
  <rect x="365" y="410" width="240" height="24" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="485" y="426" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">GSE / Fannie Mae Route (SVC-2025-03)</text>

  <!-- PATHWAY 4: National -> Our Office (Quality Checkpoint) -->
  <path d="M 770 340 C 770 430, 650 490, 540 490" fill="none" stroke="#14b8a6" stroke-width="3.5" marker-end="url(#tealArrow)" />

  <!-- PATHWAY 5: Our Office -> Field Crew at Maple House -->
  <path d="M 540 520 C 680 520, 800 520, 910 520" fill="none" stroke="#14b8a6" stroke-width="4" marker-end="url(#tealArrow)" />

  <!-- ==================== NODE 1: BANK / INVESTOR (DALLAS) ==================== -->
  <g transform="translate(60, 190)" filter="url(#cardShadow)">
    <rect width="170" height="180" rx="10" fill="url(#hubGlow)" stroke="#475569" stroke-width="1.5" />
    <rect width="170" height="34" rx="10" fill="#1e293b" />
    <rect y="24" width="170" height="10" fill="#1e293b" />
    <text x="14" y="22" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">LINK 1 &bull; CAPITAL</text>
    
    <!-- Skyscraper / Vault Icon -->
    <g transform="translate(25, 48)">
      <rect x="0" y="15" width="30" height="55" fill="#334155" rx="2" />
      <rect x="35" y="0" width="40" height="70" fill="#475569" rx="2" />
      <rect x="80" y="25" width="25" height="45" fill="#334155" rx="2" />
      <!-- Windows -->
      <line x1="42" y1="10" x2="68" y2="10" stroke="#fef08a" stroke-width="2" />
      <line x1="42" y1="20" x2="68" y2="20" stroke="#fef08a" stroke-width="2" />
      <line x1="42" y1="30" x2="68" y2="30" stroke="#fef08a" stroke-width="2" />
    </g>

    <text x="14" y="140" fill="#ffffff" font-family="Georgia, serif" font-size="15" font-weight="700">Bank / Lender</text>
    <text x="14" y="158" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Dallas / Charlotte</text>
    <text x="14" y="172" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Holds Mortgage Risk</text>
  </g>

  <!-- ==================== NODE 2: MORTGAGE SERVICER ==================== -->
  <g transform="translate(360, 200)" filter="url(#cardShadow)">
    <rect width="180" height="160" rx="10" fill="url(#hubGlow)" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="180" height="34" rx="10" fill="#1e293b" />
    <rect y="24" width="180" height="10" fill="#1e293b" />
    <text x="14" y="22" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">LINK 2 &bull; SERVICER</text>

    <!-- Server / Ledger Icon -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="60" height="16" rx="3" fill="#334155" stroke="#64748b" />
      <circle cx="10" cy="8" r="3" fill="#10b981" />
      <rect x="0" y="20" width="60" height="16" rx="3" fill="#334155" stroke="#64748b" />
      <circle cx="10" cy="28" r="3" fill="#10b981" />
      <rect x="0" y="40" width="60" height="16" rx="3" fill="#334155" stroke="#64748b" />
      <circle cx="10" cy="48" r="3" fill="#f59e0b" />
    </g>

    <text x="14" y="125" fill="#ffffff" font-family="Georgia, serif" font-size="15" font-weight="700">Loan Servicer</text>
    <text x="14" y="142" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">CFPB 120-Day Default Floor</text>
    <text x="14" y="156" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Duty runs pre-REO</text>
  </g>

  <!-- ==================== NODE 3: NATIONAL FSM ==================== -->
  <g transform="translate(680, 200)" filter="url(#cardShadow)">
    <rect width="180" height="160" rx="10" fill="url(#hubGlow)" stroke="#475569" stroke-width="1.5" />
    <rect width="180" height="34" rx="10" fill="#1e293b" />
    <rect y="24" width="180" height="10" fill="#1e293b" />
    <text x="14" y="22" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">LINK 3 &bull; NATIONAL</text>

    <!-- Satellite / 50-State Dispatch Icon -->
    <g transform="translate(65, 48)">
      <circle cx="25" cy="25" r="22" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3" />
      <circle cx="25" cy="25" r="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
      <circle cx="25" cy="25" r="4" fill="#f59e0b" />
    </g>

    <text x="14" y="125" fill="#ffffff" font-family="Georgia, serif" font-size="15" font-weight="700">National FSM</text>
    <text x="14" y="142" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">50 States &bull; 3,143 Counties</text>
    <text x="14" y="156" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">Dispatches Work Orders</text>
  </g>

  <!-- ==================== NODE 4: OUR OFFICE (LINK 4 - THE QUALITY HUB) ==================== -->
  <g transform="translate(320, 430)" filter="url(#cardShadow)">
    <rect width="220" height="175" rx="12" fill="#fffdf8" stroke="#14b8a6" stroke-width="2.5" />
    <rect width="220" height="36" rx="12" fill="#0f766e" />
    <rect y="26" width="220" height="10" fill="#0f766e" />
    <text x="14" y="24" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">LINK 4 &bull; OUR OFFICE (YOU)</text>

    <!-- Checkpoint / Shield Icon -->
    <g transform="translate(20, 48)">
      <circle cx="20" cy="20" r="16" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" />
      <path d="M 12 20 L 18 26 L 28 14" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <text x="65" y="62" fill="#0f766e" font-family="Georgia, serif" font-size="16" font-weight="700">Quality Checkpoint</text>
    <text x="65" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">Intake &bull; Gate &bull; QC &bull; Invoice</text>

    <line x1="16" y1="92" x2="204" y2="92" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="16" y="110" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">&bull; Engine: Internal PPW</text>
    <text x="16" y="128" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">&bull; Gate: Legal &amp; Occupancy Check</text>
    <text x="16" y="146" fill="#b42318" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">&bull; Owner Marks RFO Personally</text>
    <rect x="14" y="152" width="192" height="18" rx="3" fill="#ecfdf5" />
    <text x="20" y="165" fill="#065f46" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Passes Clean File to Client Portal</text>
  </g>

  <!-- ==================== NODE 5: FIELD CREW & MAPLE HOUSE ==================== -->
  <g transform="translate(910, 430)" filter="url(#cardShadow)">
    <rect width="230" height="175" rx="12" fill="#fffdf8" stroke="#f59e0b" stroke-width="2" />
    <rect width="230" height="36" rx="12" fill="#12263f" />
    <rect y="26" width="230" height="10" fill="#12263f" />
    <text x="14" y="24" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800">LINK 5 &bull; HANDS ON PORCH</text>

    <!-- House & Truck Icon -->
    <g transform="translate(20, 48)">
      <!-- Mini House -->
      <polygon points="18,5 36,20 0,20" fill="#b45309" />
      <rect x="4" y="20" width="28" height="22" fill="#cbd5e1" stroke="#334155" />
      <rect x="14" y="28" width="8" height="14" fill="#b45309" />
      <!-- Mobile Phone / Proof Camera -->
      <rect x="42" y="12" width="16" height="30" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="50" cy="38" r="1.5" fill="#10b981" />
    </g>

    <text x="85" y="62" fill="#12263f" font-family="Georgia, serif" font-size="16" font-weight="700">Maple House</text>
    <text x="85" y="78" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="11">Oak Street Porch</text>

    <line x1="16" y1="92" x2="214" y2="92" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="16" y="110" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">&bull; Rekeys &amp; lockbox code</text>
    <text x="16" y="128" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">&bull; Grass cut &amp; winterization</text>
    <text x="16" y="146" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">&bull; B / D / A Date-Stamped Photos</text>
    <rect x="14" y="152" width="202" height="18" rx="3" fill="#fef2f2" />
    <text x="20" y="165" fill="#991b1b" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Missing shot = zero billing</text>
  </g>

  <!-- ==================== BOTTOM LEGEND & AXIOM ==================== -->
  <g transform="translate(60, 615)">
    <!-- Legend -->
    <line x1="0" y1="12" x2="30" y2="12" stroke="#f59e0b" stroke-width="3" />
    <text x="38" y="16" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Mandatory Custodial Flow</text>

    <line x1="210" y1="12" x2="240" y2="12" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="248" y="16" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Contract-Specific Routes</text>

    <line x1="430" y1="12" x2="460" y2="12" stroke="#14b8a6" stroke-width="3" />
    <text x="468" y="16" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Verified Quality Proof Path</text>

    <!-- Axiom -->
    <text x="1080" y="16" fill="#f59e0b" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="end">
      PERMISSION FIRST. PROOF ALWAYS.
    </text>
  </g>

  <!-- Asset Label -->
  <text x="1140" y="660" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="end">Asset ID: M1_visual_06 &bull; D-04</text>
</svg>