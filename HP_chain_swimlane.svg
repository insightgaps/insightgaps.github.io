<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="100%" style="background-color: #F9F8F6; font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <filter id="hpSwimShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1A1917" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="15" y="15" width="850" height="350" rx="10" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.5" filter="url(#hpSwimShadow)"/>

  <!-- Title -->
  <g transform="translate(35, 40)">
    <rect x="0" y="0" width="150" height="22" rx="3" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1"/>
    <text x="8" y="15" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#7A4F0A" letter-spacing="1">INDUSTRY ARCHITECTURE</text>
    <text x="170" y="16" font-size="18" font-weight="700" fill="#1A1917">The Custodial Chain &amp; Internal Office Engine</text>
  </g>

  <!-- 5 Chain Stages Horizontal -->
  <g transform="translate(35, 80)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="145" height="50" rx="4" fill="#F9F8F6" stroke="#1A1917" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#1A1917">1. Lender / Bank</text>
    <text x="12" y="38" font-size="10" fill="#5C5954">Collateral capital</text>

    <!-- Arrow -->
    <path d="M 152 25 L 163 25" stroke="#9A620C" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2 -->
    <rect x="168" y="0" width="145" height="50" rx="4" fill="#F9F8F6" stroke="#1A1917" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#1A1917">2. Servicer</text>
    <text x="12" y="38" font-size="10" fill="#5C5954">Default &amp; loan rules</text>

    <!-- Arrow -->
    <path d="M 320 25 L 331 25" stroke="#9A620C" stroke-width="2"/>

    <!-- Stage 3 -->
    <rect x="336" y="0" width="145" height="50" rx="4" fill="#F9F8F6" stroke="#1A1917" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#1A1917">3. National</text>
    <text x="12" y="38" font-size="10" fill="#5C5954">Multi-state vendor</text>

    <!-- Arrow -->
    <path d="M 488 25 L 499 25" stroke="#9A620C" stroke-width="2"/>

    <!-- Stage 4 -->
    <rect x="504" y="0" width="145" height="50" rx="4" fill="#FDF3E3" stroke="#9A620C" stroke-width="1.5"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#7A4F0A">4. Our Office</text>
    <text x="12" y="38" font-size="10" fill="#9A620C">Audit, prep &amp; billing</text>

    <!-- Arrow -->
    <path d="M 656 25 L 667 25" stroke="#9A620C" stroke-width="2"/>

    <!-- Stage 5 -->
    <rect x="672" y="0" width="140" height="50" rx="4" fill="#F9F8F6" stroke="#1A1917" stroke-width="1.2"/>
    <text x="12" y="22" font-size="12" font-weight="700" fill="#1A1917">5. Field Crew</text>
    <text x="12" y="38" font-size="10" fill="#1A6B3C">Hands on property</text>
  </g>

  <!-- Internal Office Swimlane (Stage 4 Zoom) -->
  <g transform="translate(35, 160)">
    <rect x="0" y="0" width="812" height="150" rx="6" fill="#F9F8F6" stroke="#E2E0DC" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#9A620C" letter-spacing="1">INTERNAL OFFICE ENGINE — THREE DESKS &amp; THE RFO GATE</text>

    <!-- Desk 1: Vendor Manager -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="225" height="85" rx="4" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1A1917">Vendor Manager</text>
      <text x="14" y="40" font-family="'Space Mono', monospace" font-size="9" fill="#9A620C">DISPATCH &amp; AUTHORITY</text>
      <text x="14" y="60" font-size="11" fill="#5C5954">Clears permission gate, verifies lockbox, assigns crew territory.</text>
    </g>

    <!-- Handoff Arrow -->
    <path d="M 252 82 L 268 82" stroke="#9A620C" stroke-width="1.5"/>

    <!-- Desk 2: Processor -->
    <g transform="translate(275, 40)">
      <rect x="0" y="0" width="225" height="85" rx="4" fill="#FFFFFF" stroke="#E2E0DC" stroke-width="1.2"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#1A1917">Processor</text>
      <text x="14" y="40" font-family="'Space Mono', monospace" font-size="9" fill="#9A620C">PROVE &amp; PREPARE</text>
      <text x="14" y="60" font-size="11" fill="#5C5954">Tags photos, checks CY math, prepares invoice. Stops at Ready.</text>
    </g>

    <!-- Handoff to RFO Gate -->
    <path d="M 507 82 L 523 82" stroke="#9A620C" stroke-width="1.5"/>

    <!-- Desk 3 / Approver: Client Manager & Owner Gate -->
    <g transform="translate(530, 40)">
      <rect x="0" y="0" width="260" height="85" rx="4" fill="#FDF3E3" stroke="#E8C07A" stroke-width="1.5"/>
      <text x="14" y="22" font-size="13" font-weight="700" fill="#7A4F0A">Client Manager &amp; Approver</text>
      <text x="14" y="40" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#DC2626">THE OWNER RFO GATE</text>
      <text x="14" y="60" font-size="11" fill="#5C5954">Owner marks Ready For Office. CM submits to portal and tracks payment.</text>
    </g>
  </g>

  <!-- Cardinal Rule Banner -->
  <g transform="translate(35, 332)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#1A6B3C">CARDINAL CONTROL: "Permission first. Proof always. Gaps go back — never papered over."</text>
  </g>
</svg>
