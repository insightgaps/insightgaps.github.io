      <text x="12" y="33" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• -$200 (Bid → Allowable): Owned by <tspan fill="#38bdf8" font-weight="700">Processor</tspan> ($120 unallowable + $80 missing photos)</text>
      <text x="12" y="45" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• -$100 (Allowable → Approved): Owned by <tspan fill="#38bdf8" font-weight="700">Vendor Manager</tspan> (unapproved over-allowable work)</text>
      <text x="12" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• -$150 (Invoiced → Paid): Owned by <tspan fill="#38bdf8" font-weight="700">Client Manager &amp; Processor</tspan> (unappealed short-pays)</text>
