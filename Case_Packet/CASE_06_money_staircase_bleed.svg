    <rect x="24" y="218" width="392" height="26" rx="4" fill="#0b1322"/>
    <text x="34" y="235" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">TOTAL REMITTANCE: $550 RECEIVED • $450 LOSS EXPLAINED</text>
