      <text x="37" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1. BID</text>
      <text x="37" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$1,000</text>

      <!-- Bleed 1 -->
      <path d="M 77 21 L 95 38" stroke="#ef4444" stroke-width="2"/>
      <text x="86" y="15" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">-$200</text>

      <!-- Step 2: ALLOWABLE -->
      <rect x="97" y="24" width="85" height="42" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="139" y="42" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">2. ALLOWABLE</text>
      <text x="139" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$800</text>

