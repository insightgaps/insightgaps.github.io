      <text x="47" y="35" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">REJECTED</text>

      <rect x="100" y="22" width="94" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="147" y="35" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SHORT-PAID</text>

      <rect x="200" y="22" width="96" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="248" y="35" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">UNALLOWABLE</text>

      <rect x="0" y="46" width="94" height="20" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="47" y="59" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">ADJUSTED</text>

      <rect x="100" y="46" width="94" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="147" y="59" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">CHAIN-PAID</text>

      <rect x="200" y="46" width="96" height="20" rx="3" fill="#2d1520" stroke="#f43f5e" stroke-width="1"/>
      <text x="248" y="59" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">UNEXPLAINED</text>
    </g>

    <rect x="20" y="218" width="300" height="26" rx="4" fill="#0b1322"/>
    <text x="30" y="235" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">UNEXPLAINED IS A QUEUE, NEVER AN ANSWER (CM review weekly)</text>
  </g>

  <!-- Bottom Strip: The Chain Detective (Address Matching) -->
  <g transform="translate(40, 350)" filter="url(#shadow6)">
    <rect width="800" height="115" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CHAIN DETECTIVE: ADDRESS MATCHING PRINCIPLE (MATCH BY ADDRESS, NEVER NUMBER)</text>

    <g transform="translate(24, 40)">
      <!-- Order A -->
      <rect width="320" height="58" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="20" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">ORDER A • WO-10492 • $0 PAID</text>
      <text x="12" y="34" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Property: 1142 Maplewood Terrace</text>
      <text x="12" y="47" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Portal shows closed with $0 remittance</text>

      <path d="M 330 69 L 360 69" stroke="#fca311" stroke-width="2"/>
      <text x="345" y="60" fill="#fca311" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">→</text>

      <!-- Order B -->
      <rect x="370" width="390" height="58" rx="6" fill="#172e2b" stroke="#10b981" stroke-width="1.2"/>
      <text x="382" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">ORDER B • WO-10811 • $420 REMITTANCE ARRIVED</text>
      <text x="382" y="34" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Property: 1142 Maplewood Terrace (Same address! Follow-up chain)</text>
      <text x="382" y="47" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">VERDICT: Order A is NOT unpaid. It is CHAIN-PAID under Order B.</text>
    </g>
