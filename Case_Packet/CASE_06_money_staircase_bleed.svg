      <path d="M 184 45 L 202 62" stroke="#ef4444" stroke-width="2"/>
      <text x="193" y="38" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">-$100</text>

