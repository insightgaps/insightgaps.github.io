      <text x="348" y="116" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">5. PAID</text>
      <text x="348" y="132" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">$550</text>
