      <text x="244" y="66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">3. APPROVED</text>
      <text x="244" y="82" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$700</text>

      <!-- Step 4: INVOICED -->
      <path d="M 286 69 L 304 69" stroke="#10b981" stroke-width="2"/>
      <text x="295" y="62" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700">$0</text>

      <rect x="306" y="48" width="76" height="42" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="344" y="66" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">4. INVOICED</text>
      <text x="344" y="82" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$700</text>

      <!-- Bleed 3 -->
      <path d="M 384 69 L 402 88" stroke="#ef4444" stroke-width="2"/>
      <text x="393" y="62" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">-$150</text>

