    <line x1="0" y1="330" x2="880" y2="330"/>
    <line x1="0" y1="385" x2="880" y2="385"/>
    <line x1="0" y1="440" x2="880" y2="440"/>
    <line x1="110" y1="0" x2="110" y2="495"/>
    <line x1="220" y1="0" x2="220" y2="495"/>
    <line x1="330" y1="0" x2="330" y2="495"/>
    <line x1="440" y1="0" x2="440" y2="495"/>
