      <line x1="0" y1="0" x2="0" y2="-44" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>
      <!-- Current Needle (dropped to 23 PSI) -->
      <line x1="0" y1="0" x2="30" y2="-12" stroke="#ef4444" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="4" fill="#ef4444"/>
