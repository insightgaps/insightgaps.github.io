      <text x="480" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">Opposite corner photos</text>
      <text x="480" y="54" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="7.5">Broom-swept empty</text>

      <!-- Trade 5 -->
      <rect x="625" width="140" height="58" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="635" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">5. INSPECTION</text>
      <text x="635" y="32" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Fixes nothing on site</text>
      <text x="635" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">Written condition report</text>
      <text x="635" y="54" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="7.5">Report IS the product</text>
