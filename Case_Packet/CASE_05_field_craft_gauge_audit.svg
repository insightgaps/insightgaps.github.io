      <text x="10" y="44" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Dropped 12 PSI in 15 min</text>
      <text x="10" y="56" fill="#fca311" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">Tech checked "Pass" (FRAUD)</text>

