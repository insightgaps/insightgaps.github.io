      <line x1="34" y1="-34" x2="28" y2="-28" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="48" y1="0" x2="40" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="34" y1="34" x2="28" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="-34" y1="-34" x2="-28" y2="-28" stroke="#94a3b8" stroke-width="1.5"/>
