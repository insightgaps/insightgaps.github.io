      <text x="320" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">Pink antifreeze in traps</text>
      <text x="320" y="54" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="7.5">35 PSI pressure gauge</text>

      <!-- Trade 4 -->
