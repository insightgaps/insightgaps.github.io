      <text x="12" y="70" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">ACTUAL: 4.44 CY  •  BILLED: 9.0 CY  (OVERBILL DETECTED!)</text>
